version: 2

###############################################################################
# Updates
###############################################################################

updates:

###############################################################################
# Python
###############################################################################

  - package-ecosystem: "pip"

    directory: "/"

    schedule:

      interval: "weekly"

      day: "monday"

      time: "03:00"

      timezone: "UTC"

    open-pull-requests-limit: 10

    reviewers:

      - "sakshinekkala28"

    assignees:

      - "sakshinekkala28"

    labels:

      - "dependencies"

      - "python"

      - "security"

    commit-message:

      prefix: "deps"

      include: "scope"

    rebase-strategy: "auto"

###############################################################################
# GitHub Actions
###############################################################################

  - package-ecosystem: "github-actions"

    directory: "/"

    schedule:

      interval: "weekly"

      day: "monday"

      time: "03:15"

      timezone: "UTC"

    reviewers:

      - "sakshinekkala28"

    labels:

      - "dependencies"

      - "github-actions"

###############################################################################
# Docker
###############################################################################

  - package-ecosystem: "docker"

    directory: "/infrastructure/docker"

    schedule:

      interval: "weekly"

      day: "monday"

      time: "03:30"

      timezone: "UTC"

    reviewers:

      - "sakshinekkala28"

    labels:

      - "docker"

      - "dependencies"

###############################################################################
# Terraform
###############################################################################

  - package-ecosystem: "terraform"

    directory: "/infrastructure/terraform"

    schedule:

      interval: "weekly"

      day: "monday"

      time: "03:45"

      timezone: "UTC"

    reviewers:

      - "sakshinekkala28"

    labels:

      - "terraform"

      - "dependencies"

###############################################################################
# Helm
###############################################################################

  - package-ecosystem: "helm"

    directory: "/infrastructure/helm"

    schedule:

      interval: "weekly"

      day: "monday"

      time: "04:00"

      timezone: "UTC"

    reviewers:

      - "sakshinekkala28"

    labels:

      - "helm"

      - "dependencies"

###############################################################################
# Dev Container
###############################################################################

  - package-ecosystem: "devcontainers"

    directory: "/"

    schedule:

      interval: "monthly"

    reviewers:

      - "sakshinekkala28"

    labels:

      - "devcontainer"

###############################################################################
# Docker (Root)
###############################################################################

  - package-ecosystem: "docker"

    directory: "/"

    schedule:

      interval: "monthly"

    reviewers:

      - "sakshinekkala28"

    labels:

      - "docker"

###############################################################################
# Ignore Rules
###############################################################################

    ignore:

      - dependency-name: "*"

        update-types:

          - "version-update:semver-major"