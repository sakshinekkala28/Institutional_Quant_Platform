name: ❓ Question

description: Ask a question about using, configuring, or extending the Institutional Quant Platform.

title: "[QUESTION]: "

labels:

  - question

  - support

assignees:

  - sakshinekkala28

body:

###############################################################################
# Introduction
###############################################################################

  - type: markdown

    attributes:

      value: |

        ## Question

        Before submitting, please:

        - Review the documentation
        - Search existing issues
        - Search GitHub Discussions (if enabled)

###############################################################################
# Question
###############################################################################

  - type: textarea

    id: question

    attributes:

      label: Your Question

      description: Clearly describe your question.

      placeholder: What would you like help with?

    validations:

      required: true

###############################################################################
# Category
###############################################################################

  - type: dropdown

    id: category

    attributes:

      label: Category

      options:

        - Installation

        - Configuration

        - Usage

        - API

        - Analytics

        - Alpha Engine

        - Portfolio Engine

        - Risk Engine

        - Execution Engine

        - Dashboard

        - Data Pipeline

        - Machine Learning

        - Docker

        - Kubernetes

        - Helm

        - Terraform

        - CI/CD

        - Monitoring

        - Security

        - Documentation

        - Development

        - Performance

        - Other

    validations:

      required: true

###############################################################################
# Environment
###############################################################################

  - type: dropdown

    id: environment

    attributes:

      label: Environment

      options:

        - Local

        - Development

        - Staging

        - Production

        - GitHub Codespaces

        - GitHub Actions

        - Other

###############################################################################
# Version
###############################################################################

  - type: input

    id: version

    attributes:

      label: Platform Version

      placeholder: v1.0.0

###############################################################################
# What Have You Tried?
###############################################################################

  - type: textarea

    id: tried

    attributes:

      label: What Have You Tried?

      description: Describe what you've already attempted.

###############################################################################
# Expected Outcome
###############################################################################

  - type: textarea

    id: expected

    attributes:

      label: Expected Outcome

      description: What are you trying to achieve?

###############################################################################
# Logs / Output
###############################################################################

  - type: textarea

    id: logs

    attributes:

      label: Logs / Terminal Output

      render: shell

###############################################################################
# Additional Context
###############################################################################

  - type: textarea

    id: context

    attributes:

      label: Additional Context

      description: Add screenshots, configuration snippets, links, or any additional information.

###############################################################################
# Checklist
###############################################################################

  - type: checkboxes

    id: checklist

    attributes:

      label: Checklist

      options:

        - label: I searched the documentation.

        - label: I searched existing issues.

        - label: I searched GitHub Discussions (if available).

        - label: I included relevant logs or screenshots.

        - label: I provided enough information to reproduce or understand my question.
