name: 🔒 Security Report

description: Report a security issue, vulnerability, or security concern.

title: "[SECURITY]: "

labels:

  - security

  - triage

assignees:

  - sakshinekkala28

body:

###############################################################################
# Introduction
###############################################################################

  - type: markdown

    attributes:

      value: |

        ## Security Report

        Thank you for helping improve the security of the Institutional Quant Platform.

        ⚠️ **Do NOT use this form for confidential or zero-day vulnerabilities.**

        Please use the private disclosure process described in SECURITY.md for sensitive reports.

###############################################################################
# Summary
###############################################################################

  - type: textarea

    id: summary

    attributes:

      label: Security Issue Summary

      description: Briefly describe the security concern.

      placeholder: Describe the issue.

    validations:

      required: true

###############################################################################
# Vulnerability Type
###############################################################################

  - type: dropdown

    id: vulnerability

    attributes:

      label: Vulnerability Type

      options:

        - Authentication

        - Authorization

        - Broken Access Control

        - Injection

        - Cross-Site Scripting (XSS)

        - Cross-Site Request Forgery (CSRF)

        - Server-Side Request Forgery (SSRF)

        - Remote Code Execution

        - Sensitive Data Exposure

        - Secrets Management

        - Dependency Vulnerability

        - Container Security

        - Kubernetes Security

        - Terraform Misconfiguration

        - API Security

        - Cryptography

        - Denial of Service

        - Supply Chain

        - Other

    validations:

      required: true

###############################################################################
# Severity
###############################################################################

  - type: dropdown

    id: severity

    attributes:

      label: Severity

      options:

        - Critical

        - High

        - Medium

        - Low

    validations:

      required: true

###############################################################################
# Affected Component
###############################################################################

  - type: dropdown

    id: component

    attributes:

      label: Affected Component

      options:

        - API

        - Analytics

        - Dashboard

        - Alpha Engine

        - Portfolio Engine

        - Risk Engine

        - Execution Engine

        - Data Pipeline

        - Docker

        - Kubernetes

        - Helm

        - Terraform

        - CI/CD

        - Monitoring

        - Documentation

        - Other

    validations:

      required: true

###############################################################################
# Environment
###############################################################################

  - type: dropdown

    id: environment

    attributes:

      label: Environment

      options:

        - Local

        - Development

        - Staging

        - Production

###############################################################################
# Description
###############################################################################

  - type: textarea

    id: description

    attributes:

      label: Detailed Description

      description: Explain the security issue in detail.

    validations:

      required: true

###############################################################################
# Reproduction
###############################################################################

  - type: textarea

    id: reproduce

    attributes:

      label: Steps to Reproduce

      placeholder: |

        1.

        2.

        3.

###############################################################################
# Impact
###############################################################################

  - type: textarea

    id: impact

    attributes:

      label: Security Impact

      description: Describe the potential impact if exploited.

    validations:

      required: true

###############################################################################
# Mitigation
###############################################################################

  - type: textarea

    id: mitigation

    attributes:

      label: Suggested Mitigation

      description: Optional recommendations for resolving the issue.

###############################################################################
# References
###############################################################################

  - type: textarea

    id: references

    attributes:

      label: References

      description: CVEs, CWEs, OWASP guidance, advisories, or other references.

###############################################################################
# Evidence
###############################################################################

  - type: textarea

    id: evidence

    attributes:

      label: Logs / Screenshots / Proof of Concept

      description: |

        Remove or redact any secrets, credentials, tokens, or personal information
        before attaching evidence.

###############################################################################
# Additional Context
###############################################################################

  - type: textarea

    id: context

    attributes:

      label: Additional Context

###############################################################################
# Checklist
###############################################################################

  - type: checkboxes

    id: checklist

    attributes:

      label: Checklist

      options:

        - label: I searched existing security issues.

        - label: This report does not contain secrets or credentials.

        - label: I have redacted sensitive information.

        - label: I have included sufficient details for investigation.

        - label: I understand that confidential vulnerabilities should be reported using the private disclosure process described in SECURITY.md.