###############################################################################
# Institutional Quant Platform
# Stale Issue & Pull Request Configuration
###############################################################################

###############################################################################
# General
###############################################################################

daysUntilStale: 60

daysUntilClose: 14

onlyLabels: []

anyOfLabels: []

exemptLabels:

  - pinned

  - security

  - critical

  - high-priority

  - enhancement

  - roadmap

  - in-progress

  - dependencies

  - release

###############################################################################
# Issues
###############################################################################

staleIssueLabel: stale

markComment: |

  This issue has been automatically marked as **stale** because it has had no
  activity for **60 days**.

  If this issue is still relevant, simply comment or push new changes to remove
  the stale label.

  Thank you for contributing to the Institutional Quant Platform.

closeComment: |

  This issue has been automatically closed because it remained inactive for
  **14 additional days** after being marked stale.

  If the issue is still relevant, please open a new issue referencing this one.

###############################################################################
# Pull Requests
###############################################################################

stalePrLabel: stale

markPrComment: |

  This pull request has been automatically marked as **stale** due to inactivity.

  Please update the branch or respond to reviewer comments to keep it active.

closePrComment: |

  This pull request has been automatically closed because it remained inactive
  after being marked stale.

  Feel free to reopen it after addressing the requested changes.

###############################################################################
# Exemptions
###############################################################################

exemptDraftPr: true

exemptAllMilestones: false

exemptAllAssignees: false

exemptProjects: false

exemptProjectCards: false

###############################################################################
# Operations
###############################################################################

deleteBranch: false

removeStaleWhenUpdated: true

ascending: false

debugOnly: false

###############################################################################
# Limits
###############################################################################

operationsPerRun: 100

###############################################################################
# Labels
###############################################################################

labelsToRemoveWhenUnstale:

  - stale
