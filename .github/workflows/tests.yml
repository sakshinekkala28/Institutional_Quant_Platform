name: Test Suite

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

env:
  COVERAGE_THRESHOLD: 85

jobs:

  test:

    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-xdist coverage

      - name: Execute Unit Tests
        run: |
          pytest \
            tests/unit \
            -n auto \
            --cov=. \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing

      - name: Execute Integration Tests
        run: |
          if [ -d tests/integration ]; then
            pytest tests/integration
          fi

      - name: Execute Performance Tests
        run: |
          if [ -d tests/performance ]; then
            pytest tests/performance
          fi

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/

      - name: Coverage Threshold Check
        run: |
          coverage report --fail-under=${{ env.COVERAGE_THRESHOLD }}

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            .pytest_cache
            coverage.xml
            htmlcov/

  summary:

    name: Test Summary

    runs-on: ubuntu-latest

    needs:
      - test

    steps:

      - name: Test Summary
        run: |
          echo "======================================"
          echo "Institutional Quant Platform"
          echo "Test Suite Completed"
          echo "======================================"
          echo ""
          echo "Python Versions Tested:"
          echo " - 3.11"
          echo " - 3.12"
          echo ""
          echo "Coverage Threshold:"
          echo "${{ env.COVERAGE_THRESHOLD }}%"