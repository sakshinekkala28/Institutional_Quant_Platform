name: Test Suite

###############################################################################
# Triggers
###############################################################################

on:
  push:
    branches:
      - main
      - develop
      - staging

  pull_request:
    branches:
      - main
      - develop
      - staging

  workflow_dispatch:

###############################################################################
# Permissions
###############################################################################

permissions:
  contents: read

###############################################################################
# Concurrency
###############################################################################

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

###############################################################################
# Environment
###############################################################################

env:
  COVERAGE_THRESHOLD: 85

###############################################################################
# Jobs
###############################################################################

jobs:

###############################################################################
# Test Pipeline
###############################################################################

  test:

    name: Python ${{ matrix.python-version }}

    runs-on: ubuntu-latest

    timeout-minutes: 45

    strategy:

      fail-fast: false

      matrix:

        python-version:

          - "3.11"

          - "3.12"

    defaults:

      run:

        shell: bash

###############################################################################
# Steps
###############################################################################

    steps:

###############################################################################
# Checkout Repository
###############################################################################

      - name: Checkout Repository

        uses: actions/checkout@v4

###############################################################################
# Setup Python
###############################################################################

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: ${{ matrix.python-version }}

          cache: pip

###############################################################################
# Cache Dependencies
###############################################################################

      - name: Cache Python Packages

        uses: actions/cache@v4

        with:

          path: |

            ~/.cache/pip

          key: |

            test-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('requirements*.txt','pyproject.toml') }}

          restore-keys: |

            test-${{ runner.os }}-${{ matrix.python-version }}-

###############################################################################
# Upgrade pip
###############################################################################

      - name: Upgrade pip

        run: |

          python -m pip install --upgrade pip

###############################################################################
# Install Dependencies
###############################################################################

      - name: Install Dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt

          if [ -f requirements-dev.txt ]; then

            pip install -r requirements-dev.txt

          fi

###############################################################################
# Environment Information
###############################################################################

      - name: Environment Information

        run: |

          echo "======================================================"

          echo "Institutional Quant Platform"

          echo "Python Test Suite"

          echo "======================================================"

          echo

          echo "Repository : ${{ github.repository }}"

          echo "Branch     : ${{ github.ref_name }}"

          echo "Commit     : ${{ github.sha }}"

          echo "Python     : ${{ matrix.python-version }}"

          echo

          python --version

          pip --version

          echo

          echo "======================================================"

###############################################################################
# Unit Tests
###############################################################################

      - name: Execute Unit Tests

        run: |

          pytest \
            tests/unit \
            -n auto \
            --cov=. \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing

###############################################################################
# Integration Tests
###############################################################################

      - name: Execute Integration Tests

        run: |

          if [ -d tests/integration ]; then

            pytest tests/integration

          fi

###############################################################################
# Performance Tests
###############################################################################

      - name: Execute Performance Tests

        run: |

          if [ -d tests/performance ]; then

            pytest tests/performance

          fi

###############################################################################
# Coverage Threshold
###############################################################################

      - name: Coverage Threshold Check

        run: |

          coverage report --fail-under=${{ env.COVERAGE_THRESHOLD }}

###############################################################################
# Upload Coverage
###############################################################################

      - name: Upload Coverage Report

        uses: actions/upload-artifact@v4

        with:

          name: coverage-${{ matrix.python-version }}

          path: |

            coverage.xml

            htmlcov/

          if-no-files-found: ignore

###############################################################################
# Upload Test Results
###############################################################################

      - name: Upload Test Results

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: test-results-${{ matrix.python-version }}

          path: |

            .pytest_cache

            coverage.xml

            htmlcov/

          if-no-files-found: ignore

###############################################################################
# Test Summary
###############################################################################

      - name: Publish Test Summary

        if: always()

        run: |

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"

          # Test Results

          ## Python

          - ${{ matrix.python-version }}

          ## Executed

          - ✅ Unit Tests

          - ✅ Integration Tests

          - ✅ Performance Tests

          - ✅ Coverage Report

          - ✅ Coverage Threshold Check

          EOF

###############################################################################
# Summary Job
###############################################################################

  summary:

    name: Test Summary

    if: always()

    needs:

      - test

    runs-on: ubuntu-latest

    steps:

      - name: Pipeline Summary

        run: |

          echo "======================================================"

          echo "Institutional Quant Platform"

          echo "Enterprise Test Suite"

          echo "======================================================"

          echo

          echo "Repository"

          echo "${{ github.repository }}"

          echo

          echo "Branch"

          echo "${{ github.ref_name }}"

          echo

          echo "Commit"

          echo "${{ github.sha }}"

          echo

          echo "Coverage Threshold"

          echo "${{ env.COVERAGE_THRESHOLD }}%"

          echo

          echo "Python Versions"

          echo "✔ 3.11"

          echo "✔ 3.12"

          echo

          echo "Test Job"

          echo "${{ needs.test.result }}"

          echo

          echo "======================================================"

          echo "Completed"

          echo "======================================================"

          echo "✔ Unit Tests"

          echo "✔ Integration Tests"

          echo "✔ Performance Tests"

          echo "✔ Coverage Report"

          echo "✔ Coverage Threshold"

          echo "✔ Artifact Upload"

          echo

          echo "======================================================"
