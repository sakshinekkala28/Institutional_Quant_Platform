name: Enterprise Release Pipeline

###############################################################################
# Triggers
###############################################################################

on:

  push:

    tags:

      - "v*.*.*"

  workflow_dispatch:

    inputs:

      version:

        description: Release Version

        required: true

        default: v1.0.0

      prerelease:

        description: Publish as prerelease

        type: boolean

        default: false

###############################################################################
# Permissions
###############################################################################

permissions:

  contents: write

  packages: write

  id-token: write

  attestations: write

###############################################################################
# Concurrency
###############################################################################

concurrency:

  group: release-${{ github.ref }}

  cancel-in-progress: false

###############################################################################
# Environment
###############################################################################

env:

  PYTHON_VERSION: "3.12"

  HELM_VERSION: "3.18.4"

  REGISTRY: ghcr.io

###############################################################################
# Jobs
###############################################################################

jobs:

###############################################################################
# Release Preparation
###############################################################################

  prepare:

    name: Prepare Enterprise Release

    runs-on: ubuntu-latest

    timeout-minutes: 30

    outputs:

      version: ${{ steps.version.outputs.version }}

    steps:

###############################################################################
# Checkout
###############################################################################

      - name: Checkout Repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 0

###############################################################################
# Python
###############################################################################

      - name: Setup Python

        uses: actions/setup-python@v7

        with:

          python-version: ${{ env.PYTHON_VERSION }}

          cache: pip

###############################################################################
# Helm
###############################################################################

      - name: Setup Helm

        uses: azure/setup-helm@v4

        with:

          version: ${{ env.HELM_VERSION }}

###############################################################################
# Git
###############################################################################

      - name: Configure Git

        run: |

          git config --global user.name "github-actions"

          git config --global user.email \
            "github-actions@users.noreply.github.com"

###############################################################################
# Version
###############################################################################

      - name: Resolve Version

        id: version

        run: |

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            VERSION="${{ github.event.inputs.version }}"

          else

            VERSION="${GITHUB_REF#refs/tags/}"

          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

###############################################################################
# Semantic Version Validation
###############################################################################

      - name: Validate Semantic Version

        run: |

          if ! echo "${VERSION}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then

            echo "Invalid semantic version."

            exit 1

          fi

###############################################################################
# Previous Release
###############################################################################

      - name: Detect Previous Tag

        id: previous

        run: |

          TAG=$(git describe \
            --tags \
            --abbrev=0 \
            HEAD^ \
            2>/dev/null || true)

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

###############################################################################
# Metadata
###############################################################################

      - name: Generate Build Metadata

        run: |

          mkdir -p release

          cat > release/build-info.json <<EOF
          {
            "repository":"${{ github.repository }}",
            "version":"${VERSION}",
            "branch":"${{ github.ref_name }}",
            "commit":"${{ github.sha }}",
            "workflow":"${{ github.workflow }}",
            "run":"${{ github.run_number }}",
            "generated":"$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

###############################################################################
# Upload Metadata
###############################################################################

      - name: Upload Metadata

        uses: actions/upload-artifact@v4

        with:

          name: release-metadata

          path: release/build-info.json

###############################################################################
# Generate Changelog
###############################################################################

      - name: Generate Changelog

        run: |

          mkdir -p release

          if [ -n "${{ steps.previous.outputs.tag }}" ]; then

            git log \
              "${{ steps.previous.outputs.tag }}"..HEAD \
              --pretty=format:"- %s (%an)" \
              > release/CHANGELOG.md

          else

            git log \
              --pretty=format:"- %s (%an)" \
              > release/CHANGELOG.md

          fi

###############################################################################
# Repository Statistics
###############################################################################

      - name: Repository Statistics

        run: |

          echo "COMMITS=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

          echo "CONTRIBUTORS=$(git shortlog -sn | wc -l)" >> "$GITHUB_ENV"

          echo "FILES=$(git ls-files | wc -l)" >> "$GITHUB_ENV"

###############################################################################
# Release Notes
###############################################################################

      - name: Generate Release Notes

        run: |

          cat > release/RELEASE_NOTES.md <<EOF
          # Institutional Quant Platform

          ## ${VERSION}

          Repository: ${{ github.repository }}

          Branch: ${{ github.ref_name }}

          Commit: ${{ github.sha }}

          ---

          ### Statistics

          - Commits: ${COMMITS}

          - Contributors: ${CONTRIBUTORS}

          - Files: ${FILES}

          ---

          ### Changelog

          EOF

          cat release/CHANGELOG.md >> release/RELEASE_NOTES.md

###############################################################################
# Verify Notes
###############################################################################

      - name: Verify Release Notes

        run: |

          cat release/RELEASE_NOTES.md

###############################################################################
# Create GitHub Release
###############################################################################

      - name: Create GitHub Release

        id: release

        uses: softprops/action-gh-release@v2

        with:

          tag_name: ${{ steps.version.outputs.version }}

          name: Institutional Quant Platform ${{ steps.version.outputs.version }}

          body_path: release/RELEASE_NOTES.md

          draft: false

          prerelease: ${{ github.event.inputs.prerelease == true }}

          generate_release_notes: true

###############################################################################
# Upload Documentation
###############################################################################

      - name: Upload Release Documents

        uses: actions/upload-artifact@v4

        with:

          name: release-documents

          path: |

            release/CHANGELOG.md

            release/RELEASE_NOTES.md

###############################################################################
# Job Summary
###############################################################################

      - name: Publish Summary

        run: |

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"

          # Enterprise Release

          ## Version

          ${VERSION}

          ## Completed

          - Semantic Version Validation

          - Build Metadata

          - Changelog

          - Release Notes

          - GitHub Release

          EOF

###############################################################################
# Build and Publish
###############################################################################

  publish:

    name: Build & Publish Release

    runs-on: ubuntu-latest

    timeout-minutes: 90

    needs:

      - prepare

    env:

      VERSION: ${{ needs.prepare.outputs.version }}

    permissions:

      contents: read

      packages: write

      id-token: write

      attestations: write

    steps:

###############################################################################
# Checkout Repository
###############################################################################

      - name: Checkout Repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 0

###############################################################################
# Login to GitHub Container Registry
###############################################################################

      - name: Login to GHCR

        uses: docker/login-action@v3

        with:

          registry: ghcr.io

          username: ${{ github.actor }}

          password: ${{ secrets.GITHUB_TOKEN }}

###############################################################################
# Setup Docker Buildx
###############################################################################

      - name: Setup Docker Buildx

        uses: docker/setup-buildx-action@v3

###############################################################################
# Install Helm
###############################################################################

      - name: Setup Helm

        uses: azure/setup-helm@v4

        with:

          version: "3.18.4"

###############################################################################
# Install Cosign
###############################################################################

      - name: Install Cosign

        uses: sigstore/cosign-installer@v3

###############################################################################
# Docker Metadata
###############################################################################

      - name: Docker Metadata

        id: metadata

        uses: docker/metadata-action@v5

        with:

          images: |

            ghcr.io/${{ github.repository_owner }}/institutional-quant-api

            ghcr.io/${{ github.repository_owner }}/institutional-quant-analytics

            ghcr.io/${{ github.repository_owner }}/institutional-quant-dashboard

          tags: |

            type=raw,value=${{ steps.version.outputs.version }}

            type=raw,value=latest

###############################################################################
# Build API Image
###############################################################################

      - name: Build API Image

        uses: docker/build-push-action@v6

        with:

          context: .

          file: infrastructure/docker/Dockerfile.api

          platforms: linux/amd64,linux/arm64

          push: true

          provenance: true

          sbom: true

          cache-from: type=gha

          cache-to: type=gha,mode=max

          tags: |

            ghcr.io/${{ github.repository_owner }}/institutional-quant-api:${{ steps.version.outputs.version }}

            ghcr.io/${{ github.repository_owner }}/institutional-quant-api:latest

###############################################################################
# Build Analytics Image
###############################################################################

      - name: Build Analytics Image

        uses: docker/build-push-action@v6

        with:

          context: .

          file: infrastructure/docker/Dockerfile.analytics

          platforms: linux/amd64,linux/arm64

          push: true

          provenance: true

          sbom: true

          cache-from: type=gha

          cache-to: type=gha,mode=max

          tags: |

            ghcr.io/${{ github.repository_owner }}/institutional-quant-analytics:${{ steps.version.outputs.version }}

            ghcr.io/${{ github.repository_owner }}/institutional-quant-analytics:latest

###############################################################################
# Build Dashboard Image
###############################################################################

      - name: Build Dashboard Image

        uses: docker/build-push-action@v6

        with:

          context: .

          file: infrastructure/docker/Dockerfile.dashboard

          platforms: linux/amd64,linux/arm64

          push: true

          provenance: true

          sbom: true

          cache-from: type=gha

          cache-to: type=gha,mode=max

          tags: |

            ghcr.io/${{ github.repository_owner }}/institutional-quant-dashboard:${{ steps.version.outputs.version }}

            ghcr.io/${{ github.repository_owner }}/institutional-quant-dashboard:latest

###############################################################################
# Package Helm Chart
###############################################################################

      - name: Package Helm Chart

        working-directory: infrastructure/helm

        run: |

          mkdir -p packages

          helm dependency build

          helm package . \

            --destination packages

###############################################################################
# Login to Helm OCI Registry
###############################################################################

      - name: Login to Helm Registry

        working-directory: infrastructure/helm

        run: |

          echo "${{ secrets.GITHUB_TOKEN }}" | \

          helm registry login ghcr.io \

            --username "${{ github.actor }}" \

            --password-stdin

###############################################################################
# Publish Helm Chart
###############################################################################

      - name: Publish Helm Chart

        working-directory: infrastructure/helm

        run: |

          helm push \

            packages/*.tgz \

            oci://ghcr.io/${{ github.repository_owner }}/charts

###############################################################################
# Generate SHA256 Checksums
###############################################################################

      - name: Generate Checksums

        run: |

          mkdir -p release/checksums

          sha256sum infrastructure/helm/packages/*.tgz \

            > release/checksums/SHA256SUMS

###############################################################################
# Sign API Image
###############################################################################

      - name: Sign API Image

        env:

          COSIGN_EXPERIMENTAL: "true"

        run: |

          cosign sign --yes \

            ghcr.io/${{ github.repository_owner }}/institutional-quant-api:${VERSION}

###############################################################################
# Sign Analytics Image
###############################################################################

      - name: Sign Analytics Image

        env:

          COSIGN_EXPERIMENTAL: "true"

        run: |

          cosign sign --yes \

            ghcr.io/${{ github.repository_owner }}/institutional-quant-analytics:${VERSION}

###############################################################################
# Sign Dashboard Image
###############################################################################

      - name: Sign Dashboard Image

        env:

          COSIGN_EXPERIMENTAL: "true"

        run: |

          cosign sign --yes \

            ghcr.io/${{ github.repository_owner }}/institutional-quant-dashboard:${VERSION}

###############################################################################
# Sign Helm Chart
###############################################################################

      - name: Sign Helm Chart

        env:

          COSIGN_EXPERIMENTAL: "true"

        run: |

          cosign sign --yes \

            ghcr.io/${{ github.repository_owner }}/charts/institutional-quant-platform:${VERSION}

###############################################################################
# Upload Release Assets
###############################################################################

      - name: Upload Release Assets

        uses: softprops/action-gh-release@v2

        with:

          tag_name: ${{ steps.version.outputs.version }}

          files: |

            infrastructure/helm/packages/*.tgz

            release/checksums/SHA256SUMS

            release/CHANGELOG.md

            release/RELEASE_NOTES.md

            release/build-info.json

###############################################################################
# Generate Release Manifest
###############################################################################

      - name: Generate Release Manifest

        run: |

          mkdir -p release

          cat > release/manifest.json <<EOF
          {
            "name":"Institutional Quant Platform",
            "version":"${VERSION}",
            "repository":"${{ github.repository }}",
            "commit":"${{ github.sha }}",
            "branch":"${{ github.ref_name }}",
            "generated":"$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

###############################################################################
# Upload Manifest
###############################################################################

      - name: Upload Release Manifest

        uses: actions/upload-artifact@v4

        with:

          name: release-manifest

          path: release/manifest.json

###############################################################################
# Cleanup
###############################################################################

      - name: Cleanup

        if: always()

        run: |

          rm -rf release

          rm -rf infrastructure/helm/packages

###############################################################################
# Final Summary Job
###############################################################################

  summary:

    name: Enterprise Release Summary

    runs-on: ubuntu-latest

    if: always()

    needs:

      - prepare

      - publish

    steps:

      - name: Release Summary

        run: |

          echo "===================================================="

          echo "Institutional Quant Platform"

          echo "Enterprise Release Pipeline"

          echo "===================================================="

          echo

          echo "Version"

          echo "${{ needs.prepare.outputs.version }}"

          echo

          echo "Repository"

          echo "${{ github.repository }}"

          echo

          echo "Prepare Job"

          echo "${{ needs.prepare.result }}"

          echo

          echo "Publish Job"

          echo "${{ needs.publish.result }}"

          echo

          echo "Completed"

          echo "✔ Semantic Version Validation"

          echo "✔ GitHub Release"

          echo "✔ Multi-Architecture Docker Images"

          echo "✔ Helm OCI Package"

          echo "✔ SBOM Generation"

          echo "✔ Provenance"

          echo "✔ Cosign Signatures"

          echo "✔ SHA256 Checksums"

          echo "✔ Release Manifest"

          echo "✔ Release Assets"

          echo

          echo "===================================================="
