name: Kubernetes Deployment

###############################################################################
# Triggers
###############################################################################

on:

  push:

    branches:

      - main

      - develop

      - staging

    paths:

      - "infrastructure/kubernetes/**"

      - "infrastructure/helm/**"

      - ".github/workflows/kubernetes.yml"

  pull_request:

    branches:

      - main

      - develop

      - staging

    paths:

      - "infrastructure/kubernetes/**"

      - "infrastructure/helm/**"

  workflow_dispatch:

###############################################################################
# Permissions
###############################################################################

permissions:

  id-token: write

  contents: read

  packages: read

###############################################################################
# Concurrency
###############################################################################

concurrency:

  group: kubernetes-${{ github.ref }}

  cancel-in-progress: true

###############################################################################
# Environment
###############################################################################

env:

  AWS_REGION: ap-south-1

  CLUSTER_NAME: institutional-quant-cluster

  NAMESPACE: institutional-quant

  HELM_RELEASE: institutional-quant

  HELM_DIRECTORY: infrastructure/helm

  MANIFEST_DIRECTORY: infrastructure/kubernetes

###############################################################################
# Jobs
###############################################################################

jobs:

###############################################################################
# Kubernetes Validation
###############################################################################

  kubernetes:

    name: Kubernetes Validation

    runs-on: ubuntu-latest

    timeout-minutes: 45

###############################################################################
# Checkout
###############################################################################

    steps:

      - name: Checkout Repository

        uses: actions/checkout@v7

###############################################################################
# Configure AWS Credentials
###############################################################################

      - name: Configure AWS Credentials

        uses: aws-actions/configure-aws-credentials@v6

        with:

          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE }}

          aws-region: ${{ env.AWS_REGION }}

###############################################################################
# Install kubectl
###############################################################################

      - name: Setup kubectl

        uses: azure/setup-kubectl@v5

###############################################################################
# Install Helm
###############################################################################

      - name: Setup Helm

        uses: azure/setup-helm@v5

###############################################################################
# Install Kustomize
###############################################################################

      - name: Setup Kustomize

        uses: imranismail/setup-kustomize@v3

###############################################################################
# Configure kubeconfig
###############################################################################

      - name: Configure kubeconfig

        run: |

          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.CLUSTER_NAME }}

###############################################################################
# Verify Cluster Connection
###############################################################################

      - name: Verify Cluster

        run: |

          kubectl cluster-info

          kubectl get nodes

###############################################################################
# Verify Namespace
###############################################################################

      - name: Verify Namespace

        run: |

          kubectl get namespace ${{ env.NAMESPACE }} || \

          kubectl create namespace ${{ env.NAMESPACE }}

###############################################################################
# Helm Version
###############################################################################

      - name: Helm Version

        run: |

          helm version

###############################################################################
# kubectl Version
###############################################################################

      - name: kubectl Version

        run: |

          kubectl version --client

###############################################################################
# Display Environment Information
###############################################################################

      - name: Environment Summary

        run: |

          echo "===================================================="

          echo "Institutional Quant Platform"

          echo "Kubernetes Deployment Pipeline"

          echo "===================================================="

          echo ""

          echo "Cluster"

          echo "${{ env.CLUSTER_NAME }}"

          echo ""

          echo "Namespace"

          echo "${{ env.NAMESPACE }}"

          echo ""

          echo "AWS Region"

          echo "${{ env.AWS_REGION }}"

          echo ""

          echo "Helm Release"

          echo "${{ env.HELM_RELEASE }}"

          echo ""

          echo "===================================================="


###############################################################################
# Install kubeconform
###############################################################################

      - name: Install kubeconform

        run: |

          curl -sSL \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz

          sudo mv kubeconform /usr/local/bin/

###############################################################################
# kubeconform Version
###############################################################################

      - name: kubeconform Version

        run: |

          kubeconform -v

###############################################################################
# Install kube-score
###############################################################################

      - name: Install kube-score

        run: |

          curl -sSL \
            https://github.com/zegl/kube-score/releases/download/v1.20.0/kube-score_1.20.0_linux_amd64.tar.gz \
            | tar -xz

          sudo mv kube-score /usr/local/bin/

###############################################################################
# kube-score Version
###############################################################################

      - name: kube-score Version

        run: |

          kube-score version

###############################################################################
# Install kube-linter
###############################################################################

      - name: Install kube-linter

        run: |

          curl -sSL \
            https://github.com/stackrox/kube-linter/releases/download/v0.7.5/kube-linter-linux.tar.gz \
            | tar -xz

          sudo mv kube-linter /usr/local/bin/

###############################################################################
# kube-linter Version
###############################################################################

      - name: kube-linter Version

        run: |

          kube-linter version

###############################################################################
# Kubernetes YAML Validation
###############################################################################

      - name: Validate Kubernetes Manifests

        run: |

          find "${{ env.MANIFEST_DIRECTORY }}" \
            -type f \
            \( -name "*.yaml" -o -name "*.yml" \) \
            -print

###############################################################################
# kubeconform Validation
###############################################################################

      - name: Kubernetes Schema Validation

        run: |

          kubeconform \
            -strict \
            -summary \
            -ignore-missing-schemas \
            ${{ env.MANIFEST_DIRECTORY }}/*.yaml

###############################################################################
# kube-score Validation
###############################################################################

      - name: Kubernetes Best Practices

        run: |

          kube-score score \
            ${{ env.MANIFEST_DIRECTORY }}/*.yaml

###############################################################################
# kube-linter Validation
###############################################################################

      - name: Kubernetes Linter

        run: |

          kube-linter lint \
            ${{ env.MANIFEST_DIRECTORY }}

###############################################################################
# Helm Lint
###############################################################################

      - name: Helm Chart Validation

        working-directory: ${{ env.HELM_DIRECTORY }}

        run: |

          helm lint .

###############################################################################
# Helm Template
###############################################################################

      - name: Render Helm Templates

        working-directory: ${{ env.HELM_DIRECTORY }}

        run: |

          helm template \
            ${{ env.HELM_RELEASE }} \
            . \
            --namespace ${{ env.NAMESPACE }} \
            > rendered.yaml

###############################################################################
# Validate Rendered Templates
###############################################################################

      - name: Validate Helm Output

        working-directory: ${{ env.HELM_DIRECTORY }}

        run: |

          kubeconform \
            -strict \
            -summary \
            rendered.yaml

###############################################################################
# Client-side Dry Run
###############################################################################

      - name: kubectl Dry Run

        run: |

          kubectl apply \
            --dry-run=client \
            -f ${{ env.MANIFEST_DIRECTORY }}

###############################################################################
# Server-side Dry Run
###############################################################################

      - name: Server-side Validation

        run: |

          kubectl apply \
            --dry-run=server \
            -f ${{ env.MANIFEST_DIRECTORY }}

###############################################################################
# Upload Rendered Manifests
###############################################################################

      - name: Upload Rendered Manifests

        uses: actions/upload-artifact@v7

        with:

          name: kubernetes-rendered

          path: |

            ${{ env.HELM_DIRECTORY }}/rendered.yaml

###############################################################################
# GitHub Summary
###############################################################################

      - name: Validation Summary

        run: |

          cat <<EOF >> $GITHUB_STEP_SUMMARY

          # Kubernetes Validation

          ## Completed

          - Kubernetes Manifest Validation
          - kubeconform
          - kube-score
          - kube-linter
          - Helm Lint
          - Helm Template
          - Client Dry Run
          - Server Dry Run

          EOF

###############################################################################
# Console Summary
###############################################################################

      - name: Validation Console Summary

        run: |

          echo "=================================================="

          echo "Institutional Quant Platform"

          echo "Kubernetes Validation"

          echo "=================================================="

          echo ""

          echo "✔ Kubernetes YAML"

          echo "✔ kubeconform"

          echo "✔ kube-score"

          echo "✔ kube-linter"

          echo "✔ Helm Lint"

          echo "✔ Helm Template"

          echo "✔ Client Dry Run"

          echo "✔ Server Dry Run"

          echo ""

          echo "=================================================="


###############################################################################
# Deploy to Development
###############################################################################

      - name: Deploy to Development

        if: |

          github.ref == 'refs/heads/develop'

        run: |

          helm upgrade \

            --install \

            ${{ env.HELM_RELEASE }} \

            ${{ env.HELM_DIRECTORY }} \

            --namespace ${{ env.NAMESPACE }} \

            --create-namespace \

            --values ${{ env.HELM_DIRECTORY }}/values-dev.yaml \

            --wait \

            --timeout 15m

###############################################################################
# Verify Development Rollout
###############################################################################

      - name: Verify Development Rollout

        if: |

          github.ref == 'refs/heads/develop'

        run: |

          kubectl rollout status deployment/api \
            -n ${{ env.NAMESPACE }} \
            --timeout=600s

          kubectl rollout status deployment/analytics \
            -n ${{ env.NAMESPACE }} \
            --timeout=600s

          kubectl rollout status deployment/dashboard \
            -n ${{ env.NAMESPACE }} \
            --timeout=600s

###############################################################################
# Development Health Check
###############################################################################

      - name: Development Health Check

        if: |

          github.ref == 'refs/heads/develop'

        run: |

          kubectl get pods \
            -n ${{ env.NAMESPACE }}

          kubectl get svc \
            -n ${{ env.NAMESPACE }}

          kubectl get ingress \
            -n ${{ env.NAMESPACE }}

###############################################################################
# Smoke Test API
###############################################################################

      - name: Smoke Test API

        if: |

          github.ref == 'refs/heads/develop'

        run: |

          kubectl wait \
            --for=condition=ready \
            pod \
            --all \
            -n ${{ env.NAMESPACE }} \
            --timeout=600s

###############################################################################
# Deploy to Staging
###############################################################################

      - name: Deploy to Staging

        if: |

          github.ref == 'refs/heads/staging'

        run: |

          helm upgrade \

            --install \

            ${{ env.HELM_RELEASE }} \

            ${{ env.HELM_DIRECTORY }} \

            --namespace ${{ env.NAMESPACE }} \

            --create-namespace \

            --values ${{ env.HELM_DIRECTORY }}/values-staging.yaml \

            --wait \

            --timeout 20m

###############################################################################
# Verify Staging Rollout
###############################################################################

      - name: Verify Staging Rollout

        if: |

          github.ref == 'refs/heads/staging'

        run: |

          kubectl rollout status deployment/api \
            -n ${{ env.NAMESPACE }} \
            --timeout=900s

          kubectl rollout status deployment/analytics \
            -n ${{ env.NAMESPACE }} \
            --timeout=900s

          kubectl rollout status deployment/dashboard \
            -n ${{ env.NAMESPACE }} \
            --timeout=900s

###############################################################################
# Verify Workloads
###############################################################################

      - name: Verify Kubernetes Resources

        if: |

          github.ref == 'refs/heads/staging'

        run: |

          kubectl get all \
            -n ${{ env.NAMESPACE }}

###############################################################################
# Endpoint Verification
###############################################################################

      - name: Verify Services

        if: |

          github.ref == 'refs/heads/staging'

        run: |

          kubectl get svc \
            -n ${{ env.NAMESPACE }}

          kubectl get ingress \
            -n ${{ env.NAMESPACE }}

###############################################################################
# Smoke Tests
###############################################################################

      - name: Run Smoke Tests

        if: |

          github.ref == 'refs/heads/staging'

        run: |

          kubectl wait \
            --for=condition=ready \
            pod \
            --all \
            -n ${{ env.NAMESPACE }} \
            --timeout=900s

###############################################################################
# Capture Logs
###############################################################################

      - name: Capture Logs

        if: always()

        run: |

          mkdir -p logs

          kubectl get pods \
            -n ${{ env.NAMESPACE }} \
            -o wide > logs/pods.txt

          kubectl get events \
            -n ${{ env.NAMESPACE }} \
            > logs/events.txt

###############################################################################
# Upload Deployment Logs
###############################################################################

      - name: Upload Deployment Logs

        if: always()

        uses: actions/upload-artifact@v7

        with:

          name: kubernetes-logs

          path: logs

###############################################################################
# GitHub Step Summary
###############################################################################

      - name: Deployment Summary

        if: always()

        run: |

          cat <<EOF >> $GITHUB_STEP_SUMMARY

          # Kubernetes Deployment

          ## Development

          - Helm Upgrade
          - Rollout Verification
          - Health Check

          ## Staging

          - Helm Upgrade
          - Rollout Verification
          - Smoke Tests

          EOF

###############################################################################
# Console Summary
###############################################################################

      - name: Deployment Console Summary

        if: always()

        run: |

          echo "=================================================="

          echo "Institutional Quant Platform"

          echo "Deployment Pipeline"

          echo "=================================================="

          echo ""

          echo "✔ Development Deployment"

          echo "✔ Development Rollout"

          echo "✔ Development Health Checks"

          echo ""

          echo "✔ Staging Deployment"

          echo "✔ Staging Rollout"

          echo "✔ Smoke Tests"

          echo ""

          echo "=================================================="


###############################################################################
# Deploy to Production
###############################################################################

      - name: Deploy to Production

        if: |

          github.ref == 'refs/heads/main' &&

          github.event_name == 'workflow_dispatch'

        environment:

          name: production

        run: |

          helm upgrade \

            --install \

            ${{ env.HELM_RELEASE }} \

            ${{ env.HELM_DIRECTORY }} \

            --namespace ${{ env.NAMESPACE }} \

            --create-namespace \

            --values ${{ env.HELM_DIRECTORY }}/values-prod.yaml \

            --atomic \

            --wait \

            --timeout 30m

###############################################################################
# Verify Production Rollout
###############################################################################

      - name: Verify Production Rollout

        if: |

          github.ref == 'refs/heads/main' &&

          github.event_name == 'workflow_dispatch'

        run: |

          kubectl rollout status deployment/api \
            -n ${{ env.NAMESPACE }} \
            --timeout=1800s

          kubectl rollout status deployment/analytics \
            -n ${{ env.NAMESPACE }} \
            --timeout=1800s

          kubectl rollout status deployment/dashboard \
            -n ${{ env.NAMESPACE }} \
            --timeout=1800s

###############################################################################
# Verify Production Resources
###############################################################################

      - name: Verify Production Resources

        if: |

          github.ref == 'refs/heads/main' &&

          github.event_name == 'workflow_dispatch'

        run: |

          kubectl get all \
            -n ${{ env.NAMESPACE }}

          kubectl get ingress \
            -n ${{ env.NAMESPACE }}

          kubectl get pvc \
            -n ${{ env.NAMESPACE }}

###############################################################################
# Smoke Test
###############################################################################

      - name: Production Smoke Test

        if: |

          github.ref == 'refs/heads/main' &&

          github.event_name == 'workflow_dispatch'

        run: |

          kubectl wait \

            --for=condition=ready \

            pod \

            --all \

            -n ${{ env.NAMESPACE }} \

            --timeout=1800s

###############################################################################
# Rollback (Automatic)
###############################################################################

      - name: Automatic Rollback

        if: |

          failure() &&

          github.ref == 'refs/heads/main'

        run: |

          helm rollback \

            ${{ env.HELM_RELEASE }} \

            --namespace ${{ env.NAMESPACE }}

###############################################################################
# Collect Diagnostics
###############################################################################

      - name: Collect Diagnostics

        if: always()

        run: |

          mkdir -p diagnostics

          kubectl get all \
            -n ${{ env.NAMESPACE }} \
            -o wide \
            > diagnostics/resources.txt

          kubectl get events \
            -n ${{ env.NAMESPACE }} \
            --sort-by=.metadata.creationTimestamp \
            > diagnostics/events.txt

          kubectl describe pods \
            -n ${{ env.NAMESPACE }} \
            > diagnostics/pods.txt

###############################################################################
# Upload Diagnostics
###############################################################################

      - name: Upload Diagnostics

        if: always()

        uses: actions/upload-artifact@v7

        with:

          name: kubernetes-diagnostics

          path: diagnostics

          if-no-files-found: ignore

###############################################################################
# GitHub Step Summary
###############################################################################

      - name: Publish Deployment Summary

        if: always()

        run: |

          cat <<EOF >> $GITHUB_STEP_SUMMARY

          # Kubernetes Deployment

          ## Validation

          - Kubernetes Manifest Validation
          - kubeconform
          - kube-score
          - kube-linter

          ## Deployments

          - Development
          - Staging
          - Production

          ## Verification

          - Rollout Status
          - Smoke Tests
          - Resource Validation

          ## Recovery

          - Automatic Rollback Enabled

          EOF

###############################################################################
# Final Summary Job
###############################################################################

  summary:

    name: Kubernetes Pipeline Summary

    runs-on: ubuntu-latest

    if: always()

    needs:

      - kubernetes

    steps:

      - name: Pipeline Summary

        run: |

          echo "======================================================"

          echo "Institutional Quant Platform"

          echo "Kubernetes Pipeline"

          echo "======================================================"

          echo ""

          echo "Repository"

          echo "${{ github.repository }}"

          echo ""

          echo "Branch"

          echo "${{ github.ref_name }}"

          echo ""

          echo "Cluster"

          echo "${{ env.CLUSTER_NAME }}"

          echo ""

          echo "Namespace"

          echo "${{ env.NAMESPACE }}"

          echo ""

          echo "Completed"

          echo "✔ Manifest Validation"

          echo "✔ kubeconform"

          echo "✔ kube-score"

          echo "✔ kube-linter"

          echo "✔ Helm Validation"

          echo "✔ Development Deployment"

          echo "✔ Staging Deployment"

          echo "✔ Production Deployment"

          echo "✔ Rollout Verification"

          echo "✔ Smoke Tests"

          echo "✔ Rollback Protection"

          echo "✔ Diagnostics"

          echo ""

          echo "Pipeline Status"

          echo "${{ needs.kubernetes.result }}"

          echo ""

          echo "======================================================"