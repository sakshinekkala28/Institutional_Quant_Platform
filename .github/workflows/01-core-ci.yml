name: 01 • Core CI

on:

    push:

        branches:

            - main

            - develop

    pull_request:

        branches:

            - main

    workflow_dispatch:

permissions:

    contents: read

    checks: write

    pull-requests: write

    actions: read

env:

    PYTHONUNBUFFERED: "1"

    PIP_DISABLE_PIP_VERSION_CHECK: "1"

    PYTHONDONTWRITEBYTECODE: "1"

    FORCE_COLOR: "1"

concurrency:

    group: core-ci-${{ github.ref }}

    cancel-in-progress: true

jobs:

    lint:

        name: Ruff Lint

        runs-on: ubuntu-latest

        strategy:

            matrix:

                python-version:

                    - "3.12"

        steps:

            - name: Checkout Repository

              uses: actions/checkout@v4

            - name: Setup Python

              uses: actions/setup-python@v5

              with:

                    python-version: ${{ matrix.python-version }}

                    cache: pip

            - name: Install Dependencies

              run: |

                    python -m pip install --upgrade pip

                    pip install -r requirements.txt

                    pip install \
                        ruff \
                        black \
                        isort \
                        mypy \
                        pytest \
                        pytest-cov

            - name: Ruff

              run: |

                    ruff check .

    formatting:

        name: Formatting

        runs-on: ubuntu-latest

        needs:

            - lint

        steps:

            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5

              with:

                    python-version: "3.12"

                    cache: pip

            - run: |

                    python -m pip install --upgrade pip

                    pip install black isort

            - name: Black

              run: |

                    black --check .

            - name: isort

              run: |

                    isort . --check-only

    typing:

        name: Type Checking

        runs-on: ubuntu-latest

        needs:

            - formatting

        steps:

            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5

              with:

                    python-version: "3.12"

                    cache: pip

            - run: |

                    python -m pip install --upgrade pip

                    pip install -r requirements.txt

                    pip install mypy

            - name: Mypy

              continue-on-error: true

              run: |

                    mypy .

    compile:

        name: Python Compile Check

        runs-on: ubuntu-latest

        needs:

            - typing

        steps:

            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5

              with:

                    python-version: "3.12"

                    cache: pip

            - name: Compile

              run: |

                    python -m compileall .

    unit-tests:

        name: Unit Tests

        runs-on: ubuntu-latest

        needs:

            - compile

        steps:

            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5

              with:

                    python-version: "3.12"

                    cache: pip

            - run: |

                    python -m pip install --upgrade pip

                    pip install -r requirements.txt

                    pip install pytest pytest-cov

            - name: Unit Tests

              run: |

                    pytest \
                        tests/unit \
                        -v \
                        --cov=. \
                        --cov-report=xml \
                        --cov-report=html

            - name: Upload Coverage

              uses: actions/upload-artifact@v4

              with:

                    name: coverage-report

                    path: |

                        coverage.xml

                        htmlcov/

    integration-tests:

        name: Integration Tests

        runs-on: ubuntu-latest

        needs:

            - unit-tests

        steps:

            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5

              with:

                    python-version: "3.12"

                    cache: pip

            - run: |

                    python -m pip install --upgrade pip

                    pip install -r requirements.txt

                    pip install pytest

            - name: Integration Tests

              run: |

                    if [ -d tests/integration ]; then

                        pytest tests/integration -v

                    else

                        echo "No integration tests."

                    fi

    performance-tests:

        name: Performance Tests

        runs-on: ubuntu-latest

        needs:

            - integration-tests

        steps:

            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5

              with:

                    python-version: "3.12"

                    cache: pip

            - run: |

                    python -m pip install --upgrade pip

                    pip install -r requirements.txt

                    pip install pytest

            - name: Performance Tests

              run: |

                    if [ -d tests/performance ]; then

                        pytest tests/performance -v

                    else

                        echo "No performance tests."

                    fi

    docker-build:

        name: Docker Build

        runs-on: ubuntu-latest

        needs:

            - performance-tests

        steps:

            - uses: actions/checkout@v4

            - name: Docker Build

              run: |

                    if [ -f Dockerfile ]; then

                        docker build . \
                            --tag institutional_quant:latest

                    else

                        echo "Dockerfile not found."

                    fi

    summary:

        name: Pipeline Summary

        runs-on: ubuntu-latest

        needs:

            - lint

            - formatting

            - typing

            - compile

            - unit-tests

            - integration-tests

            - performance-tests

            - docker-build

        if: always()

        steps:

            - name: Summary

              run: |

                    echo "==========================================="

                    echo "Institutional Quant Platform"

                    echo "Core CI Pipeline"

                    echo "==========================================="

                    echo "Lint                 : ${{ needs.lint.result }}"

                    echo "Formatting           : ${{ needs.formatting.result }}"

                    echo "Typing               : ${{ needs.typing.result }}"

                    echo "Compilation          : ${{ needs.compile.result }}"

                    echo "Unit Tests           : ${{ needs.unit-tests.result }}"

                    echo "Integration Tests    : ${{ needs.integration-tests.result }}"

                    echo "Performance Tests    : ${{ needs.performance-tests.result }}"

                    echo "Docker Build         : ${{ needs.docker-build.result }}"

                    echo "==========================================="