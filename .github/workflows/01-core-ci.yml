name: 01 • Core CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint:

    name: Ruff

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Ruff Check
        run: |
          ruff check .

  formatting:

    name: Formatting

    runs-on: ubuntu-latest

    needs: lint

    timeout-minutes: 10

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Black
        run: |
          black --check .

      - name: Import Order
        run: |
          ruff check . --select I

  typing:

    name: Mypy

    runs-on: ubuntu-latest

    needs: formatting

    timeout-minutes: 15

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - run: |
          mypy .

  compile:

    name: Compile

    runs-on: ubuntu-latest

    needs: typing

    timeout-minutes: 10

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: |
          python -m compileall -q .

  unit-tests:

    name: Unit Tests

    runs-on: ubuntu-latest

    needs: compile

    timeout-minutes: 30

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - run: |
          python -m pytest \
            tests/unit \
            -v \
            --cov=. \
            --cov-report=xml \
            --cov-report=html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

  integration-tests:

    name: Integration Tests

    runs-on: ubuntu-latest

    needs: unit-tests

    timeout-minutes: 30

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - run: |
          if [ -d tests/integration ]; then
            python -m pytest tests/integration -v
          else
            echo "No integration tests."
          fi

  performance-tests:

    name: Performance Tests

    runs-on: ubuntu-latest

    needs: integration-tests

    timeout-minutes: 60

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - run: |
          if [ -d tests/performance ]; then
            python -m pytest tests/performance -v
          else
            echo "No performance tests."
          fi

  docker-build:

    name: Docker Build

    runs-on: ubuntu-latest

    needs: performance-tests

    timeout-minutes: 30

    steps:

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        run: |
          if [ -f Dockerfile ]; then
            docker buildx build \
              --load \
              -t institutional_quant:latest \
              .
          else
            echo "Dockerfile not found."
          fi

  summary:

    name: Pipeline Summary

    runs-on: ubuntu-latest

    if: always()

    needs:
      - lint
      - formatting
      - typing
      - compile
      - unit-tests
      - integration-tests
      - performance-tests
      - docker-build

    steps:

      - name: Summary
        run: |
          echo "======================================"
          echo "Institutional Quant Platform"
          echo "======================================"
          echo "Lint                : ${{ needs.lint.result }}"
          echo "Formatting          : ${{ needs.formatting.result }}"
          echo "Typing              : ${{ needs.typing.result }}"
          echo "Compile             : ${{ needs.compile.result }}"
          echo "Unit Tests          : ${{ needs.unit-tests.result }}"
          echo "Integration Tests   : ${{ needs.integration-tests.result }}"
          echo "Performance Tests   : ${{ needs.performance-tests.result }}"
          echo "Docker Build        : ${{ needs.docker-build.result }}"
          echo "======================================"