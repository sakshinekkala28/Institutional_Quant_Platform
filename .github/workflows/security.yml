name: Security Scanning

###############################################################################
# Triggers
###############################################################################

on:

  push:

    branches:

      - main

      - develop

      - staging

  pull_request:

    branches:

      - main

      - develop

      - staging

  schedule:

    # Every Sunday at 02:00 UTC
    - cron: "0 2 * * 0"

  workflow_dispatch:

###############################################################################
# Permissions
###############################################################################

permissions:

  actions: read

  contents: read

  packages: read

  security-events: write

  pull-requests: write

  id-token: write

###############################################################################
# Concurrency
###############################################################################

concurrency:

  group: security-${{ github.ref }}

  cancel-in-progress: true

###############################################################################
# Environment
###############################################################################

env:

  PYTHON_VERSION: "3.12"

  TERRAFORM_VERSION: "1.11.4"

  HELM_VERSION: "3.18.4"

###############################################################################
# Jobs
###############################################################################

jobs:

###############################################################################
# Repository Security Scan
###############################################################################

  security:

    name: Repository Security

    runs-on: ubuntu-latest

    timeout-minutes: 60

###############################################################################
# Checkout Repository
###############################################################################

    steps:

      - name: Checkout Repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 0

###############################################################################
# Setup Python
###############################################################################

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: ${{ env.PYTHON_VERSION }}

          cache: pip

###############################################################################
# Setup Java (Required for CodeQL)
###############################################################################

      - name: Setup Java

        uses: actions/setup-java@v4

        with:

          distribution: temurin

          java-version: "21"

###############################################################################
# Setup Terraform
###############################################################################

      - name: Setup Terraform

        uses: hashicorp/setup-terraform@v3

        with:

          terraform_version: ${{ env.TERRAFORM_VERSION }}

###############################################################################
# Setup Helm
###############################################################################

      - name: Setup Helm

        uses: azure/setup-helm@v5

        with:

          version: ${{ env.HELM_VERSION }}

###############################################################################
# Setup Docker Buildx
###############################################################################

      - name: Setup Docker Buildx

        uses: docker/setup-buildx-action@v3

###############################################################################
# Cache Python Packages
###############################################################################

      - name: Cache Python Dependencies

        uses: actions/cache@v4

        with:

          path: |

            ~/.cache/pip

          key: pip-${{ runner.os }}-${{ hashFiles('requirements*.txt') }}

          restore-keys: |

            pip-${{ runner.os }}-

###############################################################################
# Install Project Dependencies
###############################################################################

      - name: Install Project Dependencies

        run: |

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then

            pip install -r requirements.txt

          fi

###############################################################################
# Install Security Tooling
###############################################################################

      - name: Install Security Utilities

        run: |

          pip install \

            pip-audit==2.9.0 \

            bandit==1.8.6

###############################################################################
# Display Environment
###############################################################################

      - name: Environment Information

        run: |

          echo "===================================================="

          echo "Institutional Quant Platform"

          echo "Enterprise Security Pipeline"

          echo "===================================================="

          echo ""

          echo "Python"

          python --version

          echo ""

          echo "Terraform"

          terraform version

          echo ""

          echo "Helm"

          helm version

          echo ""

          echo "Docker"

          docker version

          echo ""

          echo "Repository"

          echo "${{ github.repository }}"

          echo ""

          echo "Branch"

          echo "${{ github.ref_name }}"

          echo ""

          echo "===================================================="


###############################################################################
# Initialize CodeQL
###############################################################################

      - name: Initialize CodeQL

        uses: github/codeql-action/init@v3

        with:

          languages: python

          queries: security-and-quality

###############################################################################
# Autobuild
###############################################################################

      - name: CodeQL Autobuild

        uses: github/codeql-action/autobuild@v3

###############################################################################
# Analyze CodeQL
###############################################################################

      - name: Analyze CodeQL

        uses: github/codeql-action/analyze@v3

        with:

          category: "/language:python"

###############################################################################
# Dependency Review
###############################################################################

      - name: Dependency Review

        if: github.event_name == 'pull_request'

        uses: actions/dependency-review-action@v4

        with:

          fail-on-severity: high

          license-check: true

###############################################################################
# Python Dependency Audit
###############################################################################

      - name: Run pip-audit

        run: |

          pip-audit \
            --desc \
            --format json \
            --output pip-audit.json

###############################################################################
# Upload pip-audit Report
###############################################################################

      - name: Upload pip-audit Report

        uses: actions/upload-artifact@v4

        with:

          name: pip-audit-report

          path: pip-audit.json

###############################################################################
# Install OSV Scanner
###############################################################################

      - name: Install OSV Scanner

        run: |

          curl -L \
            https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 \
            -o osv-scanner

          chmod +x osv-scanner

          sudo mv osv-scanner /usr/local/bin/

###############################################################################
# OSV Scanner Version
###############################################################################

      - name: OSV Scanner Version

        run: |

          osv-scanner --version

###############################################################################
# Scan Python Dependencies
###############################################################################

      - name: Run OSV Scanner

        run: |

          osv-scanner scan . \
            --format json \
            --output osv-report.json

###############################################################################
# Upload OSV Report
###############################################################################

      - name: Upload OSV Report

        uses: actions/upload-artifact@v4

        with:

          name: osv-report

          path: osv-report.json

###############################################################################
# Python Package Inventory
###############################################################################

      - name: Installed Packages

        run: |

          pip list

###############################################################################
# Publish GitHub Summary
###############################################################################

      - name: Dependency Summary

        run: |

          cat <<EOF >> $GITHUB_STEP_SUMMARY

          # Dependency Security

          ## Completed

          - CodeQL Analysis
          - Dependency Review
          - pip-audit
          - OSV Scanner

          ## Reports

          - pip-audit.json
          - osv-report.json

          EOF

###############################################################################
# Console Summary
###############################################################################

      - name: Dependency Security Summary

        run: |

          echo "===================================================="

          echo "Institutional Quant Platform"

          echo "Dependency Security"

          echo "===================================================="

          echo ""

          echo "✔ CodeQL"

          echo "✔ Dependency Review"

          echo "✔ pip-audit"

          echo "✔ OSV Scanner"

          echo ""

          echo "===================================================="


###############################################################################
# Filesystem Security Scan (Trivy)
###############################################################################

      - name: Trivy Filesystem Scan

        uses: aquasecurity/trivy-action@0.28.0

        with:

          scan-type: fs

          scan-ref: .

          format: sarif

          output: trivy-fs.sarif

          severity: CRITICAL,HIGH

          ignore-unfixed: true

###############################################################################
# Upload Trivy Filesystem SARIF
###############################################################################

      - name: Upload Trivy Filesystem SARIF

        uses: github/codeql-action/upload-sarif@v3

        with:

          sarif_file: trivy-fs.sarif

          category: trivy-filesystem

###############################################################################
# Build API Docker Image
###############################################################################

      - name: Build API Image

        uses: docker/build-push-action@v6

        with:

          context: .

          file: infrastructure/docker/Dockerfile.api

          load: true

          tags: institutional-quant-api:security

          cache-from: type=gha

          cache-to: type=gha,mode=max

###############################################################################
# Trivy API Image Scan
###############################################################################

      - name: Scan API Image

        uses: aquasecurity/trivy-action@0.28.0

        with:

          image-ref: institutional-quant-api:security

          format: sarif

          output: trivy-api.sarif

          severity: CRITICAL,HIGH

          ignore-unfixed: true

###############################################################################
# Upload API SARIF
###############################################################################

      - name: Upload API SARIF

        uses: github/codeql-action/upload-sarif@v3

        with:

          sarif_file: trivy-api.sarif

          category: api-container

###############################################################################
# Build Analytics Docker Image
###############################################################################

      - name: Build Analytics Image

        uses: docker/build-push-action@v6

        with:

          context: .

          file: infrastructure/docker/Dockerfile.analytics

          load: true

          tags: institutional-quant-analytics:security

###############################################################################
# Scan Analytics Image
###############################################################################

      - name: Scan Analytics Image

        uses: aquasecurity/trivy-action@0.28.0

        with:

          image-ref: institutional-quant-analytics:security

          format: sarif

          output: trivy-analytics.sarif

          severity: CRITICAL,HIGH

###############################################################################
# Upload Analytics SARIF
###############################################################################

      - name: Upload Analytics SARIF

        uses: github/codeql-action/upload-sarif@v3

        with:

          sarif_file: trivy-analytics.sarif

          category: analytics-container

###############################################################################
# Build Dashboard Docker Image
###############################################################################

      - name: Build Dashboard Image

        uses: docker/build-push-action@v6

        with:

          context: .

          file: infrastructure/docker/Dockerfile.dashboard

          load: true

          tags: institutional-quant-dashboard:security

###############################################################################
# Scan Dashboard Image
###############################################################################

      - name: Scan Dashboard Image

        uses: aquasecurity/trivy-action@0.28.0

        with:

          image-ref: institutional-quant-dashboard:security

          format: sarif

          output: trivy-dashboard.sarif

          severity: CRITICAL,HIGH

###############################################################################
# Upload Dashboard SARIF
###############################################################################

      - name: Upload Dashboard SARIF

        uses: github/codeql-action/upload-sarif@v3

        with:

          sarif_file: trivy-dashboard.sarif

          category: dashboard-container

###############################################################################
# Checkov
###############################################################################

      - name: Run Checkov

        uses: bridgecrewio/checkov-action@v12

        with:

          directory: .

          framework: terraform,kubernetes,dockerfile,secrets

          output_format: sarif

          output_file_path: checkov.sarif

          quiet: true

###############################################################################
# Upload Checkov SARIF
###############################################################################

      - name: Upload Checkov SARIF

        uses: github/codeql-action/upload-sarif@v3

        with:

          sarif_file: checkov.sarif

          category: checkov

###############################################################################
# tfsec
###############################################################################

      - name: Run tfsec

        uses: aquasecurity/tfsec-action@v1.0.3

        with:

          working_directory: infrastructure/terraform

          format: sarif

          soft_fail: false

###############################################################################
# Upload tfsec SARIF
###############################################################################

      - name: Upload tfsec SARIF

        uses: github/codeql-action/upload-sarif@v3

        with:

          sarif_file: tfsec.sarif

          category: tfsec

###############################################################################
# Upload Security Reports
###############################################################################

      - name: Upload Security Reports

        uses: actions/upload-artifact@v4

        with:

          name: infrastructure-security

          path: |

            trivy-fs.sarif

            trivy-api.sarif

            trivy-analytics.sarif

            trivy-dashboard.sarif

            checkov.sarif

            tfsec.sarif

          if-no-files-found: ignore

###############################################################################
# GitHub Step Summary
###############################################################################

      - name: Infrastructure Security Summary

        run: |

          cat <<EOF >> $GITHUB_STEP_SUMMARY

          # Infrastructure Security

          ## Filesystem

          - Trivy Filesystem Scan

          ## Containers

          - API Image
          - Analytics Image
          - Dashboard Image

          ## Infrastructure

          - Checkov
          - tfsec

          ## Reports

          - SARIF Uploaded

          EOF

###############################################################################
# Console Summary
###############################################################################

      - name: Infrastructure Security Console

        run: |

          echo "=================================================="

          echo "Institutional Quant Platform"

          echo "Infrastructure Security"

          echo "=================================================="

          echo ""

          echo "✔ Trivy Filesystem"

          echo "✔ API Container"

          echo "✔ Analytics Container"

          echo "✔ Dashboard Container"

          echo "✔ Checkov"

          echo "✔ tfsec"

          echo ""

          echo "=================================================="


###############################################################################
# Semgrep
###############################################################################

      - name: Run Semgrep

        uses: semgrep/semgrep-action@v1

        with:

          config: auto

          generateSarif: true

###############################################################################
# Upload Semgrep SARIF
###############################################################################

      - name: Upload Semgrep SARIF

        uses: github/codeql-action/upload-sarif@v3

        with:

          sarif_file: semgrep.sarif

          category: semgrep

###############################################################################
# Gitleaks
###############################################################################

      - name: Secret Detection

        uses: gitleaks/gitleaks-action@v2

        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

###############################################################################
# Generate SBOM (Source)
###############################################################################

      - name: Generate Source SBOM

        uses: anchore/sbom-action@v0

        with:

          path: .

          format: spdx-json

          output-file: source-sbom.spdx.json

###############################################################################
# Generate CycloneDX SBOM
###############################################################################

      - name: Generate CycloneDX SBOM

        uses: CycloneDX/gh-python-generate-sbom@v1

        with:

          input: requirements.txt

          output: cyclonedx-sbom.json

###############################################################################
# Upload SBOM
###############################################################################

      - name: Upload SBOM

        uses: actions/upload-artifact@v4

        with:

          name: sbom

          path: |

            source-sbom.spdx.json

            cyclonedx-sbom.json

###############################################################################
# Dependency Graph Submission
###############################################################################

      - name: Submit Dependency Graph

        uses: advanced-security/python-dependency-submission@v1

###############################################################################
# License Scan
###############################################################################

      - name: Python License Scan

        run: |

          pip install pip-licenses

          pip-licenses \

            --format=json \

            --output-file licenses.json

###############################################################################
# Upload License Report
###############################################################################

      - name: Upload License Report

        uses: actions/upload-artifact@v4

        with:

          name: licenses

          path: licenses.json

###############################################################################
# Bandit
###############################################################################

      - name: Run Bandit

        run: |

          bandit \

            -r . \

            -f json \

            -o bandit.json

###############################################################################
# Upload Bandit Report
###############################################################################

      - name: Upload Bandit Report

        uses: actions/upload-artifact@v4

        with:

          name: bandit-report

          path: bandit.json

###############################################################################
# Upload Security Reports
###############################################################################

      - name: Upload Security Bundle

        uses: actions/upload-artifact@v4

        with:

          name: security-reports

          path: |

            semgrep.sarif

            source-sbom.spdx.json

            cyclonedx-sbom.json

            licenses.json

            bandit.json

###############################################################################
# GitHub Step Summary
###############################################################################

      - name: Publish Security Summary

        run: |

          cat <<EOF >> $GITHUB_STEP_SUMMARY

          # Advanced Security

          ## Static Analysis

          - Semgrep
          - Bandit

          ## Secret Detection

          - Gitleaks

          ## Software Bill of Materials

          - SPDX SBOM
          - CycloneDX SBOM

          ## Compliance

          - Dependency Graph
          - License Report

          EOF

###############################################################################
# Console Summary
###############################################################################

      - name: Advanced Security Console

        run: |

          echo "===================================================="

          echo "Institutional Quant Platform"

          echo "Advanced Security"

          echo "===================================================="

          echo ""

          echo "✔ Semgrep"

          echo "✔ Gitleaks"

          echo "✔ Bandit"

          echo "✔ SPDX SBOM"

          echo "✔ CycloneDX SBOM"

          echo "✔ Dependency Graph"

          echo "✔ License Scan"

          echo ""

          echo "===================================================="


###############################################################################
# Generate Security Dashboard
###############################################################################

      - name: Generate Security Dashboard

        if: always()

        run: |

          mkdir -p security-dashboard

          cat > security-dashboard/README.md <<EOF

          # Institutional Quant Platform

          ## Enterprise Security Dashboard

          ### Repository

          ${{ github.repository }}

          ### Branch

          ${{ github.ref_name }}

          ### Commit

          ${{ github.sha }}

          ### Security Scans Completed

          ✔ CodeQL

          ✔ Dependency Review

          ✔ pip-audit

          ✔ OSV Scanner

          ✔ Trivy Filesystem

          ✔ Trivy Containers

          ✔ Checkov

          ✔ tfsec

          ✔ Semgrep

          ✔ Gitleaks

          ✔ Bandit

          ✔ SPDX SBOM

          ✔ CycloneDX SBOM

          ✔ Dependency Graph

          ✔ License Scan

          EOF

###############################################################################
# Security Metrics
###############################################################################

      - name: Generate Security Metrics

        if: always()

        run: |

          mkdir -p metrics

          cat > metrics/security-metrics.json <<EOF
          {
            "repository":"${{ github.repository }}",
            "branch":"${{ github.ref_name }}",
            "commit":"${{ github.sha }}",
            "workflow":"Security",
            "completed":true,
            "timestamp":"$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

###############################################################################
# Upload Dashboard
###############################################################################

      - name: Upload Dashboard

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: security-dashboard

          path: |

            security-dashboard

            metrics

###############################################################################
# Cleanup Temporary Files
###############################################################################

      - name: Cleanup Workspace

        if: always()

        run: |

          rm -rf security-dashboard

          rm -rf metrics

          rm -f *.sarif

          rm -f *.json

###############################################################################
# GitHub Step Summary
###############################################################################

      - name: Publish Final Security Summary

        if: always()

        run: |

          cat <<EOF >> $GITHUB_STEP_SUMMARY

          # Institutional Quant Platform

          ## Enterprise Security Pipeline

          ### Code Analysis

          - CodeQL
          - Semgrep
          - Bandit

          ### Dependency Security

          - Dependency Review
          - pip-audit
          - OSV Scanner

          ### Container Security

          - Trivy Filesystem
          - API Container
          - Analytics Container
          - Dashboard Container

          ### Infrastructure Security

          - Checkov
          - tfsec

          ### Secret Detection

          - Gitleaks

          ### Supply Chain

          - SPDX SBOM
          - CycloneDX SBOM
          - Dependency Graph

          ### Compliance

          - License Scan

          ### Artifacts

          - SARIF Reports
          - SBOM
          - Security Dashboard
          - Metrics

          EOF

###############################################################################
# Final Summary Job
###############################################################################

  summary:

    name: Enterprise Security Summary

    runs-on: ubuntu-latest

    if: always()

    needs:

      - security

    steps:

      - name: Security Pipeline Summary

        run: |

          echo "=========================================================="

          echo "Institutional Quant Platform"

          echo "Enterprise Security Pipeline"

          echo "=========================================================="

          echo ""

          echo "Repository"

          echo "${{ github.repository }}"

          echo ""

          echo "Branch"

          echo "${{ github.ref_name }}"

          echo ""

          echo "Commit"

          echo "${{ github.sha }}"

          echo ""

          echo "Completed Security Checks"

          echo ""

          echo "✔ CodeQL"

          echo "✔ Dependency Review"

          echo "✔ pip-audit"

          echo "✔ OSV Scanner"

          echo "✔ Trivy Filesystem"

          echo "✔ Trivy Containers"

          echo "✔ Checkov"

          echo "✔ tfsec"

          echo "✔ Semgrep"

          echo "✔ Gitleaks"

          echo "✔ Bandit"

          echo "✔ SPDX SBOM"

          echo "✔ CycloneDX SBOM"

          echo "✔ Dependency Graph"

          echo "✔ License Scan"

          echo ""

          echo "Artifacts"

          echo ""

          echo "✔ SARIF Reports"

          echo "✔ Security Reports"

          echo "✔ SBOM"

          echo "✔ Dashboard"

          echo "✔ Metrics"

          echo ""

          echo "Pipeline Status"

          echo "${{ needs.security.result }}"

          echo ""

          echo "=========================================================="