name: Dependency Updates

###############################################################################
# Triggers
###############################################################################

on:

  schedule:

    # Every Monday at 03:00 UTC
    - cron: "0 3 * * 1"

  workflow_dispatch:

###############################################################################
# Permissions
###############################################################################

permissions:

  contents: write

  pull-requests: write

  packages: read

  actions: write

###############################################################################
# Concurrency
###############################################################################

concurrency:

  group: dependency-updates

  cancel-in-progress: false

###############################################################################
# Environment
###############################################################################

env:

  PYTHON_VERSION: "3.12"

  TERRAFORM_VERSION: "1.11.4"

  HELM_VERSION: "3.18.4"

###############################################################################
# Jobs
###############################################################################

jobs:

###############################################################################
# Dependency Maintenance
###############################################################################

  dependency-update:

    name: Dependency Maintenance

    runs-on: ubuntu-latest

    timeout-minutes: 60

###############################################################################
# Checkout
###############################################################################

    steps:

      - name: Checkout Repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 0

###############################################################################
# Setup Python
###############################################################################

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: ${{ env.PYTHON_VERSION }}

          cache: pip

###############################################################################
# Setup Terraform
###############################################################################

      - name: Setup Terraform

        uses: hashicorp/setup-terraform@v3

        with:

          terraform_version: ${{ env.TERRAFORM_VERSION }}

###############################################################################
# Setup Helm
###############################################################################

      - name: Setup Helm

        uses: azure/setup-helm@v4

        with:

          version: ${{ env.HELM_VERSION }}

###############################################################################
# Setup Docker Buildx
###############################################################################

      - name: Setup Docker Buildx

        uses: docker/setup-buildx-action@v3

###############################################################################
# Cache Pip Packages
###############################################################################

      - name: Cache Python Packages

        uses: actions/cache@v4

        with:

          path: |

            ~/.cache/pip

          key: dependency-${{ runner.os }}-${{ hashFiles('requirements*.txt') }}

          restore-keys: |

            dependency-${{ runner.os }}-

###############################################################################
# Install Utilities
###############################################################################

      - name: Install Update Utilities

        run: |

          python -m pip install --upgrade pip

          pip install \
            pip-tools \
            pip-review \
            safety \
            requests \
            pyyaml

###############################################################################
# Configure Git
###############################################################################

      - name: Configure Git

        run: |

          git config --global user.name "github-actions"

          git config --global user.email \
            "github-actions@users.noreply.github.com"

###############################################################################
# Create Working Branch
###############################################################################

      - name: Create Update Branch

        run: |

          BRANCH="dependency-update-$(date +%Y%m%d)"

          echo "BRANCH=${BRANCH}" >> $GITHUB_ENV

          git checkout -b "${BRANCH}"

###############################################################################
# Repository Information
###############################################################################

      - name: Repository Summary

        run: |

          echo "=================================================="

          echo "Institutional Quant Platform"

          echo "Dependency Update Pipeline"

          echo "=================================================="

          echo ""

          echo "Repository"

          echo "${{ github.repository }}"

          echo ""

          echo "Branch"

          echo "${BRANCH}"

          echo ""

          echo "Python"

          python --version

          echo ""

          echo "Terraform"

          terraform version

          echo ""

          echo "Helm"

          helm version

          echo ""

          echo "=================================================="

###############################################################################
# Create Report Directory
###############################################################################

      - name: Prepare Reports

        run: |

          mkdir -p reports

          mkdir -p dependency-updates

###############################################################################
# Export Metadata
###############################################################################

      - name: Export Metadata

        run: |

          cat > reports/metadata.json <<EOF
          {
            "repository":"${{ github.repository }}",
            "branch":"${BRANCH}",
            "workflow":"Dependency Update",
            "run":"${{ github.run_number }}",
            "timestamp":"$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

###############################################################################
# Upload Metadata
###############################################################################

      - name: Upload Metadata

        uses: actions/upload-artifact@v4

        with:

          name: dependency-metadata

          path: reports/metadata.json


###############################################################################
# Python Dependency Updates
###############################################################################

      - name: Update Python Dependencies

        continue-on-error: true

        run: |

          if [ -f requirements.txt ]; then

            pip-review --auto

            pip-compile \
              --upgrade \
              requirements.txt

          fi

###############################################################################
# Safety Scan
###############################################################################

      - name: Safety Check

        continue-on-error: true

        run: |

          safety check \
            --json > reports/safety.json

###############################################################################
# pip Freeze
###############################################################################

      - name: Freeze Dependencies

        run: |

          pip freeze > dependency-updates/python-packages.txt

###############################################################################
# Terraform Provider Updates
###############################################################################

      - name: Terraform Init

        working-directory: infrastructure/terraform

        continue-on-error: true

        run: |

          terraform init -upgrade

###############################################################################
# Terraform Providers
###############################################################################

      - name: List Terraform Providers

        continue-on-error: true

        run: |

          terraform providers > dependency-updates/terraform-providers.txt

###############################################################################
# Terraform Lockfile
###############################################################################

      - name: Update Terraform Lockfile

        working-directory: infrastructure/terraform

        continue-on-error: true

        run: |

          terraform providers lock

###############################################################################
# Helm Repository Update
###############################################################################

      - name: Update Helm Repositories

        working-directory: infrastructure/helm

        continue-on-error: true

        run: |

          helm repo update

###############################################################################
# Helm Dependency Update
###############################################################################

      - name: Update Helm Dependencies

        working-directory: infrastructure/helm

        continue-on-error: true

        run: |

          helm dependency update

###############################################################################
# Helm Dependency Build
###############################################################################

      - name: Build Helm Dependencies

        working-directory: infrastructure/helm

        continue-on-error: true

        run: |

          helm dependency build

###############################################################################
# Docker Base Images
###############################################################################

      - name: Check Docker Base Images

        continue-on-error: true

        run: |

          grep "^FROM" infrastructure/docker/Dockerfile.api \
            > dependency-updates/docker-api.txt

          grep "^FROM" infrastructure/docker/Dockerfile.analytics \
            > dependency-updates/docker-analytics.txt

          grep "^FROM" infrastructure/docker/Dockerfile.dashboard \
            > dependency-updates/docker-dashboard.txt

###############################################################################
# GitHub Actions
###############################################################################

      - name: GitHub Actions Inventory

        continue-on-error: true

        run: |

          grep -R "uses:" .github/workflows \
            > dependency-updates/github-actions.txt

###############################################################################
# Generate Dependency Report
###############################################################################

      - name: Generate Dependency Report

        run: |

          cat > reports/dependency-report.md <<EOF

          # Dependency Update Report

          ## Python

          ✔ Dependencies Updated

          ## Terraform

          ✔ Providers Updated

          ✔ Lockfile Refreshed

          ## Helm

          ✔ Repository Updated

          ✔ Dependencies Updated

          ## Docker

          ✔ Base Images Recorded

          ## GitHub Actions

          ✔ Workflow Actions Inventory Generated

          EOF

###############################################################################
# Upload Dependency Reports
###############################################################################

      - name: Upload Reports

        uses: actions/upload-artifact@v4

        with:

          name: dependency-reports

          path: |

            dependency-updates

            reports/dependency-report.md

            reports/safety.json

###############################################################################
# GitHub Step Summary
###############################################################################

      - name: Dependency Summary

        run: |

          cat <<EOF >> $GITHUB_STEP_SUMMARY

          # Dependency Updates

          ## Python

          - pip-review

          - pip-tools

          ## Terraform

          - Providers Updated

          - Lockfile Updated

          ## Helm

          - Repository Updated

          - Dependencies Updated

          ## Docker

          - Base Images Reviewed

          ## GitHub Actions

          - Actions Inventory Generated

          EOF

###############################################################################
# Console Summary
###############################################################################

      - name: Dependency Console Summary

        run: |

          echo "===================================================="

          echo "Institutional Quant Platform"

          echo "Dependency Maintenance"

          echo "===================================================="

          echo ""

          echo "✔ Python"

          echo "✔ Terraform"

          echo "✔ Helm"

          echo "✔ Docker"

          echo "✔ GitHub Actions"

          echo ""

          echo "===================================================="


###############################################################################
# Detect Repository Changes
###############################################################################

      - name: Detect Changes

        id: changes

        run: |

          if [[ -n "$(git status --porcelain)" ]]; then

            echo "changes=true" >> $GITHUB_OUTPUT

          else

            echo "changes=false" >> $GITHUB_OUTPUT

          fi

###############################################################################
# Commit Dependency Updates
###############################################################################

      - name: Commit Changes

        if: steps.changes.outputs.changes == 'true'

        run: |

          git add .

          git commit -m \
            "chore(deps): automated dependency updates"

###############################################################################
# Push Branch
###############################################################################

      - name: Push Branch

        if: steps.changes.outputs.changes == 'true'

        run: |

          git push \
            --set-upstream origin \
            "${BRANCH}"

###############################################################################
# Create Pull Request
###############################################################################

      - name: Create Pull Request

        if: steps.changes.outputs.changes == 'true'

        uses: peter-evans/create-pull-request@v7

        with:

          token: ${{ secrets.GITHUB_TOKEN }}

          branch: ${{ env.BRANCH }}

          base: main

          title: |

            chore(deps): Automated dependency updates

          body: |

            ## Automated Dependency Update

            This PR was generated automatically.

            ### Updated Components

            - Python packages
            - Terraform providers
            - Helm dependencies
            - Docker base image inventory
            - GitHub Actions inventory

            ### Validation

            - Dependency reports generated
            - Safety scan completed
            - Metadata exported

            Please review before merging.

          labels: |

            dependencies

            automation

            maintenance

          commit-message: |

            chore(deps): automated dependency updates

          delete-branch: true

###############################################################################
# Auto Assign Labels
###############################################################################

      - name: Add Additional Labels

        if: steps.changes.outputs.changes == 'true'

        uses: actions/github-script@v7

        with:

          script: |

            const {owner, repo} = context.repo;

            const pulls = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head: `${owner}:${process.env.BRANCH}`
            });

            if (pulls.data.length > 0) {

              await github.rest.issues.addLabels({

                owner,

                repo,

                issue_number: pulls.data[0].number,

                labels: [

                  "dependency-update",

                  "ci",

                  "automated"

                ]

              });

            }

###############################################################################
# Upload Final Reports
###############################################################################

      - name: Upload Final Reports

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: dependency-update-results

          path: |

            reports

            dependency-updates

###############################################################################
# Cleanup Workspace
###############################################################################

      - name: Cleanup

        if: always()

        run: |

          rm -rf reports

          rm -rf dependency-updates

###############################################################################
# Publish GitHub Step Summary
###############################################################################

      - name: Publish Summary

        if: always()

        run: |

          cat <<EOF >> $GITHUB_STEP_SUMMARY

          # Dependency Maintenance

          ## Repository

          ${{ github.repository }}

          ## Branch

          ${BRANCH}

          ## Completed

          ✔ Python dependency updates

          ✔ Terraform provider updates

          ✔ Helm dependency updates

          ✔ Docker inventory

          ✔ GitHub Actions inventory

          ✔ Safety scan

          ✔ Reports uploaded

          ✔ Pull Request automation

          EOF

###############################################################################
# Final Summary Job
###############################################################################

  summary:

    name: Dependency Update Summary

    runs-on: ubuntu-latest

    if: always()

    needs:

      - dependency-update

    steps:

      - name: Final Summary

        run: |

          echo "==================================================="

          echo "Institutional Quant Platform"

          echo "Dependency Update Pipeline"

          echo "==================================================="

          echo ""

          echo "Repository"

          echo "${{ github.repository }}"

          echo ""

          echo "Workflow"

          echo "${{ github.workflow }}"

          echo ""

          echo "Completed"

          echo ""

          echo "✔ Python Dependencies"

          echo "✔ Terraform Providers"

          echo "✔ Helm Dependencies"

          echo "✔ Docker Inventory"

          echo "✔ GitHub Actions Inventory"

          echo "✔ Safety Scan"

          echo "✔ Metadata"

          echo "✔ Pull Request"

          echo "✔ Reports"

          echo ""

          echo "Pipeline Status"

          echo "${{ needs.dependency-update.result }}"

          echo ""

          echo "==================================================="