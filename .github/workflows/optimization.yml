name: Optimization

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "optimization/**"
      - "core/**"
      - "analytics/**"

  pull_request:
    branches:
      - main
      - develop
    paths:
      - "optimization/**"
      - "core/**"
      - "analytics/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:

  optimization:
    name: Optimization Validation
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install -r requirements-dev.txt || true
          pip install -e .

      - name: Compile
        run: |
          python -m compileall -q optimization

      - name: Lint
        run: |
          ruff check optimization

      - name: Tests
        run: |
          pytest -v tests \
            -k "optimization or portfolio or constraint"