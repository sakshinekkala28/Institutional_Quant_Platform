name: Services

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "services/**"
      - "core/services/**"
      - "core/**"

  pull_request:
    branches:
      - main
      - develop
    paths:
      - "services/**"
      - "core/services/**"
      - "core/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:

  services:
    name: Services Validation
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install -r requirements-dev.txt || true
          pip install -e .

      - name: Compile
        run: |
          python -m compileall -q services

          if [ -d core/services ]; then
            python -m compileall -q core/services
          fi

      - name: Lint
        run: |
          ruff check services

          if [ -d core/services ]; then
            ruff check core/services
          fi

      - name: Tests
        run: |
          pytest -v tests \
            -k "service"