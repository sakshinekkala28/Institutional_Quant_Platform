name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "*.md"

  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "*.md"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: documentation
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:

  documentation:

    name: Build Documentation

    runs-on: ubuntu-latest

    steps:

      ####################################################################
      # Checkout
      ####################################################################

      - uses: actions/checkout@v7

      ####################################################################
      # Python
      ####################################################################

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      ####################################################################
      # Install Dependencies
      ####################################################################

      - name: Install Documentation Packages
        run: |
          python -m pip install --upgrade pip

          pip install \
            mkdocs \
            mkdocs-material \
            mkdocstrings \
            mkdocstrings-python \
            pymdown-extensions \
            mike \
            markdown-callouts \
            markdown-include

      ####################################################################
      # Markdown Lint
      ####################################################################

      - name: Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            **/*.md

      ####################################################################
      # Link Check
      ####################################################################

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true

      ####################################################################
      # Build Site
      ####################################################################

      - name: Build Documentation
        run: |
          mkdocs build --strict

      ####################################################################
      # Upload Artifact
      ####################################################################

      - name: Upload Site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:

    name: Deploy Documentation

    if: github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs:
      - documentation

    steps:

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  summary:

    name: Documentation Summary

    runs-on: ubuntu-latest

    needs:
      - deploy

    if: always()

    steps:

      - run: |
          echo "========================================="
          echo "Institutional Quant Platform"
          echo "Documentation Build Complete"
          echo "========================================="
          echo ""
          echo "✓ Markdown Validated"
          echo "✓ Links Checked"
          echo "✓ MkDocs Built"
          echo "✓ GitHub Pages Deployed"