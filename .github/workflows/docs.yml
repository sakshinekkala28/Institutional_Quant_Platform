name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "*.md"

  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "*.md"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: documentation
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:

  documentation:
    name: Build Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      ####################################################################
      # Checkout
      ####################################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ####################################################################
      # Setup Python
      ####################################################################

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      ####################################################################
      # Cache Pip Packages
      ####################################################################

      - name: Cache Documentation Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: docs-${{ runner.os }}-${{ hashFiles('mkdocs.yml') }}
          restore-keys: |
            docs-${{ runner.os }}-

      ####################################################################
      # Install Dependencies
      ####################################################################

      - name: Install Documentation Packages
        run: |
          python -m pip install --upgrade pip

          pip install \
            mkdocs \
            mkdocs-material \
            mkdocstrings \
            mkdocstrings-python \
            pymdown-extensions \
            mike \
            markdown-callouts \
            markdown-include

      ####################################################################
      # Markdown Lint
      ####################################################################

      - name: Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: |
            **/*.md

      ####################################################################
      # Link Checker
      ####################################################################

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true

      ####################################################################
      # Build Documentation
      ####################################################################

      - name: Build Documentation
        run: |
          mkdocs build --strict

      ####################################################################
      # Setup GitHub Pages
      ####################################################################

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      ####################################################################
      # Upload Site
      ####################################################################

      - name: Upload Site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy Documentation

    if: github.ref == 'refs/heads/main'

    needs:
      - documentation

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      ####################################################################
      # Deploy
      ####################################################################

      - name: Deploy Documentation
        id: deployment
        uses: actions/deploy-pages@v4

  summary:
    name: Documentation Summary

    if: always()

    needs:
      - deploy

    runs-on: ubuntu-latest

    steps:

      ####################################################################
      # Summary
      ####################################################################

      - name: Documentation Summary
        run: |
          echo "========================================="
          echo "Institutional Quant Platform"
          echo "Documentation Build Complete"
          echo "========================================="
          echo ""
          echo "Repository"
          echo "${{ github.repository }}"
          echo ""
          echo "Branch"
          echo "${{ github.ref_name }}"
          echo ""
          echo "Commit"
          echo "${{ github.sha }}"
          echo ""
          echo "Validation"
          echo "✓ Markdown Validated"
          echo "✓ Links Checked"
          echo ""
          echo "Documentation"
          echo "✓ MkDocs Built"
          echo "✓ GitHub Pages Deployed"
          echo ""
          echo "Workflow Status"
          echo "${{ needs.deploy.result }}"
          echo ""
          echo "========================================="
