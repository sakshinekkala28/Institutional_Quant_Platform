###############################################################################
# Institutional Quant Platform
# 03 • Full Platform Execution
###############################################################################

name: 03 • Full Platform Execution

on:

  workflow_dispatch:

  push:

    branches:
      - main

  pull_request:

    branches:
      - main

permissions:

  contents: read

env:

  PYTHONUNBUFFERED: "1"

  PYTHONDONTWRITEBYTECODE: "1"

  PIP_DISABLE_PIP_VERSION_CHECK: "1"

  FORCE_COLOR: "1"

concurrency:

  group: platform-execution-${{ github.workflow }}-${{ github.ref }}

  cancel-in-progress: true

jobs:

  platform-execution:

    name: Institutional Quant Platform

    runs-on: ubuntu-latest

    timeout-minutes: 180

    steps:

      # =====================================================================
      # CHECKOUT
      # =====================================================================

      - name: Checkout Repository

        uses: actions/checkout@v4

      # =====================================================================
      # PYTHON
      # =====================================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

          cache: pip

      # =====================================================================
      # INSTALL
      # =====================================================================

      - name: Install Platform

        run: |

          python -m pip install --upgrade pip

          pip install -e .[dev]

      # =====================================================================
      # COMPILE
      # =====================================================================

      - name: Compile Platform

        run: |

          python -m compileall -q .

      # =====================================================================
      # PREPARE DIRECTORIES
      # =====================================================================

      - name: Prepare Runtime Directories

        run: |

          mkdir -p artifacts

          mkdir -p reports

          mkdir -p logs

          mkdir -p outputs

      # =====================================================================
      # PLATFORM EXECUTION
      # =====================================================================

      - name: Execute Full Platform

        run: |

          python -m orchestration.run_pipeline \
            --executor sequential \
            --summary \
            --report artifacts/execution_report.json

      # =====================================================================
      # UPLOAD EXECUTION ARTIFACTS
      # =====================================================================

      - name: Upload Execution Artifacts

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: institutional-platform-execution

          if-no-files-found: ignore

          path: |

            artifacts/**

            reports/**

            outputs/**

            logs/**

            *.csv

            *.xlsx

            *.json

            *.pdf

            *.pptx

      # =====================================================================
      # FINAL STATUS
      # =====================================================================

      - name: Execution Summary

        if: always()

        run: |

          echo "=================================================="

          echo "Institutional Quant Platform"

          echo "Full Platform Execution"

          echo "=================================================="

          echo "Executor : sequential"

          echo "Status   : ${{ job.status }}"

          echo "=================================================="
