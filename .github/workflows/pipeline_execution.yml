name: 03 • Institutional Platform Execution

on:

  workflow_dispatch:

  push:

    branches:

      - main

      - develop

  pull_request:

    branches:

      - main

permissions:

  contents: read

env:

  PYTHONUNBUFFERED: "1"

  PYTHONDONTWRITEBYTECODE: "1"

  PIP_DISABLE_PIP_VERSION_CHECK: "1"

  FORCE_COLOR: "1"

concurrency:

  group: platform-${{ github.workflow }}-${{ github.ref }}

  cancel-in-progress: true

jobs:

  platform:

    name: Institutional Quant Platform

    runs-on: ubuntu-latest

    timeout-minutes: 180

    strategy:

      fail-fast: true

    steps:

      #######################################################################
      # Checkout
      #######################################################################

      - name: Checkout Repository

        uses: actions/checkout@v4

      #######################################################################
      # Python
      #######################################################################

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

          cache: pip

      #######################################################################
      # Install
      #######################################################################

      - name: Install Dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -e .[dev]

      #######################################################################
      # Compile
      #######################################################################

      - name: Compile Platform

        run: |

          python -m compileall -q .

      #######################################################################
      # Data Pipeline
      #######################################################################

      - name: Data Pipeline

        run: |

          python -m orchestration.pipelines.data_pipeline

      #######################################################################
      # Factor Pipeline
      #######################################################################

      - name: Factor Pipeline

        run: |

          python -m orchestration.pipelines.factor_pipeline

      #######################################################################
      # Alpha Pipeline
      #######################################################################

      - name: Alpha Pipeline

        run: |

          python -m orchestration.pipelines.alpha_pipeline

      #######################################################################
      # Signal Pipeline
      #######################################################################

      - name: Signal Pipeline

        run: |

          python -m orchestration.pipelines.signal_pipeline

      #######################################################################
      # Risk Model Pipeline
      #######################################################################

      - name: Risk Model Pipeline

        run: |

          python -m orchestration.pipelines.risk_model_pipeline

      #######################################################################
      # Risk Pipeline
      #######################################################################

      - name: Risk Pipeline

        run: |

          python -m orchestration.pipelines.risk_pipeline

      #######################################################################
      # Portfolio Pipeline
      #######################################################################

      - name: Portfolio Pipeline

        run: |

          python -m orchestration.pipelines.portfolio_pipeline

      #######################################################################
      # Execution Pipeline
      #######################################################################

      - name: Execution Pipeline

        run: |

          python -m orchestration.pipelines.execution_pipeline

      #######################################################################
      # Performance Pipeline
      #######################################################################

      - name: Performance Pipeline

        run: |

          python -m orchestration.pipelines.performance_pipeline

      #######################################################################
      # Reporting Pipeline
      #######################################################################

      - name: Reporting Pipeline

        run: |

          python -m orchestration.pipelines.reporting_pipeline

      #######################################################################
      # Master Rebalance Engine
      #######################################################################

      - name: Master Rebalance Engine

        run: |

          python -m orchestration.master_rebalance_engine

      #######################################################################
      # Live Rebalance Engine
      #######################################################################

      - name: Live Rebalance Engine

        run: |

          python -m analytics.live.live_rebalance_engine

      #######################################################################
      # Pipeline Runner
      #######################################################################

      - name: Platform Runner

        run: |

          python -m orchestration.run_pipeline

      #######################################################################
      # Upload Artifacts
      #######################################################################

      - name: Upload Reports

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: institutional-platform

          if-no-files-found: ignore

          path: |

            reports/**

            artifacts/**

            outputs/**

            htmlcov/**

            logs/**

            *.csv

            *.xlsx

            *.pdf

            *.pptx

            *.json

      #######################################################################
      # Summary
      #######################################################################

      - name: Execution Summary

        if: always()

        run: |

          echo "=========================================="

          echo "Institutional Quant Platform"

          echo "Platform Execution Completed"

          echo "=========================================="

          echo "✓ Data Pipeline"

          echo "✓ Factor Pipeline"

          echo "✓ Alpha Pipeline"

          echo "✓ Signal Pipeline"

          echo "✓ Risk Model Pipeline"

          echo "✓ Risk Pipeline"

          echo "✓ Portfolio Pipeline"

          echo "✓ Execution Pipeline"

          echo "✓ Performance Pipeline"

          echo "✓ Reporting Pipeline"

          echo "✓ Master Rebalance"

          echo "✓ Live Rebalance"

          echo "=========================================="
