name: Analytics

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "analytics/**"
      - "core/**"

  pull_request:
    branches:
      - main
      - develop
    paths:
      - "analytics/**"
      - "core/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:

  analytics:
    name: Analytics Validation
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

          if [ -f pyproject.toml ]; then
            pip install -e .
          fi

      - name: Compile analytics
        run: |
          python -m compileall -q analytics

      - name: Lint analytics
        run: |
          ruff check analytics

      - name: Test analytics
        run: |
          pytest -v tests \
            -k "analytics or alpha or factor or risk or signal or regime"
