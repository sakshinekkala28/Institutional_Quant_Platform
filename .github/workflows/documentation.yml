name: Documentation Pipeline

###############################################################################
# Triggers
###############################################################################

on:

  push:

    branches:

      - main

      - develop

      - staging

  pull_request:

    branches:

      - main

      - develop

      - staging

  workflow_dispatch:

###############################################################################
# Permissions
###############################################################################

permissions:

  contents: write

  pages: write

  id-token: write

###############################################################################
# Concurrency
###############################################################################

concurrency:

  group: documentation-${{ github.workflow }}-${{ github.ref }}

  cancel-in-progress: true

###############################################################################
# Environment
###############################################################################

env:

  PYTHON_VERSION: "3.12"

  DOCS_DIR: documentation

  GENERATED_DIR: documentation/generated

  REPORTS_DIR: documentation/reports

###############################################################################
# Jobs
###############################################################################

jobs:

###############################################################################
# Documentation Validation & Generation
###############################################################################

  documentation:

    name: Documentation Pipeline

    runs-on: ubuntu-latest

    timeout-minutes: 45

    defaults:

      run:

        shell: bash

###############################################################################
# Steps
###############################################################################

    steps:

###############################################################################
# Checkout Repository
###############################################################################

      - name: Checkout Repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 0

###############################################################################
# Setup Python
###############################################################################

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: ${{ env.PYTHON_VERSION }}

          cache: pip

###############################################################################
# Cache Python Packages
###############################################################################

      - name: Cache Python Packages

        uses: actions/cache@v4

        with:

          path: |

            ~/.cache/pip

          key: >

            docs-${{ runner.os }}-${{
            hashFiles(
              'requirements*.txt',
              'pyproject.toml',
              'mkdocs.yml'
            )
            }}

          restore-keys: |

            docs-${{ runner.os }}-

###############################################################################
# Install Documentation Dependencies
###############################################################################

      - name: Install Documentation Dependencies

        run: |

          set -e

          python -m pip install \
            --upgrade \
            pip \
            wheel \
            setuptools

          pip install \
            mkdocs \
            mkdocs-material \
            mkdocstrings[python] \
            pymdown-extensions \
            markdown \
            pydocstyle \
            interrogate \
            griffe \
            black \
            yamllint \
            mdformat \
            mdformat-gfm \
            mdformat-frontmatter \
            pdoc

###############################################################################
# Environment Information
###############################################################################

      - name: Environment Information

        run: |

          echo "======================================================"

          echo "Institutional Quant Platform"

          echo "Documentation Pipeline"

          echo "======================================================"

          echo

          echo "Repository : ${{ github.repository }}"

          echo "Branch     : ${{ github.ref_name }}"

          echo "Commit     : ${{ github.sha }}"

          echo

          echo "Python"

          python --version

          echo

          echo "Pip"

          pip --version

          echo

          echo "MkDocs"

          mkdocs --version

          echo

          echo "======================================================"

###############################################################################
# Prepare Workspace
###############################################################################

      - name: Prepare Documentation Workspace

        run: |

          mkdir -p "${DOCS_DIR}"

          mkdir -p "${GENERATED_DIR}"

          mkdir -p "${REPORTS_DIR}"

          mkdir -p "${DOCS_DIR}/archive"

          mkdir -p "${DOCS_DIR}/final"

###############################################################################
# Export Metadata
###############################################################################

      - name: Export Documentation Metadata

        run: |

          cat > "${DOCS_DIR}/metadata.json" <<EOF
          {
            "repository": "${{ github.repository }}",
            "branch": "${{ github.ref_name }}",
            "workflow": "${{ github.workflow }}",
            "commit": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "run_number": "${{ github.run_number }}",
            "generated": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

###############################################################################
# Upload Metadata
###############################################################################

      - name: Upload Documentation Metadata

        uses: actions/upload-artifact@v4

        with:

          name: documentation-metadata

          path: |

            documentation/metadata.json

          if-no-files-found: error

###############################################################################
# Markdown Formatting
###############################################################################

      - name: Format Markdown

        continue-on-error: true

        run: |

          set -e

          echo "Formatting Markdown files..."

          mdformat .

###############################################################################
# Markdown Lint
###############################################################################

      - name: Markdown Lint

        uses: DavidAnson/markdownlint-cli2-action@v18

        with:

          globs: |

            **/*.md

###############################################################################
# YAML Validation
###############################################################################

      - name: Validate YAML Files

        run: |

          set -e

          echo "Validating YAML files..."

          yamllint .

###############################################################################
# README Validation
###############################################################################

      - name: Verify Repository Documentation

        run: |

          set -e

          test -f README.md

          test -f LICENSE || true

          test -f CONTRIBUTING.md || true

          echo "Repository documentation verified."

###############################################################################
# Documentation Statistics
###############################################################################

      - name: Documentation Statistics

        run: |

          mkdir -p "${REPORTS_DIR}"

          {

            echo "# Documentation Statistics"

            echo

            echo "Generated: $(date -u)"

            echo

            echo "## Markdown Files"

            find . -name "*.md" | wc -l

            echo

            echo "## Python Files"

            find . -name "*.py" | wc -l

            echo

            echo "## YAML Files"

            find . \( -name "*.yaml" -o -name "*.yml" \) | wc -l

            echo

            echo "## Documentation Directories"

            find . -type d -name docs

          } > "${REPORTS_DIR}/documentation_statistics.md"

###############################################################################
# Broken Link Check
###############################################################################

      - name: Check Documentation Links

        uses: lycheeverse/lychee-action@v2

        with:

          args: >

            --verbose

            --no-progress

            --accept 200,206,429

            "**/*.md"

        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

###############################################################################
# Python Docstring Validation
###############################################################################

      - name: Validate Python Docstrings

        continue-on-error: true

        run: |

          pydocstyle .

###############################################################################
# Docstring Coverage
###############################################################################

      - name: Measure Docstring Coverage

        continue-on-error: true

        run: |

          interrogate . \
            --ignore-init-method \
            --ignore-module \
            --generate-badge "${REPORTS_DIR}/"

###############################################################################
# Python Syntax Validation
###############################################################################

      - name: Validate Python Compilation

        continue-on-error: true

        run: |

          python -m compileall .

###############################################################################
# TODO Report
###############################################################################

      - name: Generate TODO Report

        run: |

          grep -R "TODO" . \
            --include="*.py" \
            --include="*.md" \
            > "${REPORTS_DIR}/todos.txt" || true

###############################################################################
# FIXME Report
###############################################################################

      - name: Generate FIXME Report

        run: |

          grep -R "FIXME" . \
            --include="*.py" \
            --include="*.md" \
            > "${REPORTS_DIR}/fixme.txt" || true

###############################################################################
# Repository Tree
###############################################################################

      - name: Generate Repository Tree

        run: |

          sudo apt-get update

          sudo apt-get install -y tree

          tree -L 5 \
            > "${GENERATED_DIR}/repository-tree.txt"

###############################################################################
# Upload Validation Reports
###############################################################################

      - name: Upload Validation Reports

        uses: actions/upload-artifact@v4

        with:

          name: documentation-validation

          if-no-files-found: ignore

          path: |

            documentation/reports

            documentation/generated/repository-tree.txt

###############################################################################
# Validation Summary
###############################################################################

      - name: Documentation Validation Summary

        run: |

          cat <<EOF >> $GITHUB_STEP_SUMMARY

          # Documentation Validation

          ## Completed

          - ✅ Markdown Formatting

          - ✅ Markdown Lint

          - ✅ YAML Validation

          - ✅ README Verification

          - ✅ Broken Link Analysis

          - ✅ Python Docstring Validation

          - ✅ Docstring Coverage

          - ✅ Python Compilation

          - ✅ TODO/FIXME Reports

          - ✅ Repository Tree Generation

          EOF

###############################################################################
# Console Summary
###############################################################################

      - name: Validation Console Summary

        run: |

          echo "===================================================="

          echo "Documentation Validation Completed"

          echo "===================================================="

          echo

          echo "✓ Markdown"

          echo "✓ YAML"

          echo "✓ README"

          echo "✓ Links"

          echo "✓ Docstrings"

          echo "✓ Coverage"

          echo "✓ Repository Tree"

          echo

          echo "===================================================="

###############################################################################
# Install terraform-docs
###############################################################################

      - name: Generate Terraform Documentation

        uses: terraform-docs/gh-actions@v1.4.1

        with:

          working-dir: infrastructure/terraform

          output-file: TERRAFORM.md

          output-method: inject

          git-push: false

###############################################################################
# Install helm-docs
###############################################################################

      - name: Install helm-docs

        run: |

          set -e

          HELM_DOCS_VERSION="1.14.2"

          curl -fsSL \
            "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz" \
            -o helm-docs.tar.gz

          tar -xzf helm-docs.tar.gz

          chmod +x helm-docs

          sudo mv helm-docs /usr/local/bin/

          helm-docs --version

###############################################################################
# Generate Helm Documentation
###############################################################################

      - name: Generate Helm Documentation

        run: |

          set -e

          helm-docs \
            --chart-search-root infrastructure/helm

###############################################################################
# Generate Python API Documentation
###############################################################################

      - name: Generate Python API Documentation

        continue-on-error: true

        run: |

          mkdir -p "${GENERATED_DIR}/api"

          pdoc \
            --output-dir "${GENERATED_DIR}/api" \
            .

###############################################################################
# Generate Package Inventory
###############################################################################

      - name: Generate Package Inventory

        continue-on-error: true

        run: |

          python <<'EOF'

          import pkgutil

          from pathlib import Path

          output = Path("${GENERATED_DIR}") / "packages.txt"

          output.parent.mkdir(
              parents=True,
              exist_ok=True,
          )

          with output.open(
              "w",
              encoding="utf-8",
          ) as f:

              for module in sorted(
                  pkgutil.iter_modules(),
                  key=lambda m: m.name.lower(),
              ):

                  f.write(
                      module.name + "\n"
                  )

          print(
              f"Generated {output}"
          )

          EOF

###############################################################################
# Generate Project Statistics
###############################################################################

      - name: Generate Project Statistics

        run: |

          mkdir -p "${GENERATED_DIR}"

          {

            echo "# Institutional Quant Platform"

            echo

            echo "Generated: $(date -u)"

            echo

            echo "## Python Files"

            find . -name "*.py" | wc -l

            echo

            echo "## Markdown Files"

            find . -name "*.md" | wc -l

            echo

            echo "## YAML Files"

            find . \
              \( \
                -name "*.yaml" \
                -o \
                -name "*.yml" \
              \) \
              | wc -l

            echo

            echo "## Terraform Files"

            find . \
              -name "*.tf" \
              | wc -l

            echo

            echo "## Dockerfiles"

            find . \
              -name "Dockerfile*" \
              | wc -l

          } \
          > "${GENERATED_DIR}/statistics.md"

###############################################################################
# Validate MkDocs Configuration
###############################################################################

      - name: Validate MkDocs Configuration

        run: |

          if [

            -f mkdocs.yml

          ]; then

            echo "Validating MkDocs..."

            mkdocs build \
              --strict

          else

            echo "mkdocs.yml not found."

          fi

###############################################################################
# Build Documentation
###############################################################################

      - name: Build MkDocs Site

        run: |

          if [

            -f mkdocs.yml

          ]; then

            echo "Building documentation..."

            mkdocs build

          else

            echo "Skipping MkDocs build."

          fi

###############################################################################
# Generate Documentation Index
###############################################################################

      - name: Generate Documentation Index

        run: |

          cat > "${GENERATED_DIR}/index.md" <<EOF

          # Institutional Quant Platform

          ## Generated Documentation

          - Python API Documentation

          - Terraform Documentation

          - Helm Documentation

          - Repository Tree

          - Package Inventory

          - Project Statistics

          EOF

###############################################################################
# Archive Generated Documentation
###############################################################################

      - name: Archive Documentation

        run: |

          mkdir -p "${DOCS_DIR}/archive"

          cp -r \
            "${GENERATED_DIR}" \
            "${DOCS_DIR}/archive/"

###############################################################################
# Upload Generated Documentation
###############################################################################

      - name: Upload Generated Documentation

        uses: actions/upload-artifact@v4

        with:

          name: generated-documentation

          if-no-files-found: ignore

          path: |

            documentation/generated

            documentation/archive

            site

###############################################################################
# Documentation Build Summary
###############################################################################

      - name: Documentation Build Summary

        run: |

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"

          # Documentation Generation

          ## Generated

          - ✅ Python API Documentation

          - ✅ Terraform Documentation

          - ✅ Helm Documentation

          - ✅ MkDocs Site

          - ✅ Project Statistics

          - ✅ Package Inventory

          EOF

###############################################################################
# Console Summary
###############################################################################

      - name: Documentation Generation Console Summary

        run: |

          echo "===================================================="

          echo "Documentation Generation Completed"

          echo "===================================================="

          echo

          echo "✓ Terraform Documentation"

          echo "✓ Helm Documentation"

          echo "✓ Python API Documentation"

          echo "✓ MkDocs"

          echo "✓ Project Statistics"

          echo "✓ Package Inventory"

          echo

          echo "===================================================="


###############################################################################
# Configure GitHub Pages
###############################################################################

      - name: Configure GitHub Pages

        if: github.ref == 'refs/heads/main'

        uses: actions/configure-pages@v5

###############################################################################
# Upload GitHub Pages Artifact
###############################################################################

      - name: Upload GitHub Pages Artifact

        if: |

          github.ref == 'refs/heads/main' &&

          hashFiles('site/**') != ''

        uses: actions/upload-pages-artifact@v3

        with:

          path: site

###############################################################################
# Documentation Manifest
###############################################################################

      - name: Generate Documentation Manifest

        run: |

          mkdir -p "${DOCS_DIR}/final"

          cat > "${DOCS_DIR}/final/manifest.json" <<EOF
          {
            "repository":"${{ github.repository }}",
            "branch":"${{ github.ref_name }}",
            "workflow":"${{ github.workflow }}",
            "commit":"${{ github.sha }}",
            "run_id":"${{ github.run_id }}",
            "run_number":"${{ github.run_number }}",
            "actor":"${{ github.actor }}",
            "generated":"$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

###############################################################################
# Upload Documentation Manifest
###############################################################################

      - name: Upload Documentation Manifest

        uses: actions/upload-artifact@v4

        with:

          name: documentation-manifest

          if-no-files-found: error

          path: |

            documentation/final/manifest.json

###############################################################################
# Cleanup Workspace
###############################################################################

      - name: Cleanup Workspace

        if: always()

        run: |

          rm -rf "${DOCS_DIR}/archive"

          rm -rf "${GENERATED_DIR}"

          rm -rf "${REPORTS_DIR}"

###############################################################################
# Final Documentation Summary
###############################################################################

      - name: Publish Documentation Summary

        if: always()

        run: |

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"

          # Documentation Pipeline

          ## Validation

          - ✅ Markdown Validation

          - ✅ YAML Validation

          - ✅ Link Validation

          - ✅ README Validation

          - ✅ Docstring Validation

          ---

          ## Documentation

          - ✅ Python API Documentation

          - ✅ Terraform Documentation

          - ✅ Helm Documentation

          - ✅ MkDocs Build

          ---

          ## Publication

          - ✅ Documentation Manifest

          - ✅ Documentation Artifacts

          EOF

###############################################################################
# Deploy GitHub Pages
###############################################################################

  deploy-pages:

    name: Deploy Documentation

    if: |

      github.ref == 'refs/heads/main'

    needs:

      - documentation

    runs-on: ubuntu-latest

    permissions:

      pages: write

      id-token: write

    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages

        id: deployment

        uses: actions/deploy-pages@v4

###############################################################################
# Final Summary
###############################################################################

  summary:

    name: Documentation Summary

    if: always()

    needs:

      - documentation

      - deploy-pages

    runs-on: ubuntu-latest

    steps:

      - name: Pipeline Summary

        run: |

          echo "======================================================"

          echo "Institutional Quant Platform"

          echo "Enterprise Documentation Pipeline"

          echo "======================================================"

          echo

          echo "Repository"

          echo "${{ github.repository }}"

          echo

          echo "Branch"

          echo "${{ github.ref_name }}"

          echo

          echo "Commit"

          echo "${{ github.sha }}"

          echo

          echo "Run ID"

          echo "${{ github.run_id }}"

          echo

          echo "Actor"

          echo "${{ github.actor }}"

          echo

          echo "Documentation Job"

          echo "${{ needs.documentation.result }}"

          echo

          echo "Deployment Job"

          echo "${{ needs.deploy-pages.result }}"

          echo

          echo "======================================================"

          echo "Completed"

          echo "======================================================"

          echo "✔ Markdown Validation"

          echo "✔ YAML Validation"

          echo "✔ Broken Link Validation"

          echo "✔ Repository Verification"

          echo "✔ Docstring Validation"

          echo "✔ Terraform Documentation"

          echo "✔ Helm Documentation"

          echo "✔ Python API Documentation"

          echo "✔ MkDocs Build"

          echo "✔ Documentation Artifacts"

          echo "✔ GitHub Pages Deployment"

          echo "✔ Documentation Manifest"

          echo

          echo "======================================================"

###############################################################################
# End of Workflow
###############################################################################
