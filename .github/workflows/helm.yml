name: Helm Chart Validation

###############################################################################
# Triggers
###############################################################################

on:

  push:

    branches:

      - main

      - develop

      - staging

    paths:

      - "infrastructure/helm/**"

      - ".github/workflows/helm.yml"

  pull_request:

    branches:

      - main

      - develop

      - staging

    paths:

      - "infrastructure/helm/**"

  workflow_dispatch:

###############################################################################
# Permissions
###############################################################################

permissions:

  contents: read

  packages: write

###############################################################################
# Concurrency
###############################################################################

concurrency:

  group: helm-${{ github.ref }}

  cancel-in-progress: true

###############################################################################
# Environment
###############################################################################

env:

  HELM_VERSION: "3.18.4"

  CHART_DIRECTORY: infrastructure/helm

###############################################################################
# Jobs
###############################################################################

jobs:

###############################################################################
# Helm Validation
###############################################################################

  helm:

    name: Helm Validation

    runs-on: ubuntu-latest

    timeout-minutes: 30

###############################################################################
# Checkout Repository
###############################################################################

    steps:

      - name: Checkout Repository

        uses: actions/checkout@v7

###############################################################################
# Install Helm
###############################################################################

      - name: Setup Helm

        uses: azure/setup-helm@v5

        with:

          version: ${{ env.HELM_VERSION }}

###############################################################################
# Display Helm Version
###############################################################################

      - name: Helm Version

        run: |

          helm version

###############################################################################
# Cache Helm Dependencies
###############################################################################

      - name: Cache Helm Repository

        uses: actions/cache@v6

        with:

          path: |

            ~/.cache/helm

            ~/.config/helm

            ~/.local/share/helm

          key: helm-${{ runner.os }}-${{ hashFiles('infrastructure/helm/Chart.lock') }}

          restore-keys: |

            helm-${{ runner.os }}-

###############################################################################
# Add Helm Repositories
###############################################################################

      - name: Add Helm Repositories

        run: |

          helm repo add bitnami https://charts.bitnami.com/bitnami

          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts

          helm repo add grafana https://grafana.github.io/helm-charts

          helm repo update

###############################################################################
# Update Dependencies
###############################################################################

      - name: Helm Dependency Update

        working-directory: ${{ env.CHART_DIRECTORY }}

        run: |

          helm dependency update

###############################################################################
# Build Dependencies
###############################################################################

      - name: Helm Dependency Build

        working-directory: ${{ env.CHART_DIRECTORY }}

        run: |

          helm dependency build

###############################################################################
# Display Chart Information
###############################################################################

      - name: Chart Information

        working-directory: ${{ env.CHART_DIRECTORY }}

        run: |

          echo "=============================================="

          echo "Institutional Quant Platform"

          echo "Helm Validation Pipeline"

          echo "=============================================="

          echo ""

          echo "Chart"

          helm show chart .

          echo ""

          echo "=============================================="


###############################################################################
# Helm Lint
###############################################################################

      - name: Helm Lint

        working-directory: ${{ env.CHART_DIRECTORY }}

        run: |

          helm lint .

###############################################################################
# Validate Values Files
###############################################################################

      - name: Validate Values Files

        working-directory: ${{ env.CHART_DIRECTORY }}

        run: |

          helm lint . \
            --values values.yaml

          if [ -f values-dev.yaml ]; then

            helm lint . \
              --values values-dev.yaml

          fi

          if [ -f values-staging.yaml ]; then

            helm lint . \
              --values values-staging.yaml

          fi

          if [ -f values-prod.yaml ]; then

            helm lint . \
              --values values-prod.yaml

          fi

###############################################################################
# Render Default Manifest
###############################################################################

      - name: Render Default Templates

        working-directory: ${{ env.CHART_DIRECTORY }}

        run: |

          helm template \
            institutional-quant \
            . \
            --values values.yaml \
            > rendered-default.yaml

###############################################################################
# Render Development
###############################################################################

      - name: Render Development Templates

        working-directory: ${{ env.CHART_DIRECTORY }}

        run: |

          if [ -f values-dev.yaml ]; then

            helm template \
              institutional-quant \
              . \
              --values values-dev.yaml \
              > rendered-dev.yaml

          fi

###############################################################################
# Render Staging
###############################################################################

      - name: Render Staging Templates

        working-directory: ${{ env.CHART_DIRECTORY }}

        run: |

          if [ -f values-staging.yaml ]; then

            helm template \
              institutional-quant \
              . \
              --values values-staging.yaml \
              > rendered-staging.yaml

          fi

###############################################################################
# Render Production
###############################################################################

      - name: Render Production Templates

        working-directory: ${{ env.CHART_DIRECTORY }}

        run: |

          if [ -f values-prod.yaml ]; then

            helm template \
              institutional-quant \
              . \
              --values values-prod.yaml \
              > rendered-prod.yaml

          fi

###############################################################################
# Dry Run Installation
###############################################################################

      - name: Dry Run Installation

        working-directory: ${{ env.CHART_DIRECTORY }}

        run: |

          helm install \
            institutional-quant \
            . \
            --values values.yaml \
            --dry-run \
            --debug

###############################################################################
# Validate YAML
###############################################################################

      - name: Install yamllint

        run: |

          sudo apt-get update

          sudo apt-get install -y yamllint

###############################################################################
# YAML Validation
###############################################################################

      - name: Validate Rendered YAML

        working-directory: ${{ env.CHART_DIRECTORY }}

        run: |

          yamllint rendered-default.yaml

          if [ -f rendered-dev.yaml ]; then

            yamllint rendered-dev.yaml

          fi

          if [ -f rendered-staging.yaml ]; then

            yamllint rendered-staging.yaml

          fi

          if [ -f rendered-prod.yaml ]; then

            yamllint rendered-prod.yaml

          fi

###############################################################################
# Upload Rendered Manifests
###############################################################################

      - name: Upload Rendered Charts

        uses: actions/upload-artifact@v7

        with:

          name: rendered-manifests

          path: |

            ${{ env.CHART_DIRECTORY }}/rendered-default.yaml

            ${{ env.CHART_DIRECTORY }}/rendered-dev.yaml

            ${{ env.CHART_DIRECTORY }}/rendered-staging.yaml

            ${{ env.CHART_DIRECTORY }}/rendered-prod.yaml

          if-no-files-found: ignore

###############################################################################
# Publish Validation Summary
###############################################################################

      - name: Validation Summary

        run: |

          cat <<EOF >> $GITHUB_STEP_SUMMARY

          # Helm Validation

          ## Completed

          - Helm lint
          - Values validation
          - Template rendering
          - Dry-run installation
          - YAML validation
          - Manifest artifacts uploaded

          EOF

###############################################################################
# Console Summary
###############################################################################

      - name: Helm Validation Summary

        run: |

          echo "=============================================="

          echo "Institutional Quant Platform"

          echo "Helm Validation"

          echo "=============================================="

          echo ""

          echo "✔ Chart Lint"

          echo "✔ Values Validation"

          echo "✔ Template Rendering"

          echo "✔ Dry Run"

          echo "✔ YAML Validation"

          echo ""

          echo "=============================================="


###############################################################################
# Install kubeconform
###############################################################################

      - name: Install kubeconform

        run: |

          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz

          sudo mv kubeconform /usr/local/bin/

###############################################################################
# kubeconform Version
###############################################################################

      - name: kubeconform Version

        run: |

          kubeconform -v

###############################################################################
# Kubernetes Schema Validation
###############################################################################

      - name: Validate Kubernetes Schemas

        working-directory: ${{ env.CHART_DIRECTORY }}

        run: |

          kubeconform \
            -strict \
            -summary \
            rendered-default.yaml

          if [ -f rendered-dev.yaml ]; then

            kubeconform \
              -strict \
              -summary \
              rendered-dev.yaml

          fi

          if [ -f rendered-staging.yaml ]; then

            kubeconform \
              -strict \
              -summary \
              rendered-staging.yaml

          fi

          if [ -f rendered-prod.yaml ]; then

            kubeconform \
              -strict \
              -summary \
              rendered-prod.yaml

          fi

###############################################################################
# Install kube-score
###############################################################################

      - name: Install kube-score

        run: |

          curl -L https://github.com/zegl/kube-score/releases/latest/download/kube-score_linux_amd64.tar.gz \
            | tar xz

          sudo mv kube-score /usr/local/bin/

###############################################################################
# kube-score Version
###############################################################################

      - name: kube-score Version

        run: |

          kube-score version

###############################################################################
# kube-score Analysis
###############################################################################

      - name: Run kube-score

        working-directory: ${{ env.CHART_DIRECTORY }}

        run: |

          kube-score score rendered-default.yaml

          if [ -f rendered-dev.yaml ]; then

            kube-score score rendered-dev.yaml

          fi

          if [ -f rendered-staging.yaml ]; then

            kube-score score rendered-staging.yaml

          fi

          if [ -f rendered-prod.yaml ]; then

            kube-score score rendered-prod.yaml

          fi

###############################################################################
# Package Helm Chart
###############################################################################

      - name: Package Chart

        working-directory: ${{ env.CHART_DIRECTORY }}

        run: |

          mkdir -p packages

          helm package . \
            --destination packages

###############################################################################
# Verify Helm Package
###############################################################################

      - name: Verify Package

        working-directory: ${{ env.CHART_DIRECTORY }}

        run: |

          ls -lh packages

###############################################################################
# Generate SHA256
###############################################################################

      - name: Generate SHA256

        working-directory: ${{ env.CHART_DIRECTORY }}

        run: |

          sha256sum packages/*.tgz > packages/SHA256SUMS

###############################################################################
# Upload Helm Package
###############################################################################

      - name: Upload Helm Package

        uses: actions/upload-artifact@v7

        with:

          name: helm-package

          path: |

            ${{ env.CHART_DIRECTORY }}/packages/*.tgz

            ${{ env.CHART_DIRECTORY }}/packages/SHA256SUMS

###############################################################################
# GitHub Step Summary
###############################################################################

      - name: Publish Package Summary

        run: |

          cat <<EOF >> $GITHUB_STEP_SUMMARY

          # Helm Packaging

          ## Validation

          - kubeconform
          - kube-score

          ## Packaging

          - Helm Chart Packaged
          - SHA256 Generated
          - Package Uploaded

          EOF

###############################################################################
# Console Summary
###############################################################################

      - name: Helm Packaging Summary

        run: |

          echo "=============================================="

          echo "Institutional Quant Platform"

          echo "Helm Packaging"

          echo "=============================================="

          echo ""

          echo "✔ kubeconform"

          echo "✔ kube-score"

          echo "✔ Helm Package"

          echo "✔ SHA256"

          echo "✔ Artifact Upload"

          echo ""

          echo "=============================================="


###############################################################################
# Login to GitHub Container Registry (OCI)
###############################################################################

      - name: Login to GHCR OCI Registry

        if: github.ref == 'refs/heads/main'

        run: |

          echo "${{ secrets.GITHUB_TOKEN }}" | \

          helm registry login ghcr.io \

            --username "${{ github.actor }}" \

            --password-stdin

###############################################################################
# Push Helm Chart to OCI Registry
###############################################################################

      - name: Push Helm Chart

        if: github.ref == 'refs/heads/main'

        working-directory: ${{ env.CHART_DIRECTORY }}

        run: |

          CHART=$(find packages -name "*.tgz" | head -n 1)

          helm push \

            "$CHART" \

            oci://ghcr.io/${{ github.repository_owner }}/charts

###############################################################################
# Verify Published Chart
###############################################################################

      - name: Verify OCI Chart

        if: github.ref == 'refs/heads/main'

        run: |

          helm show chart \

            oci://ghcr.io/${{ github.repository_owner }}/charts/institutional-quant-platform

###############################################################################
# Upload Release Assets
###############################################################################

      - name: Upload Release Assets

        if: always()

        uses: actions/upload-artifact@v7

        with:

          name: helm-release-assets

          path: |

            ${{ env.CHART_DIRECTORY }}/packages

            ${{ env.CHART_DIRECTORY }}/rendered-default.yaml

            ${{ env.CHART_DIRECTORY }}/rendered-dev.yaml

            ${{ env.CHART_DIRECTORY }}/rendered-staging.yaml

            ${{ env.CHART_DIRECTORY }}/rendered-prod.yaml

          if-no-files-found: ignore

###############################################################################
# Cleanup
###############################################################################

      - name: Cleanup Temporary Files

        if: always()

        working-directory: ${{ env.CHART_DIRECTORY }}

        run: |

          rm -f rendered-default.yaml

          rm -f rendered-dev.yaml

          rm -f rendered-staging.yaml

          rm -f rendered-prod.yaml

###############################################################################
# Publish GitHub Summary
###############################################################################

      - name: Publish Workflow Summary

        if: always()

        run: |

          cat <<EOF >> $GITHUB_STEP_SUMMARY

          # Helm Workflow

          ## Validation

          - Helm lint
          - Helm dependency update
          - Helm dependency build
          - Helm template
          - YAML validation
          - kubeconform
          - kube-score

          ## Packaging

          - Helm package
          - SHA256 checksum

          ## Distribution

          - OCI registry publishing (main only)

          EOF

###############################################################################
# Final Summary Job
###############################################################################

  summary:

    name: Helm Pipeline Summary

    runs-on: ubuntu-latest

    if: always()

    needs:

      - helm

    steps:

      - name: Pipeline Summary

        run: |

          echo "==================================================="

          echo "Institutional Quant Platform"

          echo "Helm CI Pipeline"

          echo "==================================================="

          echo ""

          echo "Repository"

          echo "${{ github.repository }}"

          echo ""

          echo "Branch"

          echo "${{ github.ref_name }}"

          echo ""

          echo "Chart"

          echo "institutional-quant-platform"

          echo ""

          echo "Completed"

          echo "✔ Dependency Update"

          echo "✔ Helm Lint"

          echo "✔ Template Rendering"

          echo "✔ YAML Validation"

          echo "✔ kubeconform"

          echo "✔ kube-score"

          echo "✔ Helm Package"

          echo "✔ SHA256"

          echo "✔ OCI Publish"

          echo ""

          echo "Pipeline Status"

          echo "${{ needs.helm.result }}"

          echo ""

          echo "==================================================="