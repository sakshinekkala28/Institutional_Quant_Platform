name: Backtesting

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "backtesting/**"
      - "analytics/**"
      - "core/**"

  pull_request:
    branches:
      - main
      - develop
    paths:
      - "backtesting/**"
      - "analytics/**"
      - "core/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:

  backtesting:
    name: Backtesting Validation
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install -r requirements-dev.txt || true
          pip install -e .

      - name: Compile
        run: |
          python -m compileall -q backtesting

      - name: Lint
        run: |
          ruff check backtesting

      - name: Backtest tests
        run: |
          pytest -v tests \
            -k "backtest or benchmark or strategy"