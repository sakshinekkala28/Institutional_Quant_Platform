name: Continuous Integration

on:
  push:
    branches:
      - main
      - develop
      - staging
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"

  pull_request:
    branches:
      - main
      - develop
      - staging

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  python:
    name: Python Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f pyproject.toml ]; then
            pip install -e .
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install \
            black==25.1.0 \
            ruff==0.12.5 \
            mypy==1.17.1 \
            pytest==8.4.1 \
            pytest-cov==6.2.1

      - name: Black Format Check
        run: |
          black --check .

      - name: Ruff Lint
        run: |
          ruff check .

      - name: MyPy
        run: |
          mypy .

      - name: Run Unit Tests
        run: |
          pytest \
            tests \
            --maxfail=1 \
            --disable-warnings \
            --cov=. \
            --cov-report=xml \
            --cov-report=term \
            --junitxml=test-results.xml

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
  terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform Formatting
        working-directory: docs/infrastructure/terraform
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        working-directory: docs/infrastructure/terraform
        run: terraform init -backend=false

      - name: Verify Terraform Configuration
        working-directory: docs/infrastructure/terraform
        run: terraform validate

  helm:
    name: Validate Helm Chart
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm Chart
        run: helm lint docs/infrastructure/helm

      - name: Render Helm Templates
        run: |
          helm template institutional-quant \
            docs/infrastructure/helm \
            > rendered.yaml

      - name: Build Helm Package
        run: helm package docs/infrastructure/helm

      - name: Publish Helm Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: helm-package
          path: |
            rendered.yaml
            *.tgz

  kubernetes:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate Kubernetes Manifests
        run: |
          kubectl apply \
            --dry-run=client \
            --validate=false \
            -f docs/infrastructure/kubernetes

  dockerfiles:
    name: Validate Dockerfiles
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Lint API Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docs/infrastructure/docker/Dockerfile.api

      - name: Lint Analytics Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docs/infrastructure/docker/Dockerfile.analytics

      - name: Lint Dashboard Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docs/infrastructure/docker/Dockerfile.dashboard

  yaml:
    name: Validate YAML Files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Run YAML Linter
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint.yml

  summary:
    name: CI Summary
    if: always()
    runs-on: ubuntu-latest

    needs:
      - python
      - terraform
      - helm
      - kubernetes
      - dockerfiles
      - yaml

    steps:
      - name: Display Pipeline Results
        run: |
          echo "=============================================="
          echo "Institutional Quant Platform"
          echo "Continuous Integration Summary"
          echo "=============================================="
          echo ""
          echo "Python Validation      : ${{ needs.python.result }}"
          echo "Terraform Validation   : ${{ needs.terraform.result }}"
          echo "Helm Validation        : ${{ needs.helm.result }}"
          echo "Kubernetes Validation  : ${{ needs.kubernetes.result }}"
          echo "Dockerfile Validation  : ${{ needs.dockerfiles.result }}"
          echo "YAML Validation        : ${{ needs.yaml.result }}"
          echo ""
          echo "=============================================="
