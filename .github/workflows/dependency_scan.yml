name: Dependency Health Scan

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 2 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  dependency-health:
    name: Dependency Health
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Tools
        run: |
          python -m pip install --upgrade pip

          pip install \
            pip-audit \
            pipdeptree \
            safety \
            cyclonedx-bom

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Generate Dependency Tree
        run: |
          pipdeptree > dependency-tree.txt

      - name: Detect Outdated Packages
        run: |
          pip list --outdated > outdated-packages.txt

      - name: pip-audit
        run: |
          pip-audit \
            --format=json \
            --output=pip-audit.json

      - name: Safety Check
        run: |
          safety check \
            --json \
            > safety-report.json

      - name: Generate CycloneDX SBOM
        run: |
          cyclonedx-py environment \
            --output-file sbom.json

      - name: Upload Dependency Reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-health-report
          path: |
            dependency-tree.txt
            outdated-packages.txt
            pip-audit.json
            safety-report.json
            sbom.json

  summary:
    name: Dependency Summary
    runs-on: ubuntu-latest
    needs: dependency-health

    steps:
      - name: Summary
        run: |
          echo "======================================"
          echo "Institutional Quant Platform"
          echo "Dependency Scan Complete"
          echo "======================================"
          echo ""
          echo "✓ Dependency Tree"
          echo "✓ Outdated Packages"
          echo "✓ Vulnerability Audit"
          echo "✓ Safety Scan"
          echo "✓ CycloneDX SBOM"