apiVersion: v1
kind: Pod

metadata:

  name: "quant-institutional-quant-platform-connection-test"

  namespace: institutional-quant

  labels:
    helm.sh/chart: institutional-quant-platform-1.0.0
    
    app.kubernetes.io/name: institutional-quant-platform
    
    app.kubernetes.io/instance: quant
    
    app.kubernetes.io/version: "1.0.0"
    
    app.kubernetes.io/managed-by: Helm

  annotations:

    "helm.sh/hook": test

    "helm.sh/hook-weight": "0"

    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded

spec:

  restartPolicy: Never

  containers:

    - name: connectivity-test

      image: curlimages/curl:8.21.0

      imagePullPolicy: IfNotPresent

      command:

        - /bin/sh

        - -c

        - |

          set -e

          echo "=========================================="
          echo "Institutional Quant Platform Helm Test"
          echo "=========================================="

          echo ""
          echo "Testing API..."

          curl --fail --silent \
            http://quant-institutional-quant-platform-api:80/health

          echo ""
          echo "API OK"

          echo ""
          echo "Testing Dashboard..."

          curl --fail --silent \
            http://quant-institutional-quant-platform-dashboard:80/

          echo ""
          echo "Dashboard OK"

          echo ""
          echo "DNS Resolution..."

          nslookup quant-institutional-quant-platform-api

          nslookup quant-institutional-quant-platform-dashboard

          echo ""
          echo "DNS OK"

          echo ""
          echo "All Helm Tests Passed Successfully"

      securityContext:

        allowPrivilegeEscalation: false

        readOnlyRootFilesystem: true

        runAsNonRoot: true

        runAsUser: 1000

        capabilities:

          drop:

            - ALL
