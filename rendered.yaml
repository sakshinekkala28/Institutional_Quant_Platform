        env:

          - name: API_BASE_URL

            value: "http://quant-institutional-quant-platform-api"

        resources:
          limits:
            cpu: 2
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 512Mi

        securityContext:

          allowPrivilegeEscalation: false

          readOnlyRootFilesystem: false

          capabilities:

            drop:
              - ALL

        readinessProbe:

          httpGet:

            path: /

            port: http

          initialDelaySeconds: 15

          periodSeconds: 15

          timeoutSeconds: 5

          failureThreshold: 3

        livenessProbe:

          httpGet:

            path: /

            port: http

          initialDelaySeconds: 30

          periodSeconds: 30

          timeoutSeconds: 5

          failureThreshold: 3

        startupProbe:

          httpGet:

            path: /

            port: http

          periodSeconds: 5

          failureThreshold: 30

        volumeMounts:

          - name: streamlit-config

            mountPath: /home/dashboard/.streamlit

            readOnly: true

          - name: cache

            mountPath: /app/cache

          - name: logs

            mountPath: /app/logs

      volumes:

        - name: streamlit-config

          configMap:

            name: quant-institutional-quant-platform-streamlit

        - name: cache

          persistentVolumeClaim:

            claimName: quant-institutional-quant-platform-cache

        - name: logs

          persistentVolumeClaim:

            claimName: quant-institutional-quant-platform-logs

      affinity:
        {}

      nodeSelector:
        {}

      tolerations:
        []
