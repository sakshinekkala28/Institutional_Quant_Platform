metadata:

  name: quant-institutional-quant-platform-analytics

  namespace: institutional-quant

  labels:
    helm.sh/chart: institutional-quant-platform-1.0.0
    
    app.kubernetes.io/name: institutional-quant-platform
    
    app.kubernetes.io/instance: quant
    
    app.kubernetes.io/version: "1.0.0"
    
    app.kubernetes.io/managed-by: Helm

spec:

  replicas: 2

  revisionHistoryLimit: 10

  strategy:

    type: RollingUpdate

    rollingUpdate:

      maxSurge: 25%

      maxUnavailable: 0

  selector:

    matchLabels:
      app.kubernetes.io/name: institutional-quant-platform
      
      app.kubernetes.io/instance: quant
      component: analytics

  template:

    metadata:

      labels:
        app.kubernetes.io/name: institutional-quant-platform
        
        app.kubernetes.io/instance: quant
        component: analytics

    spec:

      serviceAccountName: quant-institutional-quant-platform-analytics

      terminationGracePeriodSeconds: 60

      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

      containers:

      - name: analytics

        image: ghcr.io/sakshinekkala28/institutional_quant_platform_analytics:latest

        imagePullPolicy: IfNotPresent

        command:

          - python

          - -m

          - orchestration.run_pipeline

        envFrom:

          - configMapRef:

              name: quant-institutional-quant-platform-config

          - secretRef:

              name: quant-institutional-quant-platform-secret

        resources:
          limits:
            cpu: 8
            memory: 16Gi
          requests:
            cpu: 2
            memory: 4Gi

        securityContext:

          allowPrivilegeEscalation: false

          readOnlyRootFilesystem: false

          capabilities:

            drop:

              - ALL

        livenessProbe:

          exec:

            command:

              - python

              - -c

              - "print('healthy')"

          initialDelaySeconds: 30

          periodSeconds: 30

          timeoutSeconds: 5

          failureThreshold: 3

        readinessProbe:

          exec:

            command:

              - python

              - -c

              - "print('ready')"

          initialDelaySeconds: 20

          periodSeconds: 20

          timeoutSeconds: 5

          failureThreshold: 3

        startupProbe:

          exec:

            command:

              - python

              - -c

              - "print('startup')"

          periodSeconds: 5

          failureThreshold: 30

        volumeMounts:

          - name: data

            mountPath: /app/data

          - name: cache

            mountPath: /app/cache

          - name: reports

            mountPath: /app/reports

          - name: models

            mountPath: /app/models

          - name: logs

            mountPath: /app/logs

      volumes:

        - name: data

          persistentVolumeClaim:

            claimName: quant-institutional-quant-platform-data

        - name: cache

          persistentVolumeClaim:

            claimName: quant-institutional-quant-platform-cache

        - name: reports

          persistentVolumeClaim:

            claimName: quant-institutional-quant-platform-reports

        - name: models

          persistentVolumeClaim:

            claimName: quant-institutional-quant-platform-models

        - name: logs

          persistentVolumeClaim:

            claimName: quant-institutional-quant-platform-logs

      affinity:
        {}

      nodeSelector:
        {}

      tolerations:
        []
---
