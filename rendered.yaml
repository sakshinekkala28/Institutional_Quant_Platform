apiVersion: apps/v1
kind: Deployment

metadata:
  name: quant-institutional-quant-platform-api
  namespace: institutional-quant

  labels:
    helm.sh/chart: institutional-quant-platform-1.0.0
    
    app.kubernetes.io/name: institutional-quant-platform
    
    app.kubernetes.io/instance: quant
    
    app.kubernetes.io/version: "1.0.0"
    
    app.kubernetes.io/managed-by: Helm

spec:
  replicas: 3

  revisionHistoryLimit: 10

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0

  selector:
    matchLabels:
      app.kubernetes.io/name: institutional-quant-platform
      
      app.kubernetes.io/instance: quant
      component: api

  template:

    metadata:

      labels:
        app.kubernetes.io/name: institutional-quant-platform
        
        app.kubernetes.io/instance: quant
        component: api

    spec:

      serviceAccountName: quant-institutional-quant-platform-api

      terminationGracePeriodSeconds: 30

      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

      containers:

        - name: api

          image: ghcr.io/sakshinekkala28/institutional_quant_platform:latest

          imagePullPolicy: IfNotPresent

          ports:

            - name: http
              containerPort: 8000
              protocol: TCP

          envFrom:

            - configMapRef:
                name: quant-institutional-quant-platform-config

            - secretRef:
                name: quant-institutional-quant-platform-secret

          resources:
            limits:
              cpu: 2000m
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 512Mi

          securityContext:

            allowPrivilegeEscalation: false

            readOnlyRootFilesystem: false

            capabilities:
              drop:
                - ALL

          readinessProbe:

            httpGet:
              path: /health
              port: http

            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:

            httpGet:
              path: /health
              port: http

            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          startupProbe:

            httpGet:
              path: /health
              port: http

            periodSeconds: 5
            failureThreshold: 30

          volumeMounts:

            - name: data
              mountPath: /app/data

            - name: cache
              mountPath: /app/cache

            - name: logs
              mountPath: /app/logs

      volumes:

        - name: data

          persistentVolumeClaim:
            claimName: quant-institutional-quant-platform-data

        - name: cache

          persistentVolumeClaim:
            claimName: quant-institutional-quant-platform-cache

        - name: logs

          persistentVolumeClaim:
            claimName: quant-institutional-quant-platform-logs

      affinity:
        {}

      nodeSelector:
        {}

      tolerations:
        []
