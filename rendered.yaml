# ==============================================================================
# Institutional Quant Platform
# Ingress
# ==============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:

  name: quant-institutional-quant-platform

  namespace: institutional-quant

  labels:
    helm.sh/chart: institutional-quant-platform-1.0.0
    
    app.kubernetes.io/name: institutional-quant-platform
    
    app.kubernetes.io/instance: quant
    
    app.kubernetes.io/version: "1.0.0"
    
    app.kubernetes.io/managed-by: Helm

  annotations:

    kubernetes.io/ingress.class: nginx

    cert-manager.io/cluster-issuer: letsencrypt-prod

    nginx.ingress.kubernetes.io/ssl-redirect: "true"

    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    nginx.ingress.kubernetes.io/backend-protocol: HTTP

    nginx.ingress.kubernetes.io/proxy-body-size: "100m"

    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"

    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"

    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"

    nginx.ingress.kubernetes.io/use-gzip: "true"

    nginx.ingress.kubernetes.io/enable-cors: "true"

    nginx.ingress.kubernetes.io/cors-allow-origin: "*"

    nginx.ingress.kubernetes.io/cors-allow-methods: "GET,POST,PUT,DELETE,OPTIONS"

    nginx.ingress.kubernetes.io/cors-allow-headers: "*"

    nginx.ingress.kubernetes.io/limit-rps: "20"

    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"

spec:

  ingressClassName: nginx

  tls:

    - hosts:

        - quant.example.com

      secretName: institutional-quant-tls

  rules:

    - host: quant.example.com

      http:

        paths:

###############################################################################
# Dashboard
###############################################################################

        - path: /

          pathType: Prefix

          backend:

            service:

              name: quant-institutional-quant-platform-dashboard

              port:

                number: 80

###############################################################################
# API
###############################################################################

        - path: /api

          pathType: Prefix

          backend:

            service:

              name: quant-institutional-quant-platform-api

              port:

                number: 80
---
