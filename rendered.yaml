apiVersion: v1
kind: ConfigMap

metadata:

  name: quant-institutional-quant-platform-config

  namespace: institutional-quant

  labels:
    helm.sh/chart: institutional-quant-platform-1.0.0
    
    app.kubernetes.io/name: institutional-quant-platform
    
    app.kubernetes.io/instance: quant
    
    app.kubernetes.io/version: "1.0.0"
    
    app.kubernetes.io/managed-by: Helm

data:

  ###########################################################################
  # Platform
  ###########################################################################

  PLATFORM_NAME: "Institutional Quant Platform"

  PLATFORM_ENV: "production"

  PLATFORM_VERSION: "1.0.0"

  ###########################################################################
  # API
  ###########################################################################

  API_HOST: "0.0.0.0"

  API_PORT: "8000"

  ###########################################################################
  # Dashboard
  ###########################################################################

  DASHBOARD_HOST: "0.0.0.0"

  DASHBOARD_PORT: "8501"

  ###########################################################################
  # Analytics
  ###########################################################################

  ANALYTICS_WORKERS: "2"

  ###########################################################################
  # Logging
  ###########################################################################

  LOG_LEVEL: "INFO"

  ###########################################################################
  # Feature Flags
  ###########################################################################

  ENABLE_BACKTEST: "true"

  ENABLE_LIVE_TRADING: "false"

  ENABLE_PORTFOLIO_OPTIMIZATION: "true"

  ENABLE_RISK_ENGINE: "true"

  ENABLE_MONITORING: "true"

  ###########################################################################
  # Storage
  ###########################################################################

  DATA_DIRECTORY: "/app/data"

  CACHE_DIRECTORY: "/app/cache"

  LOG_DIRECTORY: "/app/logs"

  REPORT_DIRECTORY: "/app/reports"

  MODEL_DIRECTORY: "/app/models"

  ###########################################################################
  # Scheduler
  ###########################################################################

  PIPELINE_INTERVAL: "daily"

  ###########################################################################
  # Monitoring
  ###########################################################################

  METRICS_ENABLED: "true"

  PROMETHEUS_ENABLED: "true"

  ###########################################################################
  # Timezone
  ###########################################################################

  TZ: "Asia/Kolkata"
