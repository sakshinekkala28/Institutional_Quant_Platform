###############################################################################
# Institutional Quant Platform
# Ruff Configuration
###############################################################################

###############################################################################
# Global
###############################################################################

target-version = "py312"

line-length = 88

indent-width = 4

###############################################################################
# Files
###############################################################################

exclude = [
    ".git",
    ".github",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    ".tox",
    ".nox",
    "build",
    "dist",
    "site",
    "htmlcov",
    "coverage",
    "node_modules",
    ".terraform",
    ".devcontainer",
    "artifacts",
    "generated",
    "tmp",
    "temp"
]

extend-include = [
    "*.py",
    "*.pyi"
]

###############################################################################
# Lint
###############################################################################

[lint]

select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "SIM",
    "RET",
    "PIE",
    "PL",
    "RUF"
]

ignore = [
    "E203",
    "E501",
    "PLR0913",
    "PLR2004",
    "PLR0912",
    "PLR0915"
]

fixable = ["ALL"]

unfixable = []

###############################################################################
# Imports
###############################################################################

[lint.isort]

combine-as-imports = true

force-sort-within-sections = true

known-first-party = [
    "analytics",
    "alpha",
    "api",
    "dashboard",
    "data",
    "deployment",
    "execution",
    "infrastructure",
    "monitoring",
    "portfolio",
    "reporting",
    "research",
    "risk",
    "telemetry",
    "tests",
    "utils"
]

###############################################################################
# McCabe Complexity
###############################################################################

[lint.mccabe]

max-complexity = 12

###############################################################################
# Pydocstyle
###############################################################################

[lint.pydocstyle]

convention = "google"

###############################################################################
# Per File Ignores
###############################################################################

[lint.per-file-ignores]

"tests/**/*.py" = [
    "S101",
    "PLR2004"
]

"docs/**/*.py" = [
    "D"
]

"scripts/**/*.py" = [
    "T201"
]

###############################################################################
# Formatting
###############################################################################

[format]

quote-style = "double"

indent-style = "space"

line-ending = "lf"

skip-magic-trailing-comma = false

docstring-code-format = true

docstring-code-line-length = 88