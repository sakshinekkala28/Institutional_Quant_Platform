###############################################################################
# Institutional Quant Platform
# Ruff Configuration
###############################################################################

###############################################################################
# Global
###############################################################################

target-version = "py312"

line-length = 88

indent-width = 4

fix = true

unsafe-fixes = false

preview = true

respect-gitignore = true

###############################################################################
# Files
###############################################################################

exclude = [
    ".git",
    ".github",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    ".tox",
    ".nox",
    "build",
    "dist",
    "site",
    "htmlcov",
    "coverage",
    "node_modules",
    ".terraform",
    ".devcontainer",
    "artifacts",
    "generated",
    "tmp",
    "temp",
]

extend-exclude = [
    ".idea",
    ".vscode",
    "*.egg-info",
]

extend-include = [
    "*.py",
    "*.pyi",
]

###############################################################################
# Lint
###############################################################################

[lint]

select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "SIM",
    "RET",
    "PIE",
    "PL",
    "RUF",
]

ignore = [
    "E203",
    "E501",
    "PLR0913",
    "PLR2004",
    "PLR0912",
    "PLR0915",
]


###############################################################################
# Imports
###############################################################################

[lint.isort]

combine-as-imports = true

force-sort-within-sections = true

force-wrap-aliases = true

known-first-party = [

    "analytics",
    "alpha",
    "api",
    "backtesting",
    "config",
    "core",
    "dashboard",
    "data",
    "deployment",
    "execution",
    "fundamentals",
    "governance",
    "ingestion",
    "infrastructure",
    "market_data",
    "metrics",
    "ml",
    "mlflow_track",
    "monitoring",
    "optimization",
    "orchestration",
    "performance",
    "portfolio",
    "reporting",
    "research",
    "risk",
    "scanner",
    "services",
    "signals",
    "telemetry",
    "tests",
    "utils",

]

###############################################################################
# McCabe Complexity
###############################################################################

[lint.mccabe]

max-complexity = 12

###############################################################################
# Pydocstyle
###############################################################################

[lint.pydocstyle]

convention = "google"

###############################################################################
# Per File Ignores
###############################################################################

[lint.per-file-ignores]

"tests/**/*.py" = [
    "S101",
    "PLR2004",
]

"docs/**/*.py" = [
    "D",
]

"scripts/**/*.py" = [
    "T201",
]

"api/dependencies/*.py" = [
    "B008",
]

"docs/development/examples/*.py" = [
    "B008",
]

###############################################################################
# Formatting
###############################################################################

[format]

quote-style = "double"

indent-style = "space"

line-ending = "lf"

skip-magic-trailing-comma = false

docstring-code-format = true

docstring-code-line-length = 88