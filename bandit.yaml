  - B101

###############################################################################
# Assertions
###############################################################################

assert_used:

  skips:

    - "tests/*"

###############################################################################
# Temporary Files
###############################################################################

tmp_dirs:

  - /tmp

  - /var/tmp

###############################################################################
# Shell Injection
###############################################################################

shell_injection:

  subprocess:

    - subprocess.Popen

    - subprocess.call

    - subprocess.check_call

    - subprocess.check_output

    - subprocess.run

  shell:

    - os.system

    - os.popen

    - commands.getoutput

    - commands.getstatusoutput

  no_shell:

    - os.execv

    - os.execve

    - os.spawnv

    - os.spawnve

###############################################################################
# Plugins
###############################################################################

plugins: []

###############################################################################
# Logging
###############################################################################

verbose: true

###############################################################################
# Output
###############################################################################

output_format: screen

###############################################################################
# Baseline
###############################################################################

baseline:

###############################################################################
# Profiles
###############################################################################

profile: default
