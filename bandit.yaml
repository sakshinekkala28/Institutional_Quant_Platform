###############################################################################
# General
###############################################################################

exclude_dirs:

  - .git

  - .github

  - .venv

  - venv

  - build

  - dist

  - htmlcov

  - coverage

  - docs

  - tests

  - site

  - generated

  - artifacts

  - node_modules

###############################################################################
