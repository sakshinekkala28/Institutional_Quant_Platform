###############################################################################
# Institutional Quant Platform
# MkDocs Configuration
###############################################################################

site_name: Institutional Quant Platform

site_description: >
  Enterprise-grade quantitative investment platform with institutional
  portfolio construction, risk management, execution, analytics,
  infrastructure automation, and monitoring.

site_author: Pavan Sai Nekkala

site_url: https://sakshinekkala28.github.io/Institutional_Quant_Platform/

repo_name: Institutional_Quant_Platform

repo_url: https://github.com/sakshinekkala28/Institutional_Quant_Platform

edit_uri: edit/main/docs/

copyright: |
  © 2026 Pavan Sai Nekkala

###############################################################################
# Theme
###############################################################################

theme:

  name: material

  language: en

  logo: assets/logo.png

  favicon: assets/favicon.ico

  palette:

    - scheme: default

      primary: indigo

      accent: blue

      toggle:

        icon: material/weather-night

        name: Dark Mode

    - scheme: slate

      primary: indigo

      accent: blue

      toggle:

        icon: material/weather-sunny

        name: Light Mode

  features:

    - navigation.instant

    - navigation.instant.progress

    - navigation.tabs

    - navigation.sections

    - navigation.expand

    - navigation.top

    - navigation.footer

    - search.highlight

    - search.share

    - search.suggest

    - content.code.copy

    - content.tabs.link

    - content.action.edit

    - content.action.view

###############################################################################
# Plugins
###############################################################################

plugins:

  - search

  - awesome-pages

  - git-revision-date-localized

  - mermaid2

###############################################################################
# Markdown Extensions
###############################################################################

markdown_extensions:

  - admonition

  - attr_list

  - def_list

  - footnotes

  - tables

  - toc:

      permalink: true

  - pymdownx.superfences

  - pymdownx.highlight

  - pymdownx.inlinehilite

  - pymdownx.tabbed:

      alternate_style: true

  - pymdownx.details

  - pymdownx.emoji

  - pymdownx.keys

  - pymdownx.snippets

  - pymdownx.tasklist:

      custom_checkbox: true

###############################################################################
# Extra
###############################################################################

extra:

  generator: false

  social:

    - icon: fontawesome/brands/github

      link: https://github.com/sakshinekkala28

###############################################################################
# Navigation
###############################################################################

nav:

  - Home: index.md

  - Getting Started:

      - Installation: getting-started/installation.md

      - Quick Start: getting-started/quick-start.md

      - Development: getting-started/development.md

  - Architecture:

      - Overview: architecture/overview.md

      - Repository Structure: architecture/repository.md

      - System Design: architecture/system-design.md

      - Data Flow: architecture/data-flow.md

      - Deployment: architecture/deployment.md

  - Analytics:

      - Alpha Engine: analytics/alpha.md

      - Portfolio Engine: analytics/portfolio.md

      - Risk Engine: analytics/risk.md

      - Execution Engine: analytics/execution.md

  - API:

      - REST API: api/rest.md

      - Authentication: api/authentication.md

  - Infrastructure:

      - Docker: infrastructure/docker.md

      - Kubernetes: infrastructure/kubernetes.md

      - Helm: infrastructure/helm.md

      - Terraform: infrastructure/terraform.md

  - Operations:

      - Monitoring: operations/monitoring.md

      - Logging: operations/logging.md

      - Alerting: operations/alerting.md

      - Runbooks: operations/runbooks.md

  - Security:

      - Overview: security/index.md

      - Secure Development: security/development.md

      - Dependency Management: security/dependencies.md

  - Contributing:

      - Contributing: contributing.md

      - Code of Conduct: code-of-conduct.md

      - Governance: governance.md

  - Changelog: changelog.md

###############################################################################
# Extra CSS
###############################################################################

extra_css:

  - stylesheets/extra.css

###############################################################################
# Extra JavaScript
###############################################################################

extra_javascript:

  - javascripts/extra.js

###############################################################################
# Watch
###############################################################################

watch:

  - docs

###############################################################################
# Validation
###############################################################################

validation:

  omitted_files: warn

  absolute_links: warn

  unrecognized_links: warn