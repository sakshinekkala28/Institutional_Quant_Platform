###############################################################################
# Institutional Quant Platform
# Pytest Configuration
###############################################################################

[pytest]

###############################################################################
# Minimum Version
###############################################################################

minversion = 8.0

###############################################################################
# Test Discovery
###############################################################################

testpaths =
    tests

python_files =
    test_*.py
    *_test.py

python_classes =
    Test*

python_functions =
    test_*

###############################################################################
# Console Output
###############################################################################

addopts =
    --strict-config
    --strict-markers
    --tb=short
    --durations=20
    --color=yes
    --cov=analytics
    --cov=alpha
    --cov=api
    --cov=dashboard
    --cov=data
    --cov=deployment
    --cov=execution
    --cov=infrastructure
    --cov=monitoring
    --cov=portfolio
    --cov=reporting
    --cov=research
    --cov=risk
    --cov=telemetry
    --cov=utils
    --cov-report=term-missing
    --cov-report=xml
    --cov-report=html
    --cov-branch

###############################################################################
# Markers
###############################################################################

markers =
    unit: Unit tests
    integration: Integration tests
    performance: Performance tests
    regression: Regression tests
    smoke: Smoke tests
    api: API tests
    database: Database tests
    docker: Docker tests
    kubernetes: Kubernetes tests
    terraform: Terraform tests
    security: Security tests
    slow: Slow tests
    benchmark: Benchmark tests
    e2e: End-to-end tests
    streamlit: Streamlit tests
    analytics: Analytics tests
    portfolio: Portfolio Engine tests
    risk: Risk Engine tests
    execution: Execution Engine tests

###############################################################################
# Logging
###############################################################################

log_cli = true

log_cli_level = INFO

log_cli_format =

    %(asctime)s | %(levelname)-8s | %(name)s | %(message)s

log_cli_date_format =

    %Y-%m-%d %H:%M:%S

###############################################################################
# Warnings
###############################################################################

filterwarnings =

    ignore::DeprecationWarning

    ignore::PendingDeprecationWarning

###############################################################################
# Cache
###############################################################################

cache_dir = .pytest_cache

###############################################################################
# JUnit
###############################################################################

junit_family = xunit2

###############################################################################
# Asyncio
###############################################################################

asyncio_mode = auto

###############################################################################
# Timeouts
###############################################################################

timeout = 300

###############################################################################
# Console Style
###############################################################################

console_output_style = progress

###############################################################################
# Doctests
###############################################################################

doctest_optionflags =
    NORMALIZE_WHITESPACE
    ELLIPSIS

###############################################################################
# Norecursedirs
###############################################################################

norecursedirs =
    .git
    .github
    .venv
    venv
    build
    dist
    htmlcov
    coverage
    node_modules
    docs
    site
    generated
    artifacts

###############################################################################
# End
###############################################################################