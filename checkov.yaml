###############################################################################
# Institutional Quant Platform
# Checkov Configuration
###############################################################################

###############################################################################
# Frameworks
###############################################################################

framework:

  - terraform

  - kubernetes

  - dockerfile

  - github_actions

  - helm

###############################################################################
# Directories to Skip
###############################################################################

skip-path:

  - .git/

  - .github/ISSUE_TEMPLATE/

  - docs/

  - site/

  - htmlcov/

  - build/

  - dist/

  - .venv/

  - venv/

  - node_modules/

  - tests/

###############################################################################
# Output
###############################################################################

output:

  - cli

  - sarif

###############################################################################
# Quiet Mode
###############################################################################

quiet: false

###############################################################################
# Compact Output
###############################################################################

compact: true

###############################################################################
# Soft Fail
###############################################################################

soft-fail: false

###############################################################################
# Download External Modules
###############################################################################

download-external-modules: true

###############################################################################
# Evaluate Variables
###############################################################################

evaluate-variables: true

###############################################################################
# External Modules Cache
###############################################################################

external-modules-download-path: .checkov/modules

###############################################################################
# Secrets
###############################################################################

enable-secret-scan-all-files: true

###############################################################################
# Baseline
###############################################################################

baseline:

###############################################################################
# Skip Checks
###############################################################################

skip-check:

###############################################################################
# Terraform

  - CKV_TF_1

###############################################################################
# Docker

  - CKV_DOCKER_2

###############################################################################
# Kubernetes

###############################################################################
# GitHub Actions

###############################################################################
# Helm

###############################################################################
# Severity
###############################################################################

check:

###############################################################################
# Logging
###############################################################################

log-level: INFO

###############################################################################
# Repository Metadata
###############################################################################

repo-id: Institutional_Quant_Platform
