###############################################################################
# Institutional Quant Platform
# MyPy Configuration
###############################################################################

[mypy]

###############################################################################
# Python
###############################################################################

python_version = 3.12

###############################################################################
# Output
###############################################################################

pretty = True
color_output = True

show_error_codes = True
show_column_numbers = True
show_error_context = True
error_summary = True

###############################################################################
# Discovery
###############################################################################

namespace_packages = True
explicit_package_bases = True

###############################################################################
# Imports
###############################################################################

follow_imports = normal
ignore_missing_imports = True

###############################################################################
# Global Type Checking
###############################################################################

strict = False

###############################################################################
# Warnings
###############################################################################

warn_return_any = True
warn_unused_configs = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_no_return = True
warn_unreachable = True

###############################################################################
# Optional
###############################################################################

strict_optional = True
no_implicit_optional = True

###############################################################################
# Untyped
###############################################################################

disallow_untyped_defs = True
disallow_incomplete_defs = True

check_untyped_defs = True

disallow_untyped_calls = False
disallow_untyped_decorators = False

###############################################################################
# Any
###############################################################################

disallow_any_generics = True
disallow_subclassing_any = True

###############################################################################
# Equality
###############################################################################

strict_equality = True

###############################################################################
# Misc
###############################################################################

implicit_reexport = False
local_partial_types = True

###############################################################################
# Cache
###############################################################################

cache_dir = .mypy_cache
sqlite_cache = True
incremental = True

###############################################################################
# Performance
###############################################################################

fast_module_lookup = True

###############################################################################
# Exclude
###############################################################################

exclude = (?x)(
    ^build/
  | ^dist/
  | ^site/
  | ^htmlcov/
  | ^coverage/
  | ^artifacts/
  | ^generated/
  | ^docs/
  | ^\.venv/
  | ^venv/
  | ^\.tox/
  | ^\.pytest_cache/
  | ^\.ruff_cache/
  | ^\.mypy_cache/
  | ^node_modules/
)

###############################################################################
# Institutional Core Packages
###############################################################################

[mypy-orchestration.*]
strict = True

[mypy-services.*]
strict = True

[mypy-monitoring.*]
strict = True

[mypy-performance.*]
strict = True

[mypy-risk.*]
strict = True

[mypy-optimization.*]
strict = True

[mypy-core.*]
strict = True

[mypy-config.*]
strict = True

###############################################################################
# Analytics Packages
###############################################################################

[mypy-analytics.*]
strict = False

[mypy-market_data.*]
strict = False

[mypy-reporting.*]
strict = False

[mypy-dashboard.*]
strict = False

[mypy-streamlit.*]
strict = False

###############################################################################
# Tests
###############################################################################

[mypy-tests.*]

disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True

###############################################################################
# Third-party Libraries
###############################################################################

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-plotly.*]
ignore_missing_imports = True

[mypy-duckdb.*]
ignore_missing_imports = True

[mypy-pyarrow.*]
ignore_missing_imports = True

[mypy-yfinance.*]
ignore_missing_imports = True

[mypy-ta.*]
ignore_missing_imports = True

[mypy-cvxpy.*]
ignore_missing_imports = True

[mypy-opentelemetry.*]
ignore_missing_imports = True

[mypy-requests.*]
ignore_missing_imports = True

[mypy-lxml.*]
ignore_missing_imports = True

[mypy-bs4.*]
ignore_missing_imports = True

[mypy-reportlab.*]
ignore_missing_imports = True

[mypy-pptx.*]
ignore_missing_imports = True

[mypy-PIL.*]
ignore_missing_imports = True

[mypy-openpyxl.*]
ignore_missing_imports = True

[mypy-xlsxwriter.*]
ignore_missing_imports = True

[mypy-fastapi.*]
ignore_missing_imports = True

[mypy-pydantic.*]
ignore_missing_imports = True

[mypy-sqlalchemy.*]
