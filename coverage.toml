###############################################################################
# Institutional Quant Platform
# Coverage Configuration
###############################################################################

###############################################################################
# Run
###############################################################################

[run]

branch = True

parallel = True

source =

    analytics

    alpha

    api

    dashboard

    data

    deployment

    execution

    infrastructure

    monitoring

    portfolio

    reporting

    research

    risk

    telemetry

    utils

omit =

    */tests/*

    */test_*.py

    */__init__.py

    */__main__.py

    */migrations/*

    */generated/*

    */artifacts/*

    */docs/*

    */site/*

    */.venv/*

    */venv/*

    */build/*

    */dist/*

###############################################################################
# Paths
###############################################################################

[paths]

source =

    .

    */site-packages

###############################################################################
# Report
###############################################################################

[report]

precision = 2

show_missing = True

skip_covered = False

skip_empty = True

sort = Cover

fail_under = 85

exclude_lines =

    pragma: no cover

    if TYPE_CHECKING:

    if __name__ == "__main__":

    raise NotImplementedError

    @abstractmethod

    pass

###############################################################################
# HTML
###############################################################################

[html]

directory = htmlcov

title = Institutional Quant Platform Coverage Report

###############################################################################
# XML
###############################################################################

[xml]

output = coverage.xml

###############################################################################
# JSON
###############################################################################

[json]

output = coverage.json

pretty_print = True

###############################################################################
# LCOV
###############################################################################

[lcov]

output = coverage.lcov

###############################################################################
# HTML Context
###############################################################################

[html:paths]

extra_css =

###############################################################################
# End
###############################################################################