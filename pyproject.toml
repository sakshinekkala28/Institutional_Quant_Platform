[build-system]
requires = [
    "setuptools>=75.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

###############################################################################
# Project
###############################################################################

[project]
name = "institutional-quant-platform"
version = "1.0.0"
description = "Institutional Grade Quantitative Investment Platform"
readme = "README.md"
requires-python = ">=3.12"

license = { file = "LICENSE" }

authors = [
    { name = "Institutional Quant Platform" }
]

keywords = [
    "quant",
    "portfolio",
    "backtesting",
    "optimization",
    "risk",
    "finance",
    "institutional",
    "analytics",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]

###############################################################################
# Runtime Dependencies
###############################################################################

dependencies = [

    # Numerical
    "numpy>=2.2",
    "scipy>=1.15",
    "pandas>=2.3",

    # Storage
    "pyarrow>=20",
    "duckdb>=1.3",

    # Market Data
    "yfinance>=0.2",
    "requests>=2.32",

    # Optimization
    "cvxpy>=1.7",

    # Statistics
    "statsmodels>=0.14",
    "scikit-learn>=1.7",

    # Visualization
    "plotly>=6.2",
    "matplotlib>=3.10",

    # Dashboard
    "streamlit>=1.47",

    # Database
    "SQLAlchemy>=2.0",

    # Validation
    "pydantic>=2.11",

    # Configuration
    "python-dotenv>=1.1",

    # API
    "fastapi>=0.116",
    "uvicorn>=0.35",

    # Scheduling
    "apscheduler>=3.11",

    # Logging
    "rich>=14",

    # Telemetry
    "opentelemetry-api>=1.36",
    "opentelemetry-sdk>=1.36",

]

###############################################################################
# Optional Dependencies
###############################################################################

[project.optional-dependencies]

dev = [

    "black>=25",
    "ruff>=0.12",
    "mypy>=1.17",

    "pytest>=8.4",
    "pytest-cov>=6",
    "pytest-xdist>=3",
    "pytest-asyncio>=1.1",
    "pytest-timeout>=2.4",

    "coverage[toml]>=7.10",

    "bandit>=1.8",
    "pre-commit>=4.3",

    "types-requests",
    "pandas-stubs",

]

docs = [
    "mkdocs",
    "mkdocs-material",
]

###############################################################################
# setuptools
###############################################################################

[tool.setuptools]

include-package-data = true

[tool.setuptools.packages.find]

where = ["."]
include = ["*"]
exclude = [
    "tests*",
    "docs*",
    "examples*",
    "notebooks*",
]

###############################################################################
# Black
###############################################################################

[tool.black]

line-length = 88

target-version = [
    "py312",
]

skip-string-normalization = false

###############################################################################
# Ruff
###############################################################################

[tool.ruff]

line-length = 88

target-version = "py312"

exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]

select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "PL",
    "RUF",
]

ignore = [
    "PLR0913",
    "PLR0917",
]

[tool.ruff.format]

quote-style = "double"

indent-style = "space"

###############################################################################
# pytest
###############################################################################

[tool.pytest.ini_options]

testpaths = [
    "tests",
]

python_files = [
    "test_*.py",
]

addopts = [
    "--strict-markers",
    "--cov=.",
    "--cov-report=term-missing",
]

###############################################################################
# Coverage
###############################################################################

[tool.coverage.run]

branch = true

source = [
    ".",
]

omit = [
    "tests/*",
    ".venv/*",
]

[tool.coverage.report]

show_missing = true

skip_covered = false

precision = 2

###############################################################################
# MyPy
###############################################################################

[tool.mypy]

python_version = "3.12"

strict = true

warn_unused_configs = true

warn_return_any = true

warn_unused_ignores = true

check_untyped_defs = true

disallow_untyped_defs = true

no_implicit_optional = true

exclude = [
    "^tests/",
]

###############################################################################
# Bandit
###############################################################################

[tool.bandit]

exclude_dirs = [
    "tests",
    ".venv",
]

skips = [
    "B101",
]

###############################################################################
# Wheel
###############################################################################

[tool.setuptools.package-data]

"*" = [
    "*.json",
    "*.yaml",
    "*.yml",
    "*.csv",
    "*.parquet",
]