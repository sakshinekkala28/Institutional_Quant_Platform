###############################################################################
# Institutional Quant Platform
# pyproject.toml
###############################################################################

[build-system]
requires = [
    "setuptools>=80.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

###############################################################################
# Project
###############################################################################

[project]
name = "institutional-quant-platform"

version = "1.0.0"

description = "Enterprise-grade quantitative investment platform for portfolio construction, risk management, execution, analytics, and infrastructure automation."

readme = "README.md"

requires-python = ">=3.11"

license = { text = "MIT" }

authors = [
    { name = "Pavan Sai Nekkala" }
]

maintainers = [
    { name = "Pavan Sai Nekkala" }
]

keywords = [
    "quant",
    "finance",
    "portfolio",
    "risk",
    "execution",
    "analytics",
    "algorithmic-trading",
    "investment",
    "python",
    "streamlit",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial",
]

###############################################################################
# Runtime Dependencies
###############################################################################

dependencies = [

    "numpy",

    "pandas",

    "scipy",

    "polars",

    "pyarrow",

    "duckdb",

    "yfinance",

    "vectorbt",

    "plotly",

    "streamlit",

    "fastapi",

    "uvicorn",

    "pydantic",

    "sqlalchemy",

    "requests",

    "httpx",

    "python-dotenv",

    "loguru",

    "rich",

]

###############################################################################
# Optional Dependencies
###############################################################################

[project.optional-dependencies]

dev = [

    "black",

    "ruff",

    "mypy",

    "pytest",

    "pytest-cov",

    "pre-commit",

    "bandit",

    "pip-audit",

    "detect-secrets",

    "mkdocs",

    "mkdocs-material",

    "mkdocs-awesome-pages-plugin",

    "mkdocs-git-revision-date-localized-plugin",

    "mkdocs-mermaid2-plugin",

    "pymdown-extensions",

]

###############################################################################
# URLs
###############################################################################

[project.urls]

Homepage = "https://github.com/sakshinekkala28/Institutional_Quant_Platform"

Repository = "https://github.com/sakshinekkala28/Institutional_Quant_Platform"

Issues = "https://github.com/sakshinekkala28/Institutional_Quant_Platform/issues"

Documentation = "https://sakshinekkala28.github.io/Institutional_Quant_Platform/"

###############################################################################
# Package Discovery
###############################################################################

[tool.setuptools]

include-package-data = true

###############################################################################

[tool.setuptools.packages.find]

where = ["."]

exclude = [

    "tests*",

    "docs*",

    "examples*",

    "scripts*",

    "notebooks*",

]

###############################################################################
# Black
###############################################################################

[tool.black]

line-length = 88

target-version = ["py312"]

include = '\.pyi?$'

exclude = '''

(
    \.git
  | \.venv
  | build
  | dist
  | htmlcov
  | coverage
)
'''

###############################################################################
# Ruff
###############################################################################

[tool.ruff]

line-length = 88

target-version = "py312"

###############################################################################

[tool.ruff.lint]

select = [

    "E",

    "F",

    "W",

    "I",

    "UP",

    "B",

    "SIM",

    "RUF",

]

ignore = [

    "E501",

]

###############################################################################
# Pytest
###############################################################################

[tool.pytest.ini_options]

minversion = "8.0"

testpaths = [

    "tests",

]

python_files = [

    "test_*.py",

]

addopts = [

    "--strict-markers",

    "--strict-config",

    "--cov=.",

    "--cov-report=term-missing",

]

###############################################################################
# Coverage
###############################################################################

[tool.coverage.run]

branch = true

source = [

    ".",

]

omit = [

    "tests/*",

    "docs/*",

]

###############################################################################

[tool.coverage.report]

show_missing = true

skip_covered = false

precision = 2

###############################################################################
# Bandit
###############################################################################

[tool.bandit]

exclude_dirs = [

    "tests",

    "docs",

    ".venv",

]

skips = [

    "B101",

]

###############################################################################
# MyPy
###############################################################################

[tool.mypy]

python_version = "3.12"

strict = true

pretty = true

warn_unused_configs = true

warn_unused_ignores = true

warn_return_any = true

warn_unreachable = true

ignore_missing_imports = true

###############################################################################
# isort (used by Ruff)
###############################################################################

[tool.isort]

profile = "black"

line_length = 88

###############################################################################
# Wheel
###############################################################################

[tool.setuptools.package-data]

"*" = [

    "*.yaml",

    "*.yml",

    "*.json",

    "*.toml",

]

###############################################################################
# End
###############################################################################
