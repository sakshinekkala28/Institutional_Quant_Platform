# ==============================================================================
# Institutional Quant Platform
# Kubernetes Secrets
# ==============================================================================

apiVersion: v1
kind: Secret

metadata:
  name: institutional-quant-secrets
  namespace: institutional-quant

  labels:
    app.kubernetes.io/name: institutional-quant-platform
    app.kubernetes.io/component: secrets

type: Opaque

stringData:

  ###########################################################################
  # Database
  ###########################################################################

  POSTGRES_HOST: "postgres"

  POSTGRES_PORT: "5432"

  POSTGRES_DATABASE: "institutional_quant"

  POSTGRES_USERNAME: "CHANGE_ME"

  POSTGRES_PASSWORD: "CHANGE_ME"

  ###########################################################################
  # Redis
  ###########################################################################

  REDIS_PASSWORD: "CHANGE_ME"

  ###########################################################################
  # JWT
  ###########################################################################

  JWT_SECRET_KEY: "CHANGE_ME_TO_64_CHARACTER_RANDOM_STRING"

  JWT_ALGORITHM: "HS256"

  JWT_EXPIRATION_MINUTES: "60"

  ###########################################################################
  # Encryption
  ###########################################################################

  ENCRYPTION_KEY: "CHANGE_ME"

  ###########################################################################
  # Broker APIs
  ###########################################################################

  ZERODHA_API_KEY: ""

  ZERODHA_API_SECRET: ""

  UPSTOX_API_KEY: ""

  UPSTOX_API_SECRET: ""

  ANGELONE_API_KEY: ""

  ANGELONE_API_SECRET: ""

  IBKR_API_KEY: ""

  IBKR_API_SECRET: ""

  ###########################################################################
  # Market Data
  ###########################################################################

  POLYGON_API_KEY: ""

  ALPHAVANTAGE_API_KEY: ""

  FMP_API_KEY: ""

  TWELVEDATA_API_KEY: ""

  ###########################################################################
  # Notifications
  ###########################################################################

  SMTP_USERNAME: ""

  SMTP_PASSWORD: ""

  SLACK_WEBHOOK: ""

  TEAMS_WEBHOOK: ""

  ###########################################################################
  # GitHub
  ###########################################################################

  GITHUB_TOKEN: ""

  ###########################################################################
  # Grafana
  ###########################################################################

  GRAFANA_ADMIN_USER: "admin"

  GRAFANA_ADMIN_PASSWORD: "CHANGE_ME"

---
# ==============================================================================
# TLS Secret Placeholder
# ==============================================================================

apiVersion: v1

kind: Secret

metadata:

  name: institutional-quant-tls

  namespace: institutional-quant

type: kubernetes.io/tls

data:

  tls.crt: ""

  tls.key: ""

---
# ==============================================================================
# Docker Registry Secret Placeholder
# ==============================================================================

apiVersion: v1

kind: Secret

metadata:

  name: ghcr-secret

  namespace: institutional-quant

type: kubernetes.io/dockerconfigjson

data:

  .dockerconfigjson: ""
