# ==============================================================================
# Institutional Quant Platform
# FastAPI Deployment
# ==============================================================================

apiVersion: apps/v1
kind: Deployment

metadata:
  name: quant-api

  namespace: institutional-quant

  labels:
    app: quant-api
    component: api
    tier: backend

spec:

  replicas: 3

  revisionHistoryLimit: 10

  strategy:

    type: RollingUpdate

    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:

    matchLabels:
      app: quant-api

  template:

    metadata:

      labels:
        app: quant-api
        component: api
        tier: backend

    spec:

      serviceAccountName: default

      terminationGracePeriodSeconds: 30

      securityContext:

        runAsNonRoot: true

        runAsUser: 1000

        fsGroup: 1000

      containers:

      - name: api

        image: ghcr.io/sakshinekkala28/institutional_quant_platform:latest

        imagePullPolicy: Always

        ports:

          - containerPort: 8000

            name: http

        envFrom:

          - configMapRef:
              name: institutional-quant-config

          - secretRef:
              name: institutional-quant-secrets

        resources:

          requests:
            cpu: "500m"
            memory: "512Mi"

          limits:
            cpu: "2000m"
            memory: "2Gi"

        securityContext:

          allowPrivilegeEscalation: false

          readOnlyRootFilesystem: false

          capabilities:
            drop:
              - ALL

        livenessProbe:

          httpGet:
            path: /health
            port: 8000

          initialDelaySeconds: 20
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:

          httpGet:
            path: /health
            port: 8000

          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

        startupProbe:

          httpGet:
            path: /health
            port: 8000

          failureThreshold: 30
          periodSeconds: 5

        volumeMounts:

          - name: data

            mountPath: /app/data

          - name: logs

            mountPath: /app/logs

      volumes:

        - name: data

          persistentVolumeClaim:
            claimName: quant-data-pvc

        - name: logs

          emptyDir: {}

      affinity:

        podAntiAffinity:

          preferredDuringSchedulingIgnoredDuringExecution:

            - weight: 100

              podAffinityTerm:

                topologyKey: kubernetes.io/hostname

                labelSelector:

                  matchLabels:
                    app: quant-api

---
# ==============================================================================
# Service
# ==============================================================================

apiVersion: v1
kind: Service

metadata:

  name: quant-api

  namespace: institutional-quant

spec:

  type: ClusterIP

  selector:

    app: quant-api

  ports:

    - name: http

      port: 80

      targetPort: 8000

      protocol: TCP

---
# ==============================================================================
# Horizontal Pod Autoscaler
# ==============================================================================

apiVersion: autoscaling/v2

kind: HorizontalPodAutoscaler

metadata:

  name: quant-api

  namespace: institutional-quant

spec:

  scaleTargetRef:

    apiVersion: apps/v1

    kind: Deployment

    name: quant-api

  minReplicas: 3

  maxReplicas: 10

  metrics:

    - type: Resource

      resource:

        name: cpu

        target:

          type: Utilization

          averageUtilization: 70

    - type: Resource

      resource:

        name: memory

        target:

          type: Utilization

          averageUtilization: 75
