# ==============================================================================
# Institutional Quant Platform
# Service Accounts & RBAC
# ==============================================================================

###############################################################################
# API Service Account
###############################################################################

apiVersion: v1
kind: ServiceAccount

metadata:
  name: quant-api
  namespace: institutional-quant

---

###############################################################################
# Analytics Service Account
###############################################################################

apiVersion: v1
kind: ServiceAccount

metadata:
  name: quant-analytics
  namespace: institutional-quant

---

###############################################################################
# Dashboard Service Account
###############################################################################

apiVersion: v1
kind: ServiceAccount

metadata:
  name: quant-dashboard
  namespace: institutional-quant

---

###############################################################################
# API Role
###############################################################################

apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: quant-api-role
  namespace: institutional-quant

rules:

- apiGroups: [""]
  resources:
    - configmaps
    - secrets
  verbs:
    - get
    - list

- apiGroups: [""]
  resources:
    - pods

  verbs:
    - get
    - list

---

###############################################################################
# Analytics Role
###############################################################################

apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: quant-analytics-role
  namespace: institutional-quant

rules:

- apiGroups: [""]

  resources:
    - configmaps
    - secrets

  verbs:
    - get
    - list

- apiGroups: [""]

  resources:
    - pods

  verbs:
    - get
    - list

- apiGroups: [""]

  resources:
    - persistentvolumeclaims

  verbs:
    - get
    - list

---

###############################################################################
# Dashboard Role
###############################################################################

apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: quant-dashboard-role
  namespace: institutional-quant

rules:

- apiGroups: [""]

  resources:
    - configmaps

  verbs:
    - get

---

###############################################################################
# API RoleBinding
###############################################################################

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: quant-api-binding
  namespace: institutional-quant

subjects:

- kind: ServiceAccount
  name: quant-api

roleRef:

  apiGroup: rbac.authorization.k8s.io

  kind: Role

  name: quant-api-role

---

###############################################################################
# Analytics RoleBinding
###############################################################################

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: quant-analytics-binding
  namespace: institutional-quant

subjects:

- kind: ServiceAccount
  name: quant-analytics

roleRef:

  apiGroup: rbac.authorization.k8s.io

  kind: Role

  name: quant-analytics-role

---

###############################################################################
# Dashboard RoleBinding
###############################################################################

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: quant-dashboard-binding
  namespace: institutional-quant

subjects:

- kind: ServiceAccount
  name: quant-dashboard

roleRef:

  apiGroup: rbac.authorization.k8s.io

  kind: Role

  name: quant-dashboard-role