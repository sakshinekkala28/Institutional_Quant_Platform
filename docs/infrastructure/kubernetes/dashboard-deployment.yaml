# ==============================================================================
# Institutional Quant Platform
# Dashboard Deployment
# ==============================================================================

apiVersion: apps/v1
kind: Deployment

metadata:
  name: quant-dashboard
  namespace: institutional-quant

  labels:
    app: quant-dashboard
    component: dashboard
    tier: frontend

spec:

  replicas: 2

  revisionHistoryLimit: 10

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: quant-dashboard

  template:

    metadata:

      labels:
        app: quant-dashboard
        component: dashboard
        tier: frontend

    spec:

      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:

      - name: dashboard

        image: ghcr.io/sakshinekkala28/institutional_quant_platform_dashboard:latest

        imagePullPolicy: Always

        ports:

          - containerPort: 8501
            name: http

        envFrom:

          - configMapRef:
              name: institutional-quant-config

          - secretRef:
              name: institutional-quant-secrets

        env:

          - name: API_BASE_URL
            value: "http://quant-api"

        resources:

          requests:
            cpu: "500m"
            memory: "512Mi"

          limits:
            cpu: "2000m"
            memory: "2Gi"

        securityContext:

          allowPrivilegeEscalation: false

          capabilities:
            drop:
              - ALL

        volumeMounts:

          - name: streamlit-config
            mountPath: /home/dashboard/.streamlit

          - name: logs
            mountPath: /app/logs

          - name: cache
            mountPath: /app/cache

        readinessProbe:

          httpGet:
            path: /
            port: 8501

          initialDelaySeconds: 15

          periodSeconds: 15

          timeoutSeconds: 5

        livenessProbe:

          httpGet:
            path: /
            port: 8501

          initialDelaySeconds: 30

          periodSeconds: 30

          timeoutSeconds: 5

        startupProbe:

          httpGet:
            path: /
            port: 8501

          failureThreshold: 30

          periodSeconds: 5

      volumes:

        - name: streamlit-config

          configMap:

            name: streamlit-config

        - name: logs

          emptyDir: {}

        - name: cache

          emptyDir: {}

      affinity:

        podAntiAffinity:

          preferredDuringSchedulingIgnoredDuringExecution:

            - weight: 100

              podAffinityTerm:

                topologyKey: kubernetes.io/hostname

                labelSelector:

                  matchLabels:
                    app: quant-dashboard

---
# ==============================================================================
# Dashboard Service
# ==============================================================================

apiVersion: v1
kind: Service

metadata:

  name: quant-dashboard

  namespace: institutional-quant

spec:

  selector:

    app: quant-dashboard

  ports:

    - name: http

      port: 80

      targetPort: 8501

  type: ClusterIP

---
# ==============================================================================
# Horizontal Pod Autoscaler
# ==============================================================================

apiVersion: autoscaling/v2

kind: HorizontalPodAutoscaler

metadata:

  name: quant-dashboard

  namespace: institutional-quant

spec:

  scaleTargetRef:

    apiVersion: apps/v1

    kind: Deployment

    name: quant-dashboard

  minReplicas: 2

  maxReplicas: 6

  metrics:

    - type: Resource

      resource:

        name: cpu

        target:

          type: Utilization

          averageUtilization: 70

    - type: Resource

      resource:

        name: memory

        target:

          type: Utilization

          averageUtilization: 75