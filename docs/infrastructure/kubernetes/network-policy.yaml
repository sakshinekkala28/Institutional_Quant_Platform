# ==============================================================================
# Institutional Quant Platform
# Network Policies
# ==============================================================================

###############################################################################
# Default Deny All
###############################################################################

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: default-deny-all
  namespace: institutional-quant

spec:

  podSelector: {}

  policyTypes:
    - Ingress
    - Egress

---

###############################################################################
# Dashboard → API
###############################################################################

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: dashboard-to-api
  namespace: institutional-quant

spec:

  podSelector:
    matchLabels:
      app: quant-api

  policyTypes:
    - Ingress

  ingress:

    - from:

        - podSelector:
            matchLabels:
              app: quant-dashboard

      ports:

        - protocol: TCP
          port: 8000

---

###############################################################################
# API → Analytics
###############################################################################

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: api-to-analytics
  namespace: institutional-quant

spec:

  podSelector:
    matchLabels:
      app: quant-analytics

  policyTypes:
    - Ingress

  ingress:

    - from:

        - podSelector:
            matchLabels:
              app: quant-api

---

###############################################################################
# Prometheus Monitoring
###############################################################################

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: prometheus-access
  namespace: institutional-quant

spec:

  podSelector: {}

  policyTypes:
    - Ingress

  ingress:

    - from:

        - namespaceSelector:

            matchLabels:

              name: monitoring

---

###############################################################################
# DNS Access
###############################################################################

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: dns-egress
  namespace: institutional-quant

spec:

  podSelector: {}

  policyTypes:
    - Egress

  egress:

    - to:

        - namespaceSelector:

            matchLabels:

              kubernetes.io/metadata.name: kube-system

      ports:

        - protocol: UDP
          port: 53

        - protocol: TCP
          port: 53

---

###############################################################################
# Internet Access
###############################################################################

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: external-market-data
  namespace: institutional-quant

spec:

  podSelector:

    matchLabels:

      component: analytics

  policyTypes:

    - Egress

  egress:

    - to:

        - ipBlock:

            cidr: 0.0.0.0/0

      ports:

        - protocol: TCP
          port: 443

---

###############################################################################
# Redis
###############################################################################

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:

  name: redis-access

  namespace: institutional-quant

spec:

  podSelector:

    matchLabels:

      app: redis

  ingress:

    - from:

        - podSelector:

            matchLabels:

              component: api

        - podSelector:

            matchLabels:

              component: analytics

  policyTypes:

    - Ingress