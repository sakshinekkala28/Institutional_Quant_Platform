{{- if .Values.persistence.enabled }}

# ==============================================================================
# Institutional Quant Platform
# Persistent Volume Claims
# ==============================================================================

###############################################################################
# Data
###############################################################################

apiVersion: v1
kind: PersistentVolumeClaim

metadata:

  name: {{ include "institutional-quant.fullname" . }}-data

  namespace: {{ include "institutional-quant.namespace" . }}

  labels:
{{ include "institutional-quant.labels" . | indent 4 }}

spec:

  accessModes:

    - ReadWriteOnce

  storageClassName: {{ include "institutional-quant.storageClass" . }}

  resources:

    requests:

      storage: {{ .Values.persistence.data.size }}

---

