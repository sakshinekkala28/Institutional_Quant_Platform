{{- if .Values.secrets.create }}

# ==============================================================================
# Institutional Quant Platform
# Application Secrets
# ==============================================================================

apiVersion: v1
kind: Secret

metadata:

  name: {{ include "institutional-quant.fullname" . }}-secret

  namespace: {{ include "institutional-quant.namespace" . }}

  labels:
{{ include "institutional-quant.labels" . | indent 4 }}

type: Opaque

stringData:

  ###########################################################################
  # Database
  ###########################################################################

  POSTGRES_HOST: {{ .Values.secrets.database.host | quote }}

  POSTGRES_PORT: {{ .Values.secrets.database.port | quote }}

  POSTGRES_DATABASE: {{ .Values.secrets.database.database | quote }}

  POSTGRES_USERNAME: {{ .Values.secrets.database.username | quote }}

  POSTGRES_PASSWORD: {{ .Values.secrets.database.password | quote }}

  ###########################################################################
  # Redis
  ###########################################################################

  REDIS_PASSWORD: {{ .Values.secrets.redis.password | quote }}

  ###########################################################################
  # JWT
  ###########################################################################

  JWT_SECRET_KEY: {{ .Values.secrets.jwt.secret | quote }}

  JWT_ALGORITHM: {{ .Values.secrets.jwt.algorithm | quote }}

  JWT_EXPIRATION_MINUTES: {{ .Values.secrets.jwt.expiration | quote }}

  ###########################################################################
  # Encryption
  ###########################################################################

  ENCRYPTION_KEY: {{ .Values.secrets.encryption.key | quote }}

  ###########################################################################
  # Broker APIs
  ###########################################################################

  ZERODHA_API_KEY: {{ .Values.secrets.brokers.zerodha.apiKey | quote }}

  ZERODHA_API_SECRET: {{ .Values.secrets.brokers.zerodha.apiSecret | quote }}

  UPSTOX_API_KEY: {{ .Values.secrets.brokers.upstox.apiKey | quote }}

  UPSTOX_API_SECRET: {{ .Values.secrets.brokers.upstox.apiSecret | quote }}

  ANGELONE_API_KEY: {{ .Values.secrets.brokers.angelone.apiKey | quote }}

  ANGELONE_API_SECRET: {{ .Values.secrets.brokers.angelone.apiSecret | quote }}

  IBKR_API_KEY: {{ .Values.secrets.brokers.ibkr.apiKey | quote }}

  IBKR_API_SECRET: {{ .Values.secrets.brokers.ibkr.apiSecret | quote }}

  ###########################################################################
  # Market Data Providers
  ###########################################################################

  POLYGON_API_KEY: {{ .Values.secrets.marketData.polygon | quote }}

  ALPHAVANTAGE_API_KEY: {{ .Values.secrets.marketData.alphaVantage | quote }}

  FMP_API_KEY: {{ .Values.secrets.marketData.fmp | quote }}

  TWELVEDATA_API_KEY: {{ .Values.secrets.marketData.twelveData | quote }}

  ###########################################################################
  # Notifications
  ###########################################################################

  SMTP_USERNAME: {{ .Values.secrets.smtp.username | quote }}

  SMTP_PASSWORD: {{ .Values.secrets.smtp.password | quote }}

  SLACK_WEBHOOK: {{ .Values.secrets.notifications.slack | quote }}

  TEAMS_WEBHOOK: {{ .Values.secrets.notifications.teams | quote }}

  ###########################################################################
  # GitHub
  ###########################################################################

  GITHUB_TOKEN: {{ .Values.secrets.github.token | quote }}

  ###########################################################################
  # Grafana
  ###########################################################################

  GRAFANA_ADMIN_USER: {{ .Values.secrets.grafana.username | quote }}

  GRAFANA_ADMIN_PASSWORD: {{ .Values.secrets.grafana.password | quote }}

{{- end }}

---

{{- if and .Values.ingress.enabled .Values.ingress.tls.enabled }}

# ==============================================================================
# TLS Secret Placeholder
# ==============================================================================

apiVersion: v1
kind: Secret

metadata:

  name: {{ include "institutional-quant.tlsSecret" . }}

  namespace: {{ include "institutional-quant.namespace" . }}

type: kubernetes.io/tls

data:

  tls.crt: ""

  tls.key: ""

{{- end }}