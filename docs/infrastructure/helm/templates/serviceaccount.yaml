{{- if .Values.rbac.create }}

# ==============================================================================
# API ServiceAccount
# ==============================================================================

apiVersion: v1
kind: ServiceAccount

metadata:

  name: {{ include "institutional-quant.apiName" . }}

  namespace: {{ include "institutional-quant.namespace" . }}

  labels:
{{ include "institutional-quant.labels" . | indent 4 }}

automountServiceAccountToken: false

---

# ==============================================================================
# Analytics ServiceAccount
# ==============================================================================

apiVersion: v1
kind: ServiceAccount

metadata:

  name: {{ include "institutional-quant.analyticsName" . }}

  namespace: {{ include "institutional-quant.namespace" . }}

  labels:
{{ include "institutional-quant.labels" . | indent 4 }}

automountServiceAccountToken: false

---

# ==============================================================================
# Dashboard ServiceAccount
# ==============================================================================

apiVersion: v1
kind: ServiceAccount

metadata:

  name: {{ include "institutional-quant.dashboardName" . }}

  namespace: {{ include "institutional-quant.namespace" . }}

  labels:
{{ include "institutional-quant.labels" . | indent 4 }}

automountServiceAccountToken: false

---

# ==============================================================================
# API Role
# ==============================================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:

  name: {{ include "institutional-quant.apiName" . }}

  namespace: {{ include "institutional-quant.namespace" . }}

rules:

- apiGroups: [""]

  resources:
    - configmaps
    - secrets

  verbs:
    - get
    - list
    - watch

- apiGroups: [""]

  resources:
    - pods

  verbs:
    - get
    - list

---

# ==============================================================================
# Analytics Role
# ==============================================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:

  name: {{ include "institutional-quant.analyticsName" . }}

  namespace: {{ include "institutional-quant.namespace" . }}

rules:

- apiGroups: [""]

  resources:
    - configmaps
    - secrets
    - persistentvolumeclaims

  verbs:
    - get
    - list
    - watch

- apiGroups: [""]

  resources:
    - pods

  verbs:
    - get
    - list

---

# ==============================================================================
# Dashboard Role
# ==============================================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:

  name: {{ include "institutional-quant.dashboardName" . }}

  namespace: {{ include "institutional-quant.namespace" . }}

rules:

- apiGroups: [""]

  resources:
    - configmaps

  verbs:
    - get
    - list

---

# ==============================================================================
# API RoleBinding
# ==============================================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:

  name: {{ include "institutional-quant.apiName" . }}

  namespace: {{ include "institutional-quant.namespace" . }}

subjects:

- kind: ServiceAccount

  name: {{ include "institutional-quant.apiName" . }}

roleRef:

  apiGroup: rbac.authorization.k8s.io

  kind: Role

  name: {{ include "institutional-quant.apiName" . }}

---

# ==============================================================================
# Analytics RoleBinding
# ==============================================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:

  name: {{ include "institutional-quant.analyticsName" . }}

  namespace: {{ include "institutional-quant.namespace" . }}

subjects:

- kind: ServiceAccount

  name: {{ include "institutional-quant.analyticsName" . }}

roleRef:

  apiGroup: rbac.authorization.k8s.io

  kind: Role

  name: {{ include "institutional-quant.analyticsName" . }}

---

# ==============================================================================
# Dashboard RoleBinding
# ==============================================================================

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:

  name: {{ include "institutional-quant.dashboardName" . }}

  namespace: {{ include "institutional-quant.namespace" . }}

subjects:

- kind: ServiceAccount

  name: {{ include "institutional-quant.dashboardName" . }}

roleRef:

  apiGroup: rbac.authorization.k8s.io

  kind: Role

  name: {{ include "institutional-quant.dashboardName" . }}

{{- end }}