{{- if .Values.ingress.enabled }}

# ==============================================================================
# Institutional Quant Platform
# Ingress
# ==============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:

  name: {{ include "institutional-quant.fullname" . }}

  namespace: {{ include "institutional-quant.namespace" . }}

  labels:
{{ include "institutional-quant.labels" . | indent 4 }}

  annotations:

    kubernetes.io/ingress.class: {{ .Values.ingress.className }}

    cert-manager.io/cluster-issuer: letsencrypt-prod

    nginx.ingress.kubernetes.io/ssl-redirect: "{{ .Values.ingress.tls.enabled }}"

    nginx.ingress.kubernetes.io/force-ssl-redirect: "{{ .Values.ingress.tls.enabled }}"

    nginx.ingress.kubernetes.io/backend-protocol: HTTP

    nginx.ingress.kubernetes.io/proxy-body-size: "100m"

    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"

    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"

    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"

    nginx.ingress.kubernetes.io/use-gzip: "true"

    nginx.ingress.kubernetes.io/enable-cors: "true"

    nginx.ingress.kubernetes.io/cors-allow-origin: "*"

    nginx.ingress.kubernetes.io/cors-allow-methods: "GET,POST,PUT,DELETE,OPTIONS"

    nginx.ingress.kubernetes.io/cors-allow-headers: "*"

    nginx.ingress.kubernetes.io/limit-rps: "20"

    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"

spec:

  ingressClassName: {{ .Values.ingress.className }}

{{- if .Values.ingress.tls.enabled }}

  tls:

    - hosts:

        - {{ .Values.ingress.hostname }}

      secretName: {{ include "institutional-quant.tlsSecret" . }}

{{- end }}

  rules:

    - host: {{ include "institutional-quant.hostname" . }}

      http:

        paths:

###############################################################################
# Dashboard
###############################################################################

        - path: /

          pathType: Prefix

          backend:

            service:

              name: {{ include "institutional-quant.dashboardName" . }}

              port:

                number: {{ .Values.dashboard.service.port }}

###############################################################################
# API
###############################################################################

        - path: /api

          pathType: Prefix

          backend:

            service:

              name: {{ include "institutional-quant.apiName" . }}

              port:

                number: {{ .Values.api.service.port }}

{{- end }}
