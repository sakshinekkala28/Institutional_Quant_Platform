###############################################################################
# Institutional Quant Platform
# Development Overrides
###############################################################################

global:

  environment: development

###############################################################################
# Images
###############################################################################

images:

  api:
    tag: dev

  analytics:
    tag: dev

  dashboard:
    tag: dev

###############################################################################
# API
###############################################################################

api:

  replicas: 1

  resources:

    requests:

      cpu: 100m

      memory: 256Mi

    limits:

      cpu: 500m

      memory: 512Mi

###############################################################################
# Analytics
###############################################################################

analytics:

  replicas: 1

  resources:

    requests:

      cpu: 500m

      memory: 1Gi

    limits:

      cpu: 1000m

      memory: 2Gi

###############################################################################
# Dashboard
###############################################################################

dashboard:

  replicas: 1

  resources:

    requests:

      cpu: 100m

      memory: 256Mi

    limits:

      cpu: 500m

      memory: 512Mi

###############################################################################
# Autoscaling
###############################################################################

autoscaling:

  enabled: false

###############################################################################
# Ingress
###############################################################################

ingress:

  enabled: true

  hostname: localhost

  tls:

    enabled: false

###############################################################################
# Persistence
###############################################################################

persistence:

  data:

    size: 10Gi

  cache:

    size: 2Gi

  logs:

    size: 5Gi

  reports:

    size: 5Gi

  models:

    size: 10Gi

###############################################################################
# Monitoring
###############################################################################

monitoring:

  prometheus:

    enabled: false

  grafana:

    enabled: false

###############################################################################
# Redis
###############################################################################

redis:

  enabled: true

###############################################################################
# Logging
###############################################################################

logging:

  level: DEBUG

###############################################################################
# Feature Flags
###############################################################################

features:

  backtesting: true

  liveTrading: false

  portfolioOptimization: true

  riskEngine: true

  monitoring: false

###############################################################################
# Environment Variables
###############################################################################

env:

  PLATFORM_ENV: development

  TZ: Asia/Kolkata

###############################################################################
# Security
###############################################################################

security:

  podSecurityContext:

    runAsNonRoot: true

###############################################################################
# Node Scheduling
###############################################################################

nodeSelector: {}

tolerations: []

affinity: {}
