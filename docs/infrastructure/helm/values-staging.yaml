###############################################################################
# Institutional Quant Platform
# Staging Environment
###############################################################################

global:

  environment: staging

###############################################################################
# Images
###############################################################################

images:

  api:

    tag: rc

  analytics:

    tag: rc

  dashboard:

    tag: rc

###############################################################################
# API
###############################################################################

api:

  replicas: 2

  resources:

    requests:

      cpu: 500m

      memory: 512Mi

    limits:

      cpu: 2000m

      memory: 2Gi

###############################################################################
# Analytics
###############################################################################

analytics:

  replicas: 2

  resources:

    requests:

      cpu: 2

      memory: 4Gi

    limits:

      cpu: 6

      memory: 12Gi

###############################################################################
# Dashboard
###############################################################################

dashboard:

  replicas: 2

  resources:

    requests:

      cpu: 500m

      memory: 512Mi

    limits:

      cpu: 2

      memory: 2Gi

###############################################################################
# Autoscaling
###############################################################################

autoscaling:

  enabled: true

  minReplicas: 2

  maxReplicas: 5

  cpuUtilization: 70

  memoryUtilization: 75

###############################################################################
# Ingress
###############################################################################

ingress:

  enabled: true

  className: nginx

  hostname: staging.quant.example.com

  tls:

    enabled: true

    secretName: staging-quant-tls

###############################################################################
# Persistence
###############################################################################

persistence:

  enabled: true

  storageClass: quant-storage

  data:

    size: 50Gi

  cache:

    size: 10Gi

  logs:

    size: 20Gi

  reports:

    size: 20Gi

  models:

    size: 50Gi

###############################################################################
# Redis
###############################################################################

redis:

  enabled: true

  architecture: standalone

  auth:

    enabled: true

###############################################################################
# Monitoring
###############################################################################

monitoring:

  prometheus:

    enabled: true

  grafana:

    enabled: true

###############################################################################
# Logging
###############################################################################

logging:

  level: INFO

###############################################################################
# Feature Flags
###############################################################################

features:

  backtesting: true

  liveTrading: false

  portfolioOptimization: true

  riskEngine: true

  monitoring: true

###############################################################################
# Environment Variables
###############################################################################

env:

  PLATFORM_ENV: staging

  TZ: Asia/Kolkata

###############################################################################
# Security
###############################################################################

security:

  podSecurityContext:

    runAsNonRoot: true

    runAsUser: 1000

    fsGroup: 1000

###############################################################################
# Node Scheduling
###############################################################################

nodeSelector: {}

tolerations: []

affinity: {}
