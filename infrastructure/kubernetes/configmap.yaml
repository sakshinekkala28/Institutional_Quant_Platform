# ==============================================================================
# Institutional Quant Platform
# ConfigMap
# ==============================================================================

apiVersion: v1
kind: ConfigMap

metadata:
  name: institutional-quant-config
  namespace: institutional-quant

  labels:
    app.kubernetes.io/name: institutional-quant-platform
    app.kubernetes.io/component: configuration

data:

  ###########################################################################
  # Platform
  ###########################################################################

  PLATFORM_NAME: "Institutional Quant Platform"
  PLATFORM_ENV: "production"
  PLATFORM_VERSION: "1.0.0"

  ###########################################################################
  # API
  ###########################################################################

  API_HOST: "0.0.0.0"
  API_PORT: "8000"

  ###########################################################################
  # Dashboard
  ###########################################################################

  DASHBOARD_HOST: "0.0.0.0"
  DASHBOARD_PORT: "8501"

  ###########################################################################
  # Analytics
  ###########################################################################

  ANALYTICS_WORKERS: "4"

  ###########################################################################
  # Logging
  ###########################################################################

  LOG_LEVEL: "INFO"

  ###########################################################################
  # Feature Flags
  ###########################################################################

  ENABLE_BACKTEST: "true"
  ENABLE_LIVE_TRADING: "false"
  ENABLE_REBALANCING: "true"
  ENABLE_RISK_ENGINE: "true"
  ENABLE_MONITORING: "true"

  ###########################################################################
  # Storage
  ###########################################################################

  DATA_DIRECTORY: "/app/data"
  CACHE_DIRECTORY: "/app/cache"
  LOG_DIRECTORY: "/app/logs"

  ###########################################################################
  # DuckDB
  ###########################################################################

  DUCKDB_PATH: "/app/data/institutional_quant.db"

  ###########################################################################
  # Portfolio
  ###########################################################################

  MAX_POSITIONS: "50"
  MAX_POSITION_WEIGHT: "0.025"

  ###########################################################################
  # Scheduler
  ###########################################################################

  PIPELINE_INTERVAL: "daily"

  ###########################################################################
  # Monitoring
  ###########################################################################

  METRICS_ENABLED: "true"
  PROMETHEUS_ENABLED: "true"

  ###########################################################################
  # Timezone
  ###########################################################################

  TZ: "Asia/Kolkata"

---
# ==============================================================================
# Streamlit Configuration
# ==============================================================================

apiVersion: v1
kind: ConfigMap

metadata:
  name: streamlit-config
  namespace: institutional-quant

data:

  config.toml: |

    [server]
    headless = true
    port = 8501
    address = "0.0.0.0"
    enableCORS = false
    enableXsrfProtection = true

    [browser]
    gatherUsageStats = false

    [theme]
    base = "dark"

---
# ==============================================================================
# Uvicorn Configuration
# ==============================================================================

apiVersion: v1
kind: ConfigMap

metadata:
  name: uvicorn-config
  namespace: institutional-quant

data:

  workers: "4"

  timeout: "60"

  keepalive: "5"