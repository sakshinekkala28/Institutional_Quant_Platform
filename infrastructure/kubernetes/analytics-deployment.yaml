# ==============================================================================
# Institutional Quant Platform
# Analytics Engine Deployment
# ==============================================================================

apiVersion: apps/v1
kind: Deployment

metadata:
  name: quant-analytics
  namespace: institutional-quant

  labels:
    app: quant-analytics
    component: analytics
    tier: backend

spec:

  replicas: 2

  revisionHistoryLimit: 10

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: quant-analytics

  template:

    metadata:

      labels:
        app: quant-analytics
        component: analytics
        tier: backend

    spec:

      terminationGracePeriodSeconds: 60

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:

      - name: analytics

        image: ghcr.io/sakshinekkala28/institutional_quant_platform_analytics:latest

        imagePullPolicy: Always

        command:
          - python
          - -m
          - orchestration.run_pipeline

        envFrom:

          - configMapRef:
              name: institutional-quant-config

          - secretRef:
              name: institutional-quant-secrets

        resources:

          requests:
            cpu: "2000m"
            memory: "4Gi"

          limits:
            cpu: "8000m"
            memory: "16Gi"

        securityContext:

          allowPrivilegeEscalation: false

          capabilities:
            drop:
              - ALL

        volumeMounts:

          - name: data

            mountPath: /app/data

          - name: cache

            mountPath: /app/cache

          - name: logs

            mountPath: /app/logs

        livenessProbe:

          exec:
            command:
              - python
              - -c
              - "print('healthy')"

          initialDelaySeconds: 30

          periodSeconds: 30

        readinessProbe:

          exec:
            command:
              - python
              - -c
              - "print('ready')"

          initialDelaySeconds: 20

          periodSeconds: 20

      volumes:

        - name: data

          persistentVolumeClaim:
            claimName: quant-data-pvc

        - name: cache

          persistentVolumeClaim:
            claimName: quant-cache-pvc

        - name: logs

          emptyDir: {}

      affinity:

        podAntiAffinity:

          preferredDuringSchedulingIgnoredDuringExecution:

            - weight: 100

              podAffinityTerm:

                topologyKey: kubernetes.io/hostname

                labelSelector:

                  matchLabels:
                    app: quant-analytics

---
# ==============================================================================
# Service
# ==============================================================================

apiVersion: v1
kind: Service

metadata:

  name: quant-analytics

  namespace: institutional-quant

spec:

  selector:

    app: quant-analytics

  type: ClusterIP

  ports:

    - name: metrics

      port: 9091

      targetPort: 9091

---
# ==============================================================================
# Horizontal Pod Autoscaler
# ==============================================================================

apiVersion: autoscaling/v2

kind: HorizontalPodAutoscaler

metadata:

  name: quant-analytics

  namespace: institutional-quant

spec:

  scaleTargetRef:

    apiVersion: apps/v1

    kind: Deployment

    name: quant-analytics

  minReplicas: 2

  maxReplicas: 8

  metrics:

    - type: Resource

      resource:

        name: cpu

        target:

          type: Utilization

          averageUtilization: 75

    - type: Resource

      resource:

        name: memory

        target:

          type: Utilization

          averageUtilization: 80