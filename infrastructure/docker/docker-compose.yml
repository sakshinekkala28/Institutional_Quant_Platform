version: "3.9"

###############################################################################
# Institutional Quant Platform
###############################################################################

name: institutional-quant-platform

services:

###############################################################################
# FastAPI
###############################################################################

  api:

    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api

    image: institutional-quant-api:latest

    container_name: quant-api

    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - ../../.env

    environment:
      PLATFORM_ENV: development

    volumes:
      - ../../:/app

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - quant-network

    healthcheck:
      test: ["CMD","curl","-f","http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

###############################################################################
# Analytics Engine
###############################################################################

  analytics:

    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.analytics

    image: institutional-analytics:latest

    container_name: quant-analytics

    restart: unless-stopped

    env_file:
      - ../../.env

    environment:
      PLATFORM_ENV: development

    volumes:
      - ../../:/app

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - quant-network

###############################################################################
# Dashboard
###############################################################################

  dashboard:

    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.dashboard

    image: institutional-dashboard:latest

    container_name: quant-dashboard

    restart: unless-stopped

    ports:
      - "8501:8501"

    env_file:
      - ../../.env

    volumes:
      - ../../:/app

    depends_on:
      api:
        condition: service_started

    networks:
      - quant-network

###############################################################################
# Redis
###############################################################################

  redis:

    image: redis:7-alpine

    container_name: quant-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis-data:/data

    networks:
      - quant-network

    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
      timeout: 5s
      retries: 5

###############################################################################
# Prometheus
###############################################################################

  prometheus:

    image: prom/prometheus:latest

    container_name: quant-prometheus

    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

    networks:
      - quant-network

###############################################################################
# Grafana
###############################################################################

  grafana:

    image: grafana/grafana:latest

    container_name: quant-grafana

    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

    volumes:
      - grafana-data:/var/lib/grafana

    networks:
      - quant-network

###############################################################################
# Loki
###############################################################################

  loki:

    image: grafana/loki:latest

    container_name: quant-loki

    restart: unless-stopped

    ports:
      - "3100:3100"

    command:
      - "-config.file=/etc/loki/local-config.yaml"

    networks:
      - quant-network

###############################################################################
# NGINX
###############################################################################

  nginx:

    image: nginx:stable-alpine

    container_name: quant-nginx

    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf

    depends_on:
      - api
      - dashboard

    networks:
      - quant-network

###############################################################################
# Networks
###############################################################################

networks:

  quant-network:

    driver: bridge

###############################################################################
# Volumes
###############################################################################

volumes:

  redis-data:

  grafana-data: