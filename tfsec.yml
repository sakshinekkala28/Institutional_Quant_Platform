###############################################################################
# Institutional Quant Platform
# tfsec Configuration
###############################################################################

###############################################################################
# General
###############################################################################

minimum_severity: MEDIUM

###############################################################################
# Directories
###############################################################################

exclude_paths:

  - .git/

  - .github/

  - docs/

  - site/

  - build/

  - dist/

  - htmlcov/

  - coverage/

  - node_modules/

  - tests/

###############################################################################
# Output
###############################################################################

format: sarif

###############################################################################
# Include Passed Checks
###############################################################################

include_passed: false

###############################################################################
# Ignore Warnings
###############################################################################

disable_grouping: false

###############################################################################
# Ignore Unknown Modules
###############################################################################

ignore_hcl_errors: false

###############################################################################
# Variables
###############################################################################

evaluate_variables: true

###############################################################################
# Module Downloads
###############################################################################

no_module_downloads: false

###############################################################################
# Force Checks
###############################################################################

force_all_dirs: true

###############################################################################
# Exclusions
###############################################################################

exclude:

###############################################################################
# AWS

###############################################################################
# Azure

###############################################################################
# GCP

###############################################################################
# Kubernetes

###############################################################################
# Logging
###############################################################################

verbose: false

###############################################################################
# Workspace
###############################################################################

workspace: default
